# Site-wide taopmd conventions for tapoueh.org.
#
# At the repository root, so every article inherits it: taopmd walks from
# a document's directory up to the .git and merges what it finds, nearest
# file winning. An article's own taopmd.yaml says what is different about
# that article -- which PostgreSQL its queries run against, usually --
# and nothing else.
#
# These three lived in taop.mk as flags on the taopmd invocation, which
# meant `taopmd build` and `make` produced different files from the same
# source: the conventions were in the Makefile where the tool could not
# see them. Here, the tool alone reproduces exactly what the site
# publishes.
render:
  # Captured psql output is fenced ```results on this site, which is what
  # the hand-written articles have always done.
  capture_fence: results
  # Drop psql's "(N rows)" footer: it is noise in prose, and the row
  # count is either in the text or beside the point.
  strip_row_count: true
  # 0 leaves captured EXPLAIN output as psql wrapped it. The book reflows
  # to a column budget because it has a fixed page width; a web page does
  # not.
  width: 0
