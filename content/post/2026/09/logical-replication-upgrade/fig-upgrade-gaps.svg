<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="What a subscription's initial copy does not bring over: sequences, materialized view content, and large objects are missing; DDL made during the migration is not noticed. A generated column is the one piece of good news, recomputed correctly by the subscriber." >
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .good { fill: #e4f4e6; stroke: #2e7d32; rx: 8; }
    .bad { fill: #fbe9e7; stroke: #c62828; stroke-width: 1.5; rx: 8; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
    }
  </style>
  <text class="b" x="20" y="26">copy_data = true copies the tables. It does not copy everything the tables depend on.</text>

  <rect class="bad" x="20" y="50" width="160" height="180"/>
  <text class="b" x="100" y="76" text-anchor="middle">sequences</text>
  <text class="small" x="100" y="104" text-anchor="middle">last_value is</text>
  <text class="small" x="100" y="120" text-anchor="middle">NULL on new</text>
  <text class="small" x="100" y="148" text-anchor="middle">first insert hits</text>
  <text class="small" x="100" y="164" text-anchor="middle">a duplicate</text>
  <text class="small" x="100" y="180" text-anchor="middle">primary key</text>

  <rect class="bad" x="195" y="50" width="160" height="180"/>
  <text class="b" x="275" y="76" text-anchor="middle">materialized</text>
  <text class="b" x="275" y="92" text-anchor="middle">view</text>
  <text class="small" x="275" y="120" text-anchor="middle">the view exists</text>
  <text class="small" x="275" y="148" text-anchor="middle">but is not</text>
  <text class="small" x="275" y="164" text-anchor="middle">populated</text>

  <rect class="bad" x="370" y="50" width="160" height="180"/>
  <text class="b" x="450" y="76" text-anchor="middle">large objects</text>
  <text class="small" x="450" y="104" text-anchor="middle">the oid column</text>
  <text class="small" x="450" y="120" text-anchor="middle">copies, the blob</text>
  <text class="small" x="450" y="136" text-anchor="middle">behind it does not</text>
  <text class="small" x="450" y="164" text-anchor="middle">"large object N</text>
  <text class="small" x="450" y="180" text-anchor="middle">does not exist"</text>

  <rect class="bad" x="545" y="50" width="160" height="180"/>
  <text class="b" x="625" y="76" text-anchor="middle">DDL mid-migration</text>
  <text class="small" x="625" y="104" text-anchor="middle">the old server</text>
  <text class="small" x="625" y="120" text-anchor="middle">does not notice</text>
  <text class="small" x="625" y="148" text-anchor="middle">apply worker stops:</text>
  <text class="small" x="625" y="164" text-anchor="middle">"missing replicated</text>
  <text class="small" x="625" y="180" text-anchor="middle">column"</text>

  <rect class="good" x="720" y="50" width="160" height="180"/>
  <text class="b" x="800" y="76" text-anchor="middle">generated</text>
  <text class="b" x="800" y="92" text-anchor="middle">columns</text>
  <text class="small" x="800" y="120" text-anchor="middle">recomputed by</text>
  <text class="small" x="800" y="136" text-anchor="middle">the subscriber</text>
  <text class="small" x="800" y="164" text-anchor="middle">which is what</text>
  <text class="small" x="800" y="180" text-anchor="middle">you want</text>

  <text class="small" x="450" y="260" text-anchor="middle">Four gaps to close by hand after the copy finishes, and one thing that just works.</text>
</svg>
