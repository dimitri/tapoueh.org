<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="pg_upgrade link mode timed on three reshapes of the same schema. A table with 1000 rows takes 1.69 seconds. The same table with 5 million rows, 591 megabytes, takes 1.64 seconds, no measurable difference. 5000 near-empty tables take 6.47 seconds, four times longer." >
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .axis { stroke: #889; stroke-width: 1; }
    .grid { stroke: #ccc; stroke-width: 1; stroke-dasharray: 3 3; }
    .ref { stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .bar-flat { fill: #60b2d3; stroke: #2c7f9e; stroke-width: 1.5; }
    .bar-up { fill: #fbe9e7; stroke: #c62828; stroke-width: 1.5; }
    .small { font-size: 12px; fill: #444; }
    .tiny { font-size: 11px; fill: #667; }
    .b { font-weight: 600; }
    .val { font-weight: 700; font-size: 13px; fill: #222; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; } .tiny { fill: #9aa; }
      .axis { stroke: #99a; } .grid { stroke: #444; } .ref { stroke: #ff9a57; }
      .bar-flat { fill: #2c7f9e; stroke: #60b2d3; } .bar-up { fill: #3a2020; stroke: #ef5350; }
      .val { fill: #e8e8e8; }
    }
  </style>
  <text class="b" x="20" y="24">pg_upgrade --link: same tiny schema, reshaped three ways</text>

  <!-- y axis -->
  <line class="axis" x1="60" y1="60" x2="60" y2="250"/>
  <line class="axis" x1="60" y1="250" x2="860" y2="250"/>
  <line class="grid" x1="60" y1="200" x2="860" y2="200"/>
  <text class="tiny" x="52" y="254" text-anchor="end">0s</text>
  <text class="tiny" x="52" y="204" text-anchor="end">2s</text>
  <line class="grid" x1="60" y1="150" x2="860" y2="150"/>
  <text class="tiny" x="52" y="154" text-anchor="end">4s</text>
  <line class="grid" x1="60" y1="100" x2="860" y2="100"/>
  <text class="tiny" x="52" y="104" text-anchor="end">6s</text>

  <!-- reference line at the small-schema height -->
  <line class="ref" x1="60" y1="207.75" x2="860" y2="207.75"/>

  <!-- bar 1: 1,000 rows -->
  <rect class="bar-flat" x="130" y="207.75" width="110" height="42.25"/>
  <text class="val" x="185" y="198" text-anchor="middle">1.69s</text>
  <text class="small" x="185" y="268" text-anchor="middle">1,000-row table</text>
  <text class="small" x="185" y="284" text-anchor="middle">one index</text>

  <!-- bar 2: 5M rows -->
  <rect class="bar-flat" x="290" y="209" width="110" height="41"/>
  <text class="val" x="345" y="199" text-anchor="middle">1.64s</text>
  <text class="small" x="345" y="268" text-anchor="middle">5,000,000-row table</text>
  <text class="small" x="345" y="284" text-anchor="middle">591 MB, one index</text>

  <text class="small" x="265" y="135" text-anchor="middle">500x the data,</text>
  <text class="small" x="265" y="151" text-anchor="middle">no measurable difference</text>

  <!-- bar 3: 5000 tables -->
  <rect class="bar-up" x="620" y="88.25" width="110" height="161.75"/>
  <text class="val" x="675" y="78" text-anchor="middle">6.47s</text>
  <text class="small" x="675" y="268" text-anchor="middle">5,000 near-empty</text>
  <text class="small" x="675" y="284" text-anchor="middle">tables</text>

  <text class="small" x="760" y="135" text-anchor="middle">5,000x the tables,</text>
  <text class="small" x="760" y="151" text-anchor="middle">4x the time</text>
</svg>
