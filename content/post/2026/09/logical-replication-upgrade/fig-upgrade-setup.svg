<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Before the cutover: the application writes to the old server, a subscription on the new server copies and follows it, and a reverse subscription on the old server is ready for the way back">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect class="box" x="10" y="120" width="130" height="100"/>
  <text class="b" x="75.0" y="142" text-anchor="middle">application</text>
  <text class="small" x="75.0" y="162" text-anchor="middle">writes to the</text>
  <text class="small" x="75.0" y="179" text-anchor="middle">old server</text>
  <rect class="box" x="250" y="40" width="200" height="260"/>
  <text class="b" x="350.0" y="62" text-anchor="middle">old server</text>
  <text class="small" x="350.0" y="82" text-anchor="middle">Postgres 16</text>
  <text class="small" x="350.0" y="99" text-anchor="middle"></text>
  <text class="small" x="350.0" y="116" text-anchor="middle">publication app_pub</text>
  <text class="small" x="350.0" y="133" text-anchor="middle">(all tables)</text>
  <text class="small" x="350.0" y="150" text-anchor="middle"></text>
  <text class="small" x="350.0" y="167" text-anchor="middle">subscription app_rev</text>
  <text class="small" x="350.0" y="184" text-anchor="middle">origin = none</text>
  <text class="small" x="350.0" y="201" text-anchor="middle">copy_data = false</text>
  <rect class="box hi" x="700" y="40" width="190" height="260"/>
  <text class="b" x="795.0" y="62" text-anchor="middle">new server</text>
  <text class="small" x="795.0" y="82" text-anchor="middle">Postgres 18</text>
  <text class="small" x="795.0" y="99" text-anchor="middle"></text>
  <text class="small" x="795.0" y="116" text-anchor="middle">subscription app_sub</text>
  <text class="small" x="795.0" y="133" text-anchor="middle">copy_data = true</text>
  <text class="small" x="795.0" y="150" text-anchor="middle">origin = none</text>
  <text class="small" x="795.0" y="167" text-anchor="middle"></text>
  <text class="small" x="795.0" y="184" text-anchor="middle">publication app_pub</text>
  <text class="small" x="795.0" y="201" text-anchor="middle">(from the schema dump)</text>
  <path class="a" d="M140 170 L250 170"/>
  <path class="a" d="M450 120 L700 120"/>
  <text class="small" x="460" y="108" text-anchor="start">app_sub: initial copy, then changes</text>
  <path class="o dash" d="M700 230 L450 230"/>
  <text class="small" x="460" y="218" text-anchor="start">app_rev: what new writes</text>
  <text class="small" x="460" y="252" text-anchor="start">(prepared now, for the way back)</text>
</svg>
