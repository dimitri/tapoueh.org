<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Three tools for the same job, cheapest to most elaborate. pg_dump and pg_restore cover everything but downtime scales with data size. pgcopydb parallelizes the same work, same coverage, shorter downtime. pgcopydb follow, or pglogical, add change data capture so the downtime shrinks to a cutover event, and both reach back to Postgres 9.4 sources.">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .badge { font-weight: 700; font-size: 12px; }
    .badge-ok { fill: #c2570c; }
    .badge-good { fill: #2e7d32; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .good { fill: #1d3322; stroke: #66bb6a; }
      .a { stroke: #6ea8ff; } .badge-ok { fill: #ff9a57; } .badge-good { fill: #66bb6a; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
  </defs>

  <text class="b" x="20" y="24">Three tools, same job, cheapest to most elaborate</text>

  <rect class="box" x="20" y="48" width="255" height="190"/>
  <text class="b" x="147.5" y="74" text-anchor="middle">pg_dump | pg_restore</text>
  <text class="small" x="147.5" y="100" text-anchor="middle">covers everything:</text>
  <text class="small" x="147.5" y="116" text-anchor="middle">every object type,</text>
  <text class="small" x="147.5" y="132" text-anchor="middle">any source version</text>
  <text class="small" x="147.5" y="158" text-anchor="middle">single-threaded by</text>
  <text class="small" x="147.5" y="174" text-anchor="middle">default; downtime</text>
  <text class="small" x="147.5" y="190" text-anchor="middle">scales with data size</text>
  <text class="badge badge-ok" x="147.5" y="222" text-anchor="middle">a full stop, sized to the data</text>

  <path class="a" d="M275 143 L320 143"/>

  <rect class="box" x="320" y="48" width="255" height="190"/>
  <text class="b" x="447.5" y="74" text-anchor="middle">pgcopydb clone</text>
  <text class="small" x="447.5" y="100" text-anchor="middle">same coverage, same</text>
  <text class="small" x="447.5" y="116" text-anchor="middle">pg_dump/pg_restore</text>
  <text class="small" x="447.5" y="132" text-anchor="middle">underneath</text>
  <text class="small" x="447.5" y="158" text-anchor="middle">parallel COPY and</text>
  <text class="small" x="447.5" y="174" text-anchor="middle">concurrent index</text>
  <text class="small" x="447.5" y="190" text-anchor="middle">builds, driven directly</text>
  <text class="badge badge-ok" x="447.5" y="222" text-anchor="middle">a full stop, shorter</text>

  <path class="a" d="M575 143 L620 143"/>

  <rect class="box good" x="620" y="48" width="255" height="190"/>
  <text class="b" x="747.5" y="74" text-anchor="middle">pgcopydb follow /</text>
  <text class="b" x="747.5" y="92" text-anchor="middle">pglogical</text>
  <text class="small" x="747.5" y="118" text-anchor="middle">adds change data</text>
  <text class="small" x="747.5" y="134" text-anchor="middle">capture: the target</text>
  <text class="small" x="747.5" y="150" text-anchor="middle">keeps catching up</text>
  <text class="small" x="747.5" y="176" text-anchor="middle">both reach back to</text>
  <text class="small" x="747.5" y="192" text-anchor="middle">Postgres 9.4 sources</text>
  <text class="badge badge-good" x="747.5" y="222" text-anchor="middle">downtime shrinks to a cutover</text>

  <text class="small" x="450" y="268" text-anchor="middle">pgcopydb follow talks to the logical decoding API directly, no extension to install;</text>
  <text class="small" x="450" y="284" text-anchor="middle">pglogical is the extension, with its own replication-set and conflict-handling model.</text>
</svg>
