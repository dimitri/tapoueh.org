<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-label="A real architecture, not just the pair this post upgrades. The application writes to the primary. Highlighted together, application and primary are the single pair this post's pg_upgrade and logical-replication sections cover. Outside that highlight: the primary streams to standby A and standby B for failover, ships WAL to an archive, and sends periodic base backups to separate storage. None of those three are addressed by upgrading one pair of servers.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #fff; }
    .title { font-family: system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #222; }
    .node-title { font-size: 20px; font-weight: 700; }
    .node-sub { font-size: 13px; fill: #eef3fb; }
    .app-title { font-size: 20px; font-weight: 700; fill: #2a6fdb; }
    .caption { font-size: 13.5px; fill: #444; }
    .tag { font-size: 13px; font-weight: 600; fill: #2a6fdb; }
    .zone { fill: #eef3fb; stroke: none; }
    .pill { fill: #fff; stroke: #8aa6d6; stroke-width: 1.5; }
    .app { fill: #fff; stroke: #2a6fdb; stroke-width: 3; }
    .primary { fill: #2a6fdb; }
    .standby { fill: #3aa0c9; }
    .archive { fill: #c2570c; }
    .backup { fill: #2e7d32; }
    .lw { stroke: #2a6fdb; stroke-width: 3; fill: none; marker-end: url(#mw); }
    .lr { stroke: #37414f; stroke-width: 3; fill: none; marker-end: url(#mr); }
    .la { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#ma); }
    .lb { stroke: #2e7d32; stroke-width: 3; fill: none; marker-end: url(#mb); }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f0f0f0; } .caption { fill: #bbb; }
      .zone { fill: #1b2333; } .pill { fill: #15181e; stroke: #5d79ab; }
      .app { fill: #15181e; stroke: #6ea8ff; } .app-title { fill: #6ea8ff; }
      .tag { fill: #6ea8ff; } .node-sub { fill: #e3ecfb; }
      .lw { stroke: #6ea8ff; } .lr { stroke: #b7bfcc; } .la { stroke: #ff9a57; } .lb { stroke: #66bb6a; }
    }
  </style>
  <defs>
    <marker id="mw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
  </defs>

  <text class="title" x="30" y="40">A real architecture, not just the pair this post upgrades</text>

  <!-- highlight zone behind application + primary -->
  <rect class="zone" x="30" y="190" width="420" height="250" rx="22"/>
  <rect class="pill" x="46" y="206" width="134" height="30" rx="15"/>
  <text class="tag" x="113" y="226" text-anchor="middle">this post, so far</text>

  <!-- application -->
  <circle class="app" cx="150" cy="330" r="78"/>
  <text class="app-title" x="150" y="337" text-anchor="middle">Application</text>

  <!-- primary -->
  <rect class="primary" x="320" y="280" width="190" height="100" rx="14"/>
  <text class="node-title" x="415" y="322" text-anchor="middle">Primary</text>
  <text class="node-sub" x="415" y="344" text-anchor="middle">accepts writes</text>

  <path class="lw" d="M228 330 L318 330"/>
  <text class="caption" x="238" y="318">writes</text>

  <!-- standby A -->
  <rect class="standby" x="660" y="60" width="210" height="95" rx="14"/>
  <text class="node-title" x="765" y="102" text-anchor="middle">Standby A</text>
  <text class="node-sub" x="765" y="124" text-anchor="middle">failover target</text>

  <!-- standby B -->
  <rect class="standby" x="660" y="500" width="210" height="95" rx="14"/>
  <text class="node-title" x="765" y="542" text-anchor="middle">Standby B</text>
  <text class="node-sub" x="765" y="564" text-anchor="middle">failover target</text>

  <!-- WAL archive -->
  <rect class="archive" x="900" y="235" width="160" height="80" rx="14"/>
  <text class="node-title" x="980" y="270" text-anchor="middle" font-size="17">WAL archive</text>
  <text class="node-sub" x="980" y="290" text-anchor="middle">archive_command</text>

  <!-- backup storage -->
  <rect class="backup" x="900" y="340" width="160" height="80" rx="14"/>
  <text class="node-title" x="980" y="372" text-anchor="middle" font-size="17">Backup</text>
  <text class="node-sub" x="980" y="394" text-anchor="middle">periodic base backups</text>

  <!-- primary to standbys: streaming replication -->
  <path class="lr" d="M470 278 Q 560 40 658 100"/>
  <path class="lr" d="M470 382 Q 560 560 658 548"/>
  <text class="caption" x="500" y="155">streaming</text>
  <text class="caption" x="500" y="500">streaming</text>

  <!-- primary to archive and backup -->
  <path class="la" d="M510 300 Q 760 240 898 266"/>
  <path class="lb" d="M510 360 Q 760 370 898 380"/>
  <text class="caption" x="630" y="245">WAL shipping</text>
  <text class="caption" x="630" y="420">base backup</text>

  <text class="caption" x="30" y="470">Highlighted: the single pair this post's pg_upgrade and logical-replication</text>
  <text class="caption" x="30" y="490">sections cover.</text>
  <text class="caption" x="30" y="530">Everything outside it — failover standbys, WAL archiving, backup storage —</text>
  <text class="caption" x="30" y="550">is part of any real deployment, and still has to come along.</text>
</svg>
