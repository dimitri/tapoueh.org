<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="A real architecture, not just the pair this post upgrades. The application writes to the primary, highlighted together as the single-node pair this post's pg_upgrade and logical-replication sections walk through. The rest of a real deployment surrounds it: the primary streams to standby A and standby B for failover, ships WAL to an archive, and sends periodic base backups to separate backup storage. None of those four are addressed by upgrading one pair of servers.">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .zone { fill: #eef3fb; stroke: #8aa6d6; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 18; }
    .small { font-size: 11.5px; fill: #444; }
    .b { font-weight: 600; }
    .rep { stroke: #2a6fdb; stroke-width: 2; fill: none; stroke-dasharray: 5 4; marker-end: url(#ab); }
    .arc { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .bak { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .wr { stroke: #556; stroke-width: 2; fill: none; marker-end: url(#aw); }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; }
      .zone { fill: #1b2333; stroke: #5d79ab; }
      .rep { stroke: #6ea8ff; } .arc { stroke: #ff9a57; } .bak { stroke: #66bb6a; } .wr { stroke: #99a; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#556"/></marker>
  </defs>

  <text class="b" x="20" y="24">A real architecture, not just the pair this post upgrades</text>

  <!-- the single-node pair this post has addressed -->
  <rect class="zone" x="20" y="130" width="340" height="160"/>
  <text class="small" x="34" y="148" text-anchor="start">this post, so far</text>

  <rect class="box" x="40" y="180" width="130" height="50"/>
  <text x="105" y="210" text-anchor="middle">Application</text>

  <rect class="box hi" x="220" y="180" width="120" height="50"/>
  <text x="280" y="210" text-anchor="middle">Primary</text>

  <path class="wr" d="M170 205 L218 205"/>
  <text class="small" x="178" y="196">writes</text>

  <!-- the rest of a real deployment -->
  <rect class="box" x="440" y="60" width="160" height="50"/>
  <text x="520" y="86" text-anchor="middle">Standby A</text>
  <text class="small" x="520" y="102" text-anchor="middle">failover target</text>

  <rect class="box" x="440" y="250" width="160" height="50"/>
  <text x="520" y="276" text-anchor="middle">Standby B</text>
  <text class="small" x="520" y="292" text-anchor="middle">failover target</text>

  <rect class="box" x="660" y="20" width="180" height="50"/>
  <text x="750" y="46" text-anchor="middle">WAL archive</text>
  <text class="small" x="750" y="62" text-anchor="middle">archive_command</text>

  <rect class="box" x="660" y="290" width="180" height="50"/>
  <text x="750" y="316" text-anchor="middle">Backup storage</text>
  <text class="small" x="750" y="332" text-anchor="middle">periodic base backups</text>

  <path class="rep" d="M340 192 L438 86"/>
  <path class="rep" d="M340 218 L438 272"/>
  <path class="arc" d="M340 185 L658 48"/>
  <path class="bak" d="M340 225 L658 312"/>

  <text class="small" x="360" y="140">streaming</text>
  <text class="small" x="360" y="280">streaming</text>

  <text x="20" y="375" class="small">Highlighted: the single pair this post's pg_upgrade and logical-replication sections cover. Everything outside it —</text>
  <text x="20" y="391" class="small">failover standbys, WAL archiving, backup storage — is part of any real deployment, and still has to come along.</text>
</svg>
