<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="A real architecture, not just the pair this post upgrades. The application writes to the primary; application and primary, boxed together, are the single pair this post's pg_upgrade and logical-replication sections cover. Below the primary, standby A and standby B receive streaming replication, as failover targets. To the side, in their own shared scope, the primary feeds a WAL archive and a backup storage target by archive_command and periodic base backups — independent of each other, a deployment may have either or both.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .zone-sub { font-size: 11.5px; font-style: italic; fill: #70798a; }
    .node { fill: #fff; stroke: #556; stroke-width: 1.5; }
    .accent { stroke-width: 0; }
    .accent-primary { fill: #2a6fdb; }
    .accent-standby { fill: #2f8fae; }
    .node-title { font-size: 16px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11.5px; fill: #5c6b84; }
    .app { fill: #fff; stroke: #2a6fdb; stroke-width: 2; }
    .app-title { font-size: 16px; font-weight: 700; fill: #2a6fdb; }
    .disk-archive { fill: #fbeee1; stroke: #c2570c; stroke-width: 2; }
    .disk-backup { fill: #e7f1e8; stroke: #2e7d32; stroke-width: 2; }
    .disk-line-archive { fill: none; stroke: #c2570c; stroke-width: 1.3; opacity: 0.6; }
    .disk-line-backup { fill: none; stroke: #2e7d32; stroke-width: 1.3; opacity: 0.6; }
    .icon-label { font-size: 13.5px; font-weight: 700; fill: #1b2230; }
    .icon-sub { font-size: 11px; fill: #5c6b84; }
    .solid { stroke: #37414f; stroke-width: 2; fill: none; marker-end: url(#m1); }
    .dashed { stroke: #37414f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#m1); }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lblbg { fill: #fff; opacity: 0.85; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; } .zone-sub { fill: #8b94a6; }
      .node { fill: #1d2129; stroke: #8a93a6; } .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .app { fill: #1d2129; stroke: #6ea8ff; } .app-title { fill: #6ea8ff; }
      .disk-archive { fill: #3a2a1d; stroke: #ff9a57; } .disk-backup { fill: #1f3322; stroke: #66bb6a; }
      .disk-line-archive { stroke: #ff9a57; } .disk-line-backup { stroke: #66bb6a; }
      .icon-label { fill: #f0f0f0; } .icon-sub { fill: #aab2c2; }
      .solid { stroke: #c3cadb; } .dashed { stroke: #c3cadb; } .lbl { fill: #c3cadb; } .lblbg { fill: #15181e; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
  </defs>

  <text class="title" x="30" y="32">A real architecture, not just the pair this post upgrades</text>

  <!-- zone: this post, so far -->
  <rect class="zone" x="30" y="150" width="430" height="170" rx="10"/>
  <text class="zone-label" x="46" y="172">THIS POST, SO FAR</text>

  <circle class="app" cx="120" cy="245" r="54"/>
  <text class="app-title" x="120" y="251" text-anchor="middle">Application</text>

  <rect class="accent accent-primary" x="268" y="196" width="6" height="88" rx="2"/>
  <rect class="node" x="274" y="196" width="166" height="88" rx="8"/>
  <text class="node-title" x="357" y="233" text-anchor="middle">Primary</text>
  <text class="node-sub" x="357" y="254" text-anchor="middle">accepts writes</text>

  <path class="solid" d="M174 245 L266 245"/>
  <rect class="lblbg" x="186" y="226" width="42" height="16"/>
  <text class="lbl" x="190" y="238">writes</text>

  <!-- standbys, a row below the primary -->
  <rect class="accent accent-standby" x="148" y="422" width="6" height="88" rx="2"/>
  <rect class="node" x="154" y="422" width="176" height="88" rx="8"/>
  <text class="node-title" x="242" y="459" text-anchor="middle">Standby A</text>
  <text class="node-sub" x="242" y="480" text-anchor="middle">failover target</text>

  <rect class="accent accent-standby" x="378" y="422" width="6" height="88" rx="2"/>
  <rect class="node" x="384" y="422" width="176" height="88" rx="8"/>
  <text class="node-title" x="472" y="459" text-anchor="middle">Standby B</text>
  <text class="node-sub" x="472" y="480" text-anchor="middle">failover target</text>

  <path class="solid" d="M330 284 L246 420"/>
  <path class="solid" d="M384 284 L468 420"/>
  <rect class="lblbg" x="246" y="340" width="82" height="16"/>
  <text class="lbl" x="250" y="352">streaming replication</text>

  <!-- zone: WAL archive and backup storage, either or both -->
  <rect class="zone" x="610" y="150" width="360" height="230" rx="10"/>
  <text class="zone-label" x="626" y="172">WAL ARCHIVE &amp; BACKUP STORAGE</text>
  <text class="zone-sub" x="626" y="190">independent targets — a deployment keeps either, or both</text>

  <!-- archive icon: squat cylinder, two divider lines -->
  <path class="disk-archive" d="M644 250 L644 310 A66 15 0 0 0 776 310 L776 250 Z"/>
  <path class="disk-line-archive" d="M644 270 A66 15 0 0 0 776 270"/>
  <path class="disk-line-archive" d="M644 290 A66 15 0 0 0 776 290"/>
  <ellipse class="disk-archive" cx="710" cy="250" rx="66" ry="15"/>
  <text class="icon-label" x="710" y="340" text-anchor="middle">WAL archive</text>
  <text class="icon-sub" x="710" y="356" text-anchor="middle">archive_command</text>

  <!-- backup icon: same shape, backup color -->
  <path class="disk-backup" d="M834 250 L834 310 A66 15 0 0 0 966 310 L966 250 Z"/>
  <path class="disk-line-backup" d="M834 270 A66 15 0 0 0 966 270"/>
  <path class="disk-line-backup" d="M834 290 A66 15 0 0 0 966 290"/>
  <ellipse class="disk-backup" cx="900" cy="250" rx="66" ry="15"/>
  <text class="icon-label" x="900" y="340" text-anchor="middle">Backup storage</text>
  <text class="icon-sub" x="900" y="356" text-anchor="middle">periodic base backups</text>

  <path class="dashed" d="M440 210 Q 560 190 642 245"/>
  <path class="dashed" d="M440 260 Q 620 300 832 270"/>
  <rect class="lblbg" x="486" y="196" width="78" height="16"/>
  <text class="lbl" x="490" y="208">WAL shipping</text>
  <rect class="lblbg" x="560" y="286" width="74" height="16"/>
  <text class="lbl" x="564" y="298">base backup</text>

  <text class="lbl" x="30" y="552">Highlighted: the single pair this post's pg_upgrade and logical-replication sections cover.</text>
  <text class="lbl" x="30" y="572">Everything outside it — failover standbys, WAL archiving, backup storage — is part of any real</text>
  <text class="lbl" x="30" y="592">deployment, and still has to come along.</text>
</svg>
