<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="After the cutover the application writes to the new server and the reverse subscription keeps the old one current, so the switch can be undone">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect class="box" x="10" y="30" width="200" height="230"/>
  <text class="b" x="110.0" y="52" text-anchor="middle">old server</text>
  <text class="small" x="110.0" y="72" text-anchor="middle">Postgres 16</text>
  <text class="small" x="110.0" y="89" text-anchor="middle"></text>
  <text class="small" x="110.0" y="106" text-anchor="middle">frozen (read-only)</text>
  <text class="small" x="110.0" y="123" text-anchor="middle"></text>
  <text class="small" x="110.0" y="140" text-anchor="middle">subscription app_rev</text>
  <text class="small" x="110.0" y="157" text-anchor="middle">applies what new writes</text>
  <rect class="box hi" x="690" y="30" width="200" height="230"/>
  <text class="b" x="790.0" y="52" text-anchor="middle">new server</text>
  <text class="small" x="790.0" y="72" text-anchor="middle">Postgres 18</text>
  <text class="small" x="790.0" y="89" text-anchor="middle"></text>
  <text class="small" x="790.0" y="106" text-anchor="middle">takes the traffic</text>
  <text class="small" x="790.0" y="123" text-anchor="middle"></text>
  <text class="small" x="790.0" y="140" text-anchor="middle">publication app_pub</text>
  <rect class="box" x="370" y="30" width="150" height="70"/>
  <text class="b" x="445.0" y="52" text-anchor="middle">application</text>
  <text class="small" x="445.0" y="72" text-anchor="middle">writes to the</text>
  <text class="small" x="445.0" y="89" text-anchor="middle">new server</text>
  <path class="a" d="M520 65 L690 65"/>
  <path class="o dash" d="M690 215 L210 215"/>
  <text class="small" x="450" y="203" text-anchor="middle">app_rev: origin = none, applies what the new server writes</text>
  <text class="small" x="450" y="240" text-anchor="middle">rollback: freeze new, marker row, sequences back, switch: 179 ms</text>
</svg>
