<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-label="A duplicate architecture, built ahead of the cutover. The old primary, current production, feeds a brand new architecture through logical replication, which is the only piece that crosses the major-version boundary. Inside the new architecture, built on the new major version from initdb: a new primary, physical-replicating to its own new standby A and standby B exactly as the old primary did, and feeding a new WAL archive and new backup storage, independent targets a deployment may keep either or both of. Cutover is a traffic switch onto an already-whole architecture, not a rebuild started after the fact.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .node-old { stroke: #8a93a6; stroke-dasharray: 5 3; }
    .node-primary { stroke: #2a6fdb; }
    .node-standby { stroke: #2f8fae; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .note { font-size: 11px; font-style: italic; fill: #70798a; }
    .disk-archive { fill: #fbeee1; stroke: #c2570c; stroke-width: 2; }
    .disk-backup { fill: #e7f1e8; stroke: #2e7d32; stroke-width: 2; }
    .disk-line-archive { fill: none; stroke: #c2570c; stroke-width: 1.2; opacity: 0.6; }
    .disk-line-backup { fill: none; stroke: #2e7d32; stroke-width: 1.2; opacity: 0.6; }
    .icon-label { font-size: 12.5px; font-weight: 700; fill: #1b2230; }
    .icon-sub { font-size: 10.5px; fill: #5c6b84; }
    .lr { stroke: #2a6fdb; stroke-width: 2.5; fill: none; marker-end: url(#m1); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; marker-end: url(#m2); }
    .dr { stroke: #37414f; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#m2); }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lblbg { fill: #fff; opacity: 0.88; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .node-old { stroke: #7b8599; }
      .node-primary { stroke: #6ea8ff; } .node-standby { stroke: #5fb8d6; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; } .note { fill: #8b94a6; }
      .disk-archive { fill: #3a2a1d; stroke: #ff9a57; } .disk-backup { fill: #1f3322; stroke: #66bb6a; }
      .disk-line-archive { stroke: #ff9a57; } .disk-line-backup { stroke: #66bb6a; }
      .icon-label { fill: #f0f0f0; } .icon-sub { fill: #aab2c2; }
      .lr { stroke: #6ea8ff; } .pr { stroke: #c3cadb; } .dr { stroke: #c3cadb; }
      .lbl { fill: #c3cadb; } .lblbg { fill: #15181e; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
  </defs>

  <text class="title" x="30" y="32">A duplicate architecture, built ahead of the cutover</text>

  <!-- old side, level with the new primary -->
  <rect class="node node-old" x="40" y="104" width="190" height="88" rx="8"/>
  <text class="node-title" x="135" y="140" text-anchor="middle">Old primary</text>
  <text class="node-sub" x="135" y="161" text-anchor="middle">current production, vOld</text>
  <text class="note" x="40" y="216">+ its own standbys, unaffected until cutover</text>

  <!-- new architecture zone -->
  <rect class="zone" x="300" y="60" width="740" height="480" rx="12"/>
  <text class="zone-label" x="320" y="84">NEW ARCHITECTURE — VNEW, FROM INITDB</text>

  <rect class="node node-primary" x="575" y="104" width="190" height="88" rx="8"/>
  <text class="node-title" x="670" y="140" text-anchor="middle">New primary</text>
  <text class="node-sub" x="670" y="161" text-anchor="middle">accepts writes after cutover</text>

  <rect class="node node-standby" x="350" y="246" width="190" height="82" rx="8"/>
  <text class="node-title" x="445" y="281" text-anchor="middle">New standby A</text>
  <text class="node-sub" x="445" y="301" text-anchor="middle">failover target</text>

  <rect class="node node-standby" x="800" y="246" width="190" height="82" rx="8"/>
  <text class="node-title" x="895" y="281" text-anchor="middle">New standby B</text>
  <text class="node-sub" x="895" y="301" text-anchor="middle">failover target</text>

  <!-- archive / backup, bottom of the new-architecture zone -->
  <path class="disk-archive" d="M494 430 L494 478 A66 14 0 0 0 626 478 L626 430 Z"/>
  <path class="disk-line-archive" d="M494 448 A66 14 0 0 0 626 448"/>
  <path class="disk-line-archive" d="M494 464 A66 14 0 0 0 626 464"/>
  <ellipse class="disk-archive" cx="560" cy="430" rx="66" ry="14"/>
  <text class="icon-label" x="560" y="510" text-anchor="middle">WAL archive</text>
  <text class="icon-sub" x="560" y="524" text-anchor="middle">archive_command</text>

  <path class="disk-backup" d="M714 430 L714 478 A66 14 0 0 0 846 478 L846 430 Z"/>
  <path class="disk-line-backup" d="M714 448 A66 14 0 0 0 846 448"/>
  <path class="disk-line-backup" d="M714 464 A66 14 0 0 0 846 464"/>
  <ellipse class="disk-backup" cx="780" cy="430" rx="66" ry="14"/>
  <text class="icon-label" x="780" y="510" text-anchor="middle">Backup storage</text>
  <text class="icon-sub" x="780" y="524" text-anchor="middle">periodic base backups, either or both</text>

  <!-- connections -->
  <path class="lr" d="M230 148 L573 148"/>
  <rect class="lblbg" x="276" y="110" width="236" height="34"/>
  <text class="lbl" x="282" y="140">logical replication</text>
  <text class="lbl" x="282" y="122" font-size="10" font-style="italic">(the only piece crossing versions)</text>

  <path class="pr" d="M605 192 L465 244"/>
  <path class="pr" d="M735 192 L870 244"/>
  <rect class="lblbg" x="612" y="228" width="104" height="16"/>
  <text class="lbl" x="616" y="240">physical replication</text>

  <path class="dr" d="M650 192 Q 605 320 586 428"/>
  <path class="dr" d="M690 192 Q 735 320 766 428"/>

  <text class="lbl" x="30" y="565">The new side is whole before the switch: its own standbys, its own archive, its own backups — built and</text>
  <text class="lbl" x="30" y="583">verified while the old architecture is still the one taking traffic, not assembled afterward under pressure.</text>
</svg>
