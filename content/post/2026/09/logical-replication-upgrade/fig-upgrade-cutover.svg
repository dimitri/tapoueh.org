<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="The cutover in four steps with the measured time of each, and the write stall the application saw">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect class="box" x="20" y="50" width="190" height="100"/>
  <text class="b" x="115.0" y="72" text-anchor="middle">1. freeze the old server</text>
  <text class="small" x="115.0" y="92" text-anchor="middle">make the database</text>
  <text class="small" x="115.0" y="109" text-anchor="middle">read-only, end sessions</text>
  <text class="b" x="115" y="175" text-anchor="middle">+34 ms</text>
  <path class="a" d="M210 100 L235 100"/>
  <rect class="box" x="235" y="50" width="190" height="100"/>
  <text class="b" x="330.0" y="72" text-anchor="middle">2. marker row</text>
  <text class="small" x="330.0" y="92" text-anchor="middle">insert a marker on old,</text>
  <text class="small" x="330.0" y="109" text-anchor="middle">wait until it is on new</text>
  <text class="b" x="330" y="175" text-anchor="middle">+100 ms</text>
  <path class="a" d="M425 100 L450 100"/>
  <rect class="box" x="450" y="50" width="190" height="100"/>
  <text class="b" x="545.0" y="72" text-anchor="middle">3. sequences</text>
  <text class="small" x="545.0" y="92" text-anchor="middle">setval on new, generated</text>
  <text class="small" x="545.0" y="109" text-anchor="middle">from pg_sequences on old</text>
  <text class="b" x="545" y="175" text-anchor="middle">+136 ms</text>
  <path class="a" d="M640 100 L665 100"/>
  <rect class="box good" x="665" y="50" width="190" height="100"/>
  <text class="b" x="760.0" y="72" text-anchor="middle">4. switch</text>
  <text class="small" x="760.0" y="92" text-anchor="middle">the application now</text>
  <text class="small" x="760.0" y="109" text-anchor="middle">writes to the new server</text>
  <text class="b" x="760" y="175" text-anchor="middle">+138 ms</text>
  <path class="r" d="M20 225 L880 225"/>
  <text class="b" x="450" y="215" text-anchor="middle">write stall seen by the application: 181 ms, 4 failed attempts</text>
  <text class="small" x="450" y="255" text-anchor="middle">no acknowledged write lost, every table identical on both servers afterwards</text>
</svg>
