<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Three rollback strategies for a major upgrade, cheapest to most elaborate. Plain-copy pg_upgrade leaves the old cluster untouched and restartable, but only before any write lands on the new one. Link mode is faster but the old cluster becomes unsafe once the new one is started. A live reverse subscription keeps rolling back possible at any time, in milliseconds." >
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .badge { font-weight: 700; font-size: 12px; }
    .badge-bad { fill: #c62828; }
    .badge-ok { fill: #c2570c; }
    .badge-good { fill: #2e7d32; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; }
      .bad { fill: #3a2020; stroke: #ef5350; } .good { fill: #1d3322; stroke: #66bb6a; }
      .a { stroke: #6ea8ff; }
      .badge-bad { fill: #ef5350; } .badge-ok { fill: #ff9a57; } .badge-good { fill: #66bb6a; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
  </defs>

  <text class="b" x="20" y="24">The rollback ladder: cheapest to most elaborate</text>

  <rect class="box" x="20" y="48" width="255" height="190"/>
  <text class="b" x="147.5" y="74" text-anchor="middle">pg_upgrade</text>
  <text class="b" x="147.5" y="92" text-anchor="middle">--copy or --clone</text>
  <text class="small" x="147.5" y="118" text-anchor="middle">old cluster untouched,</text>
  <text class="small" x="147.5" y="134" text-anchor="middle">restart it directly</text>
  <text class="small" x="147.5" y="160" text-anchor="middle">only while the new</text>
  <text class="small" x="147.5" y="176" text-anchor="middle">cluster has taken</text>
  <text class="small" x="147.5" y="192" text-anchor="middle">no write at all</text>
  <text class="badge badge-ok" x="147.5" y="222" text-anchor="middle">instant, narrow window</text>

  <path class="a" d="M275 143 L320 143"/>

  <rect class="box bad" x="320" y="48" width="255" height="190"/>
  <text class="b" x="447.5" y="74" text-anchor="middle">pg_upgrade --link</text>
  <text class="small" x="447.5" y="100" text-anchor="middle">fastest upgrade,</text>
  <text class="small" x="447.5" y="116" text-anchor="middle">hard links not copies</text>
  <text class="small" x="447.5" y="142" text-anchor="middle">old cluster unsafe the</text>
  <text class="small" x="447.5" y="158" text-anchor="middle">moment the new one</text>
  <text class="small" x="447.5" y="174" text-anchor="middle">takes a single write</text>
  <text class="badge badge-bad" x="447.5" y="222" text-anchor="middle">a restore job, not a restart</text>

  <path class="a" d="M575 143 L620 143"/>

  <rect class="box good" x="620" y="48" width="255" height="190"/>
  <text class="b" x="747.5" y="74" text-anchor="middle">reverse subscription</text>
  <text class="small" x="747.5" y="100" text-anchor="middle">kept current the</text>
  <text class="small" x="747.5" y="116" text-anchor="middle">whole time, including</text>
  <text class="small" x="747.5" y="132" text-anchor="middle">after the cutover</text>
  <text class="small" x="747.5" y="158" text-anchor="middle">freeze, marker,</text>
  <text class="small" x="747.5" y="174" text-anchor="middle">switch back, same</text>
  <text class="small" x="747.5" y="190" text-anchor="middle">four steps reversed</text>
  <text class="badge badge-good" x="747.5" y="222" text-anchor="middle">~180 ms, any time</text>

  <text class="small" x="450" y="268" text-anchor="middle">Each step up removes risk and the rollback-window limit, and adds a moving part that can itself go wrong.</text>
</svg>
