; Part D: the [databases] section lives in its own file so the cutover
; script can edit it (via the bind mount shared with traffic2) without
; touching this file or needing docker exec into this container.
%include /etc/pgbouncer/databases.ini

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = any
admin_users = app, postgres
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
logfile = /tmp/pgbouncer.log
pidfile = /tmp/pgbouncer.pid
