<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A logical slot on a physical standby of the warehouse keeps the CDC load off the primary">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect class="box hi" x="20" y="40" width="250" height="260"/>
  <text class="b" x="145.0" y="62" text-anchor="middle">warehouse primary</text>
  <text class="small" x="145.0" y="82" text-anchor="middle">wal_level = logical</text>
  <text class="small" x="145.0" y="99" text-anchor="middle">pg_log_standby_snapshot()</text>
  <text class="small" x="145.0" y="116" text-anchor="middle">unblocks slot creation</text>
  <text class="small" x="145.0" y="133" text-anchor="middle"></text>
  <text class="small" x="145.0" y="150" text-anchor="middle">physical slot standby1</text>
  <rect class="box" x="390" y="40" width="270" height="260"/>
  <text class="b" x="525.0" y="62" text-anchor="middle">standby</text>
  <text class="small" x="525.0" y="82" text-anchor="middle">wal_level = logical (its own)</text>
  <text class="small" x="525.0" y="99" text-anchor="middle">max_worker_processes >= primary</text>
  <text class="small" x="525.0" y="116" text-anchor="middle">hot_standby_feedback = on</text>
  <rect class="inner" x="415" y="170" width="220" height="90"/>
  <text class="b" x="525.0" y="192" text-anchor="middle">logical slot cdc_sb</text>
  <text class="small" x="525.0" y="212" text-anchor="middle">decodes replayed WAL</text>
  <rect class="box" x="720" y="90" width="160" height="140"/>
  <text class="b" x="800.0" y="112" text-anchor="middle">CDC consumer</text>
  <text class="small" x="800.0" y="132" text-anchor="middle">pg_recvlogical</text>
  <text class="small" x="800.0" y="149" text-anchor="middle">or Debezium</text>
  <text class="small" x="800.0" y="166" text-anchor="middle">reads from the standby</text>
  <path class="a" d="M270 110 L390 110"/>
  <text class="small" x="280" y="98" text-anchor="start">streaming WAL</text>
  <path class="o dash" d="M390 150 L270 150"/>
  <text class="small" x="280" y="142" text-anchor="start">feedback</text>
  <path class="g" d="M635 215 L720 175"/>
  <text class="small" x="400" y="285" text-anchor="start">without feedback: slot invalidated (rows_removed)</text>
</svg>
