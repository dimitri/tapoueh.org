<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Three application databases replicate into one warehouse database, one schema each; the warehouse publishes a change stream for a CDC consumer">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .wh { fill: #e6eefc; }
    .schema { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .in { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ai); }
    .out { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .wh { fill: #1d2a44; } .schema { fill: #2b3140; stroke: #99a; }
    }
  </style>
  <defs>
    <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>

  <!-- sources -->
  <rect class="box" x="20" y="90"  width="230" height="70"/>
  <rect class="box" x="20" y="180" width="230" height="70"/>
  <rect class="box" x="20" y="270" width="230" height="70"/>
  <text class="b" x="135" y="115" text-anchor="middle">shop server</text>
  <text class="small" x="135" y="137" text-anchor="middle">schema shop: customers, orders</text>
  <text class="b" x="135" y="205" text-anchor="middle">crm server</text>
  <text class="small" x="135" y="227" text-anchor="middle">schema crm: accounts, contacts</text>
  <text class="b" x="135" y="295" text-anchor="middle">billing server</text>
  <text class="small" x="135" y="317" text-anchor="middle">schema billing: invoices, payments</text>

  <!-- warehouse -->
  <rect class="box wh" x="340" y="50" width="260" height="310"/>
  <text class="b" x="470" y="76" text-anchor="middle">warehouse</text>
  <rect class="schema" x="360" y="90"  width="220" height="70"/>
  <rect class="schema" x="360" y="180" width="220" height="70"/>
  <rect class="schema" x="360" y="270" width="220" height="70"/>
  <text class="small" x="470" y="130" text-anchor="middle">schema shop</text>
  <text class="small" x="470" y="220" text-anchor="middle">schema crm</text>
  <text class="small" x="470" y="310" text-anchor="middle">schema billing</text>

  <!-- subscriptions -->
  <path class="in" d="M250 125 L360 125"/>
  <path class="in" d="M250 215 L360 215"/>
  <path class="in" d="M250 305 L360 305"/>
  <text class="small" x="255" y="116" style="fill:#2a6fdb">subscription</text>
  <text class="small" x="255" y="206" style="fill:#2a6fdb">subscription</text>
  <text class="small" x="255" y="296" style="fill:#2a6fdb">subscription</text>

  <!-- CDC consumer -->
  <rect class="box" x="700" y="180" width="180" height="70"/>
  <text class="b" x="790" y="205" text-anchor="middle">CDC consumer</text>
  <text class="small" x="790" y="227" text-anchor="middle">Debezium-like</text>
  <path class="out" d="M600 215 L700 215"/>
  <text class="small" x="606" y="206" style="fill:#c2570c">slot, pgoutput</text>
</svg>
