<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Rows applied by the subscriptions are decoded again by a slot on the warehouse; the origin option decides whether the consumer sees them">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect class="box" x="20" y="40" width="150" height="50"/>
  <text class="b" x="95.0" y="62" text-anchor="middle">shop</text>
  <rect class="box" x="20" y="120" width="150" height="50"/>
  <text class="b" x="95.0" y="142" text-anchor="middle">crm</text>
  <rect class="box" x="20" y="200" width="150" height="50"/>
  <text class="b" x="95.0" y="222" text-anchor="middle">billing</text>
  <rect class="box hi" x="250" y="20" width="400" height="340"/>
  <text class="b" x="450.0" y="42" text-anchor="middle">warehouse</text>
  <rect class="inner" x="275" y="60" width="150" height="100"/>
  <text class="b" x="350.0" y="82" text-anchor="middle">apply workers</text>
  <text class="small" x="350.0" y="102" text-anchor="middle">origin pg_&lt;subid&gt;</text>
  <text class="small" x="350.0" y="119" text-anchor="middle">one per subscription</text>
  <rect class="inner" x="275" y="190" width="150" height="60"/>
  <text class="b" x="350.0" y="212" text-anchor="middle">local write</text>
  <text class="small" x="350.0" y="232" text-anchor="middle">no origin</text>
  <rect class="inner" x="455" y="110" width="170" height="100"/>
  <text class="b" x="540.0" y="132" text-anchor="middle">tables + WAL</text>
  <text class="small" x="540.0" y="152" text-anchor="middle">shop, crm, billing</text>
  <text class="small" x="540.0" y="169" text-anchor="middle">published by cdc_pub</text>
  <rect class="inner" x="455" y="250" width="170" height="80"/>
  <text class="b" x="540.0" y="272" text-anchor="middle">logical slot</text>
  <text class="small" x="540.0" y="292" text-anchor="middle">cdc_pg, pgoutput</text>
  <path class="a" d="M170 65 L275 95"/>
  <path class="a" d="M170 145 L275 110"/>
  <path class="a" d="M170 225 L275 125"/>
  <path class="a" d="M425 110 L455 140"/>
  <path class="o" d="M425 220 L455 185"/>
  <path class="a" d="M540 210 L540 250"/>
  <rect class="box good" x="730" y="60" width="150" height="110"/>
  <text class="b" x="805.0" y="82" text-anchor="middle">consumer A</text>
  <text class="small" x="805.0" y="102" text-anchor="middle">origin 'any'</text>
  <text class="small" x="805.0" y="119" text-anchor="middle">sees applied changes</text>
  <text class="small" x="805.0" y="136" text-anchor="middle">and local writes</text>
  <rect class="box bad" x="730" y="220" width="150" height="110"/>
  <text class="b" x="805.0" y="242" text-anchor="middle">consumer B</text>
  <text class="small" x="805.0" y="262" text-anchor="middle">origin 'none'</text>
  <text class="small" x="805.0" y="279" text-anchor="middle">sees local writes only</text>
  <text class="small" x="805.0" y="296" text-anchor="middle">(BRIC in the demo)</text>
  <path class="o" d="M625 285 L730 275"/>
  <path class="g" d="M625 270 L730 140"/>
</svg>
