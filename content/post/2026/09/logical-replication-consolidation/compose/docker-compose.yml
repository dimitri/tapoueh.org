# Consolidation demo: three source apps -> one warehouse -> CDC re-export.
# Project name is fixed to "lrcons"; host ports 5720-5724 only.
name: lrcons

x-pg: &pg
  image: postgres:18
  environment:
    POSTGRES_PASSWORD: demo
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d $${POSTGRES_DB:-postgres}"]
    interval: 2s
    timeout: 3s
    retries: 30

x-source-cmd: &source-cmd
  - postgres
  - -c
  - wal_level=logical
  - -c
  - max_wal_senders=10
  - -c
  - max_replication_slots=10
  - -c
  - logical_decoding_work_mem=64kB
  - -c
  - log_min_messages=warning

services:
  shop:
    <<: *pg
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: shop
    command: *source-cmd
    ports: ["5720:5432"]

  crm:
    <<: *pg
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: crm
    command: *source-cmd
    ports: ["5721:5432"]

  billing:
    <<: *pg
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: billing
    command: *source-cmd
    ports: ["5722:5432"]

  warehouse:
    <<: *pg
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: warehouse
    volumes:
      - ./init/warehouse-hba.sh:/docker-entrypoint-initdb.d/10-hba.sh:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=20
      - -c
      - max_logical_replication_workers=12
      - -c
      - max_worker_processes=24
      - -c
      - logical_decoding_work_mem=64kB
      - -c
      - log_min_messages=warning
    ports: ["5723:5432"]

  # Physical standby of the warehouse. The container only sleeps; step 4e
  # runs pg_basebackup into it and starts postgres with pg_ctl, so the exact
  # commands and their output are part of the results.
  warehouse_standby:
    image: postgres:18
    user: postgres
    entrypoint: ["sleep", "infinity"]
    profiles: ["standby"]
    ports: ["5724:5432"]
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 2s
