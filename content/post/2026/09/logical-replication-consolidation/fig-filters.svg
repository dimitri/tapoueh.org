<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="A column list and a row filter on the publisher decide what the warehouse receives">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect class="box" x="20" y="30" width="260" height="290"/>
  <text class="b" x="150.0" y="52" text-anchor="middle">shop.customers (shop server)</text>
  <text class="small" x="150.0" y="72" text-anchor="middle">id, account_id, name,</text>
  <text class="small" x="150.0" y="89" text-anchor="middle">email, phone, country, tenant</text>
  <text class="small" x="150.0" y="106" text-anchor="middle"></text>
  <text class="small" x="150.0" y="123" text-anchor="middle">1 Alice   FR  eu</text>
  <text class="small" x="150.0" y="140" text-anchor="middle">2 Bob     FR  eu</text>
  <text class="small" x="150.0" y="157" text-anchor="middle">3 Carol   US  us</text>
  <text class="small" x="150.0" y="174" text-anchor="middle">4 Dan     DE  eu</text>
  <rect class="box hi" x="340" y="70" width="220" height="200"/>
  <text class="b" x="450.0" y="92" text-anchor="middle">publication pub_shop</text>
  <text class="small" x="450.0" y="112" text-anchor="middle"></text>
  <rect class="inner" x="355" y="115" width="190" height="72"/>
  <text class="b" x="450.0" y="137" text-anchor="middle">column list</text>
  <text class="small" x="450.0" y="157" text-anchor="middle">id, account_id, name,</text>
  <text class="small" x="450.0" y="174" text-anchor="middle">country, tenant</text>
  <rect class="inner" x="355" y="205" width="190" height="55"/>
  <text class="b" x="450.0" y="227" text-anchor="middle">row filter</text>
  <text class="small" x="450.0" y="247" text-anchor="middle">tenant = 'eu'</text>
  <rect class="box" x="620" y="30" width="260" height="290"/>
  <text class="b" x="750.0" y="52" text-anchor="middle">shop.customers (warehouse)</text>
  <text class="small" x="750.0" y="72" text-anchor="middle">id, account_id, name,</text>
  <text class="small" x="750.0" y="89" text-anchor="middle">country, tenant</text>
  <text class="small" x="750.0" y="106" text-anchor="middle"></text>
  <text class="small" x="750.0" y="123" text-anchor="middle">1 Alice   FR  eu</text>
  <text class="small" x="750.0" y="140" text-anchor="middle">2 Bob     FR  eu</text>
  <text class="small" x="750.0" y="157" text-anchor="middle">4 Dan     DE  eu</text>
  <path class="a" d="M280 170 L340 170"/>
  <path class="a" d="M560 170 L620 170"/>
  <text class="small" x="346" y="300" text-anchor="start">email, phone and the us row</text>
  <text class="small" x="346" y="316" text-anchor="start">never leave the publisher</text>
</svg>
