<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="A subscription looks up the publisher's own schema and table name: public.orders fails, shopapp.orders works">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <text class="b" x="20" y="28" text-anchor="start">Tables in public on the publisher: the lookup fails</text>
  <rect class="box" x="20" y="45" width="260" height="70"/>
  <text class="b" x="150.0" y="67" text-anchor="middle">shop server</text>
  <text class="small" x="150.0" y="87" text-anchor="middle">table public.orders</text>
  <rect class="box bad" x="600" y="45" width="280" height="70"/>
  <text class="b" x="740.0" y="67" text-anchor="middle">warehouse</text>
  <text class="small" x="740.0" y="87" text-anchor="middle">has shopapp.orders, wants it there</text>
  <path class="r" d="M280 80 L600 80"/>
  <text class="small" x="290" y="68" text-anchor="start">subscription looks for public.orders</text>
  <text class="small" x="290" y="102" text-anchor="start">ERROR: relation "public.orders" does not exist</text>
  <text class="b" x="20" y="178" text-anchor="start">Table moved to its own schema on the publisher: the same name on both sides</text>
  <rect class="box good" x="20" y="195" width="260" height="100"/>
  <text class="b" x="150.0" y="217" text-anchor="middle">shop server</text>
  <text class="small" x="150.0" y="237" text-anchor="middle">alter table public.orders</text>
  <text class="small" x="150.0" y="254" text-anchor="middle">set schema shopapp;</text>
  <text class="small" x="150.0" y="271" text-anchor="middle">role app_shop: search_path = shopapp</text>
  <rect class="box good" x="600" y="195" width="280" height="100"/>
  <text class="b" x="740.0" y="217" text-anchor="middle">warehouse</text>
  <text class="small" x="740.0" y="237" text-anchor="middle">table shopapp.orders</text>
  <path class="g" d="M280 245 L600 245"/>
  <text class="small" x="290" y="233" text-anchor="start">subscription finds shopapp.orders</text>
  <text class="small" x="290" y="265" text-anchor="start">the application's SQL is unchanged</text>
</svg>
