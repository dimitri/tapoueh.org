<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="A twelve-year history of DDL replication in Postgres: Event Triggers in 2012, deparsing utility commands in 2015, a withdrawn core patch in 2022 to 2024, and four mechanisms in use today, none of them the core WAL-message primitive">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .dim { fill: #f4f6f8; stroke: #99a; stroke-dasharray: 4 3; }
    .line { stroke: #556; stroke-width: 2; fill: none; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .dot { fill: #2a6fdb; stroke: #fff; stroke-width: 2; }
    .dotbad { fill: #c62828; stroke: #fff; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; }
      .bad { fill: #3a2020; stroke: #ef5350; } .dim { fill: #23272e; stroke: #777; }
      .line { stroke: #99a; } .dot { fill: #6ea8ff; } .dotbad { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="tl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#556"/></marker>
  </defs>

  <text class="b" x="20" y="26">Twelve years, one unfinished job</text>

  <path class="line" d="M60 70 L850 70" marker-end="url(#tl)"/>

  <circle class="dot" cx="120" cy="70" r="7"/>
  <text class="b" x="120" y="45" text-anchor="middle">2012</text>
  <text class="small" x="120" y="96" text-anchor="middle">Event Triggers</text>
  <text class="small" x="120" y="112" text-anchor="middle">(Postgres 9.3)</text>
  <text class="small" x="120" y="132" text-anchor="middle">make DDL visible;</text>
  <text class="small" x="120" y="148" text-anchor="middle">replication was</text>
  <text class="small" x="120" y="164" text-anchor="middle">the destination</text>

  <circle class="dot" cx="340" cy="70" r="7"/>
  <text class="b" x="340" y="45" text-anchor="middle">2015</text>
  <text class="small" x="340" y="96" text-anchor="middle">ddl_deparse</text>
  <text class="small" x="340" y="112" text-anchor="middle">(Alvaro Herrera)</text>
  <text class="small" x="340" y="132" text-anchor="middle">command to JSON</text>
  <text class="small" x="340" y="148" text-anchor="middle">to SQL text, on</text>
  <text class="small" x="340" y="164" text-anchor="middle">2ndQuadrant's BDR tree</text>

  <circle class="dotbad" cx="580" cy="70" r="7"/>
  <text class="b" x="580" y="45" text-anchor="middle">2022-2024</text>
  <text class="small" x="580" y="96" text-anchor="middle">Full deparser +</text>
  <text class="small" x="580" y="112" text-anchor="middle">WAL messaging</text>
  <text class="small" x="580" y="132" text-anchor="middle">80+ revisions,</text>
  <text class="small" x="580" y="148" text-anchor="middle" style="fill:#c62828">withdrawn</text>

  <circle class="dot" cx="800" cy="70" r="7"/>
  <text class="b" x="800" y="45" text-anchor="middle">today</text>
  <text class="small" x="800" y="96" text-anchor="middle">pg_logical_emit</text>
  <text class="small" x="800" y="112" text-anchor="middle">_message() ships,</text>
  <text class="small" x="800" y="132" text-anchor="middle">core's own apply</text>
  <text class="small" x="800" y="148" text-anchor="middle">worker drops it</text>

  <text class="b" x="20" y="210">What actually replicates DDL today, none of it this primitive</text>

  <rect class="box" x="20" y="225" width="200" height="110"/>
  <text class="b" x="120" y="248" text-anchor="middle">pglogical</text>
  <text class="small" x="120" y="270" text-anchor="middle">replicate_ddl_command()</text>
  <text class="small" x="120" y="288" text-anchor="middle">a replicated queue</text>
  <text class="small" x="120" y="304" text-anchor="middle">table, apply-side</text>
  <text class="small" x="120" y="320" text-anchor="middle">special-cased</text>

  <rect class="box" x="235" y="225" width="200" height="110"/>
  <text class="b" x="335" y="248" text-anchor="middle">EDB PGD</text>
  <text class="small" x="335" y="270" text-anchor="middle">automatic, no call</text>
  <text class="small" x="335" y="288" text-anchor="middle">needed, closed</text>
  <text class="small" x="335" y="304" text-anchor="middle">source: mechanism</text>
  <text class="small" x="335" y="320" text-anchor="middle">not public</text>

  <rect class="box" x="450" y="225" width="200" height="110"/>
  <text class="b" x="550" y="248" text-anchor="middle">Citus</text>
  <text class="small" x="550" y="270" text-anchor="middle">synchronous direct</text>
  <text class="small" x="550" y="288" text-anchor="middle">fan-out from the</text>
  <text class="small" x="550" y="304" text-anchor="middle">coordinator, no WAL</text>
  <text class="small" x="550" y="320" text-anchor="middle">step at all</text>

  <rect class="box dim" x="665" y="225" width="215" height="110"/>
  <text class="b" x="772.5" y="248" text-anchor="middle">core Postgres</text>
  <text class="small" x="772.5" y="270" text-anchor="middle">pg_logical_emit_message</text>
  <text class="small" x="772.5" y="288" text-anchor="middle">exists, unused by</text>
  <text class="small" x="772.5" y="304" text-anchor="middle">CREATE SUBSCRIPTION;</text>
  <text class="small" x="772.5" y="320" text-anchor="middle">this post's own demo</text>

  <text class="small" x="450" y="365" text-anchor="middle">Progress here is real and uneven: three working mechanisms, and the one core primitive built for this still has no consumer.</text>
</svg>
