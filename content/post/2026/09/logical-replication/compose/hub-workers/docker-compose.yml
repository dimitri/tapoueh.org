# Hub and workers on PostgreSQL 18 (core logical replication only).
# Host ports 5710-5714. Data lives on tmpfs: nothing persists, `down` is a clean slate.
name: lrhub

x-pg: &pg
  image: postgres:18
  environment:
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_DB: app
  command:
    - postgres
    - -c
    - wal_level=logical
    - -c
    - track_commit_timestamp=on
    - -c
    - max_worker_processes=24
    - -c
    - max_logical_replication_workers=16
    - -c
    - max_replication_slots=16
    - -c
    - max_wal_senders=16
    - -c
    - wal_retrieve_retry_interval=1s
    - -c
    - logging_collector=on
    - -c
    - log_filename=pg.log
    - -c
    - "log_line_prefix=[%a] "
    - -c
    - listen_addresses=*
  tmpfs:
    - /var/lib/postgresql:size=1g
  healthcheck:
    # -h 127.0.0.1 on purpose: the temporary server of the image entrypoint only
    # listens on the unix socket, so a socket-based check reports ready too early.
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
    interval: 1s
    timeout: 3s
    retries: 60

services:
  hub:
    <<: *pg
    ports: ["5710:5432"]
  worker1:
    <<: *pg
    ports: ["5711:5432"]
  worker2:
    <<: *pg
    ports: ["5712:5432"]
  worker3:
    <<: *pg
    ports: ["5713:5432"]
  worker4:
    <<: *pg
    profiles: ["worker4"]
    ports: ["5714:5432"]
