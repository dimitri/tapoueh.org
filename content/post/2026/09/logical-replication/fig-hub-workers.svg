<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="Hub and three workers: reference data flows down, usage events flow up">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hub { fill: #e6eefc; }
    .down { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ad); }
    .up { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#au); }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hub { fill: #1d2a44; }
    }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <rect class="box hub" x="160" y="20" width="440" height="90"/>
  <text class="b" x="380" y="46" text-anchor="middle">hub</text>
  <text class="small" x="380" y="68" text-anchor="middle">plans, prices, customers (reference data)</text>
  <text class="small" x="380" y="88" text-anchor="middle">usage_events partitioned by worker_id, invoicing</text>

  <rect class="box" x="30"  y="250" width="200" height="80"/>
  <rect class="box" x="280" y="250" width="200" height="80"/>
  <rect class="box" x="530" y="250" width="200" height="80"/>
  <text class="b" x="130" y="278" text-anchor="middle">worker 1</text>
  <text class="b" x="380" y="278" text-anchor="middle">worker 2</text>
  <text class="b" x="630" y="278" text-anchor="middle">worker 3</text>
  <text class="small" x="130" y="302" text-anchor="middle">its customers, usage_events</text>
  <text class="small" x="380" y="302" text-anchor="middle">its customers, usage_events</text>
  <text class="small" x="630" y="302" text-anchor="middle">its customers, usage_events</text>

  <path class="down" d="M200 110 L150 250"/>
  <path class="down" d="M370 110 L370 250" transform="translate(-10 0)"/>
  <path class="down" d="M560 110 L610 250"/>
  <path class="up" d="M110 250 L180 110"/>
  <path class="up" d="M400 250 L400 110"/>
  <path class="up" d="M650 250 L580 110"/>

  <text class="small" x="30" y="190" fill="#2a6fdb" style="fill:#2a6fdb">reference data, row filter</text>
  <text class="small" x="30" y="206" style="fill:#2a6fdb">per worker (15+)</text>
  <text class="small" x="620" y="190" style="fill:#c2570c">usage events, one</text>
  <text class="small" x="620" y="206" style="fill:#c2570c">subscription per worker</text>
</svg>
