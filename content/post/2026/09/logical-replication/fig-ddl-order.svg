<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="DDL is not replicated: additive changes go to the subscriber first, drops go to the publisher first">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <text class="b" x="20" y="28" text-anchor="start">Adding a column</text>
  <rect class="box good" x="20" y="45" width="250" height="80"/>
  <text class="b" x="145.0" y="67" text-anchor="middle">1. subscriber</text>
  <text class="small" x="145.0" y="87" text-anchor="middle">alter table shop.orders</text>
  <text class="small" x="145.0" y="104" text-anchor="middle">add column priority int</text>
  <rect class="box good" x="340" y="45" width="250" height="80"/>
  <text class="b" x="465.0" y="67" text-anchor="middle">2. publisher</text>
  <text class="small" x="465.0" y="87" text-anchor="middle">alter table shop.orders</text>
  <text class="small" x="465.0" y="104" text-anchor="middle">add column priority int</text>
  <path class="g" d="M270 85 L340 85"/>
  <rect class="box bad" x="640" y="45" width="240" height="80"/>
  <text class="b" x="760.0" y="67" text-anchor="middle">column not on the subscriber</text>
  <text class="small" x="760.0" y="87" text-anchor="middle">apply worker stops: missing</text>
  <text class="small" x="760.0" y="104" text-anchor="middle">replicated column, queue grows</text>
  <text class="b" x="20" y="178" text-anchor="start">Dropping a column</text>
  <rect class="box good" x="20" y="195" width="250" height="80"/>
  <text class="b" x="145.0" y="217" text-anchor="middle">1. publisher</text>
  <text class="small" x="145.0" y="237" text-anchor="middle">alter table shop.orders</text>
  <text class="small" x="145.0" y="254" text-anchor="middle">drop column priority</text>
  <rect class="box" x="340" y="195" width="250" height="80"/>
  <text class="b" x="465.0" y="217" text-anchor="middle">2. subscriber (later)</text>
  <text class="small" x="465.0" y="237" text-anchor="middle">drop the column when</text>
  <text class="small" x="465.0" y="254" text-anchor="middle">nothing needs it</text>
  <path class="g" d="M270 235 L340 235"/>
  <rect class="box" x="640" y="195" width="240" height="80"/>
  <text class="b" x="760.0" y="217" text-anchor="middle">in between</text>
  <text class="small" x="760.0" y="237" text-anchor="middle">the subscriber keeps the</text>
  <text class="small" x="760.0" y="254" text-anchor="middle">column, NULL for new rows</text>
</svg>
