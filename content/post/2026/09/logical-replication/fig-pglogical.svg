<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="pglogical hub and two workers: replication sets on each provider, one subscription per set and worker">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hub { fill: #e6eefc; }
    .down { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ad); }
    .up { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#au); }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hub { fill: #1d2a44; }
    }
  </style>
  <defs>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <rect class="box hub" x="180" y="20" width="400" height="90"/>
  <text class="b" x="380" y="46" text-anchor="middle">hub: PostgreSQL 14, pglogical 2.4.8</text>
  <text class="small" x="380" y="68" text-anchor="middle">replication sets ref_w1, ref_w2 (row_filter, columns)</text>
  <text class="small" x="380" y="88" text-anchor="middle">usage_events, one partition per worker</text>

  <rect class="box" x="30"  y="230" width="240" height="70"/>
  <rect class="box" x="490" y="230" width="240" height="70"/>
  <text class="b" x="150" y="256" text-anchor="middle">worker 1</text>
  <text class="small" x="150" y="278" text-anchor="middle">replication set usage</text>
  <text class="b" x="610" y="256" text-anchor="middle">worker 2</text>
  <text class="small" x="610" y="278" text-anchor="middle">replication set usage</text>

  <path class="down" d="M290 110 L190 230"/>
  <path class="up" d="M240 230 L340 110"/>
  <path class="down" d="M470 110 L570 230"/>
  <path class="up" d="M520 230 L420 110"/>

  <text class="small" x="20" y="150" style="fill:#2a6fdb">sub_ref_w1 takes</text>
  <text class="small" x="20" y="166" style="fill:#2a6fdb">set ref_w1</text>
  <text class="small" x="540" y="150" style="fill:#2a6fdb">sub_ref_w2 takes</text>
  <text class="small" x="540" y="166" style="fill:#2a6fdb">set ref_w2</text>
  <text class="small" x="380" y="144" text-anchor="middle" style="fill:#c2570c">sub_usage_w1,</text>
  <text class="small" x="380" y="160" text-anchor="middle" style="fill:#c2570c">sub_usage_w2</text>
  <text class="small" x="380" y="176" text-anchor="middle" style="fill:#c2570c">take set usage</text>
</svg>
