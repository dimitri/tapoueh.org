<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="The classic Citus architecture: the application talks to one coordinator, which plans and fans a query out to the workers holding the shards, then merges their partial results. A reference table is replicated whole to every worker.">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 14px; fill: #222; }
    .box { fill: #f4f6f8; stroke: #556; stroke-width: 1.5; rx: 8; }
    .hi { fill: #e6eefc; }
    .inner { fill: #ffffff; stroke: #556; stroke-width: 1; rx: 6; }
    .good { fill: #e4f4e6; stroke: #2e7d32; }
    .bad { fill: #fbe9e7; stroke: #c62828; }
    .a { stroke: #2a6fdb; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .o { stroke: #c2570c; stroke-width: 2; fill: none; marker-end: url(#ao); }
    .g { stroke: #2e7d32; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .r { stroke: #c62828; stroke-width: 2; fill: none; marker-end: url(#ar); }
    .dash { stroke-dasharray: 6 4; }
    .small { font-size: 12px; fill: #444; }
    .b { font-weight: 600; }
    .cb { fill: #2a6fdb; } .co { fill: #c2570c; } .cg { fill: #2e7d32; } .cr { fill: #c62828; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; } .small { fill: #bbb; }
      .box { fill: #23272e; stroke: #99a; } .hi { fill: #1d2a44; } .inner { fill: #2b3140; stroke: #99a; }
      .good { fill: #1d3322; stroke: #66bb6a; } .bad { fill: #3a2020; stroke: #ef5350; }
      .cb { fill: #6ea8ff; } .co { fill: #ff9a57; } .cg { fill: #66bb6a; } .cr { fill: #ef5350; }
    }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2a6fdb"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e7d32"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
  </defs>
  <rect class="box" x="350" y="20" width="200" height="70"/>
  <text class="b" x="450.0" y="42" text-anchor="middle">application</text>
  <text class="small" x="450.0" y="62" text-anchor="middle">issues SQL</text>
  <path class="a" d="M450 90 L450 120"/>
  <text class="small" x="462" y="110" text-anchor="start">SQL</text>
  <rect class="box hi" x="300" y="120" width="300" height="90"/>
  <text class="b" x="450.0" y="142" text-anchor="middle">coordinator</text>
  <text class="small" x="450.0" y="162" text-anchor="middle">metadata · query planner · pg_dist_*</text>
  <rect class="box" x="80" y="300" width="160" height="140"/>
  <text class="b" x="160" y="296" text-anchor="middle">worker 1</text>
  <rect class="inner" x="95" y="320" width="130" height="26"/>
  <text class="small" x="160" y="337" text-anchor="middle">shard 1 (orders)</text>
  <rect class="inner" x="95" y="352" width="130" height="26"/>
  <text class="small" x="160" y="369" text-anchor="middle">shard 4 (orders)</text>
  <rect class="good" x="95" y="384" width="130" height="26"/>
  <text class="small" x="160" y="401" text-anchor="middle">countries (ref)</text>
  <path class="a" d="M390 210 L160 300"/>
  <rect class="box" x="375" y="300" width="160" height="140"/>
  <text class="b" x="455" y="296" text-anchor="middle">worker 2</text>
  <rect class="inner" x="390" y="320" width="130" height="26"/>
  <text class="small" x="455" y="337" text-anchor="middle">shard 2 (orders)</text>
  <rect class="inner" x="390" y="352" width="130" height="26"/>
  <text class="small" x="455" y="369" text-anchor="middle">shard 5 (orders)</text>
  <rect class="good" x="390" y="384" width="130" height="26"/>
  <text class="small" x="455" y="401" text-anchor="middle">countries (ref)</text>
  <path class="a" d="M450 210 L455 300"/>
  <rect class="box" x="670" y="300" width="160" height="140"/>
  <text class="b" x="750" y="296" text-anchor="middle">worker 3</text>
  <rect class="inner" x="685" y="320" width="130" height="26"/>
  <text class="small" x="750" y="337" text-anchor="middle">shard 3 (orders)</text>
  <rect class="inner" x="685" y="352" width="130" height="26"/>
  <text class="small" x="750" y="369" text-anchor="middle">shard 6 (orders)</text>
  <rect class="good" x="685" y="384" width="130" height="26"/>
  <text class="small" x="750" y="401" text-anchor="middle">countries (ref)</text>
  <path class="a" d="M510 210 L750 300"/>
  <text class="small" x="150" y="250" text-anchor="start">subquery</text>
  <text class="small" x="700" y="250" text-anchor="start">subquery</text>
  <text class="small" x="430" y="440" text-anchor="middle">partial results flow back from each worker to the coordinator, which merges them</text>
</svg>
