# Which PostgreSQL this article's queries are written against.
#
# It belongs here rather than in a flag: the article is *about* plan
# advice in PostgreSQL 19, so the version is part of what the document
# says, and a flag somebody has to remember is a flag somebody forgets.
#
# taopmd starts this image, runs the queries in sql/ against it, writes
# results/, and stops it again. Nothing has to be running first.
capture:
  image: ghcr.io/dimitri/theartofpostgresql/postgres-seeded:19beta3
  database: taop
  user: taop
  # session_preload_libraries, not shared: neither module reserves
  # shared memory or registers a background worker at postmaster start
  # merely by being loaded (pg_stash_advice's background worker only
  # starts when pg_stash_advice.persist is on, which itself requires
  # shared_preload_libraries -- see the article's "Running this in
  # production" section for the trade-off). session_preload_libraries
  # takes effect for every new connection with no server restart, which
  # is what changing this file and re-running wants.
  session_preload_libraries:
    - pg_plan_advice
    - pg_stash_advice
queries:
  1-the-query:
    sha256: 1b134ae51bc870382042d0926c0948ea3c83908e421c28c7d92fb382d63969f2
  2-plan-advice:
    sha256: 62c64d8ffd0af2ba9500400990d47180ccd9d00879d26bc776009d1ce569ad7b
  3-force-join-order:
    sha256: f84d570fa9afb9244d56a3419b87153d6cf328dc85d190c83388b736d0ff255d
  4-advice-that-fails:
    sha256: 154207ea7b57dfe7b15230ff0b710447f526d1c9b2044a75e7083a639842200a
  5-stash:
    sha256: 057495dd963eec0e7dde4c8cc622f806d05f4cb40d7bfadee2dcfa1b79a65567
  6-stash-applies:
