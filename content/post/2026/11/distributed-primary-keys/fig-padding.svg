<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Two layouts of the same composite key in a row. With region first, as in the key, the smallint takes 2 bytes, then 6 bytes of padding so that the bigint starts on a multiple of 8: 16 bytes. With the bigint first, the smallint follows it directly and the payload follows the smallint: 10 bytes. The primary key index keeps the key order, so its entries take 16 bytes either way.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .t { font-size: 16px; } .s { font-size: 14px; } .h { font-size: 17px; font-weight: 700; }
  </style>
  <rect width="900" height="330" fill="#fff"/>
  <path d="M60 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="60" y="46" text-anchor="middle" class="s muted">0</text>
  <path d="M100 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M140 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="140" y="46" text-anchor="middle" class="s muted">2</text>
  <path d="M180 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M220 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="220" y="46" text-anchor="middle" class="s muted">4</text>
  <path d="M260 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M300 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="300" y="46" text-anchor="middle" class="s muted">6</text>
  <path d="M340 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M380 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="380" y="46" text-anchor="middle" class="s muted">8</text>
  <path d="M420 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M460 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="460" y="46" text-anchor="middle" class="s muted">10</text>
  <path d="M500 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M540 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="540" y="46" text-anchor="middle" class="s muted">12</text>
  <path d="M580 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M620 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="620" y="46" text-anchor="middle" class="s muted">14</text>
  <path d="M660 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <path d="M700 52 V60" stroke="#b9c4d6" stroke-width="1.5"/>
  <text x="700" y="46" text-anchor="middle" class="s muted">16</text>
  <text x="716" y="46" class="s muted">bytes</text>
  <path d="M380 92 V146 M380 202 V256" stroke="#b9c4d6" stroke-width="1.5" stroke-dasharray="3 4"/>
  <path d="M700 92 V146 M700 202 V256" stroke="#b9c4d6" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="60" y="84" class="h">region first, as in the key: <tspan class="mono" font-weight="400">region smallint, id bigint</tspan></text>
  <rect x="60" y="96" width="80" height="46" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/><text x="100.0" y="125" text-anchor="middle" class="t">region</text>
  <rect x="140" y="96" width="240" height="46" fill="#fff" stroke="#b3261e" stroke-width="2" stroke-dasharray="5 4"/><text x="260.0" y="125" text-anchor="middle" class="t">padding: 6 bytes</text>
  <rect x="380" y="96" width="320" height="46" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/><text x="540.0" y="125" text-anchor="middle" class="t">id</text>
  <text x="716" y="125" class="t b" style="fill:#b3261e">16 bytes</text>
  <text x="60" y="194" class="h">bigint first: <tspan class="mono" font-weight="400">id bigint, region smallint</tspan></text>
  <rect x="60" y="206" width="320" height="46" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/><text x="220.0" y="235" text-anchor="middle" class="t">id</text>
  <rect x="380" y="206" width="80" height="46" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/><text x="420.0" y="235" text-anchor="middle" class="t">region</text>
  <rect x="460" y="206" width="160" height="46" fill="#f1f3f7" stroke="#b9c4d6" stroke-width="2"/><text x="540.0" y="235" text-anchor="middle" class="t">payload…</text>
  <text x="716" y="235" class="t b" style="fill:#0d7a55">10 bytes</text>
  <text x="60" y="282" class="s muted">A bigint starts on a multiple of 8 bytes; a smallint on a multiple of 2, and the payload's short header needs no alignment.</text>
  <text x="60" y="304" class="s muted">The primary key index on (region, id) keeps the key order, so its entries take 16 bytes either way.</text>
</svg>
