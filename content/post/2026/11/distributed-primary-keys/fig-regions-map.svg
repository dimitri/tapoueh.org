    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .sea { fill: #E8EEF5; }
    .land { fill: #F2EFE9; stroke: #C0B8AE; stroke-width: 0.8; stroke-linejoin: round; }
    .river { fill: none; stroke: #9dbbd6; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .link { fill: none; stroke: #6b7689; stroke-width: 2.2; marker-start: url(#a); marker-end: url(#a); }
    .primary { fill: #2a78d6; stroke: #fff; stroke-width: 2.5; }
    .standby { fill: #fff; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 3 2; }
    .city { font-size: 18px; font-weight: 700; paint-order: stroke; stroke: #F2EFE9; stroke-width: 5px; stroke-linejoin: round; }
    .reg { font-size: 15px; fill: #3f4a63; paint-order: stroke; stroke: #F2EFE9; stroke-width: 5px; stroke-linejoin: round; }
    .leg { font-size: 15px; fill: #37414f; }
    .src { font-size: 12px; fill: #6b7689; }
  </style>
