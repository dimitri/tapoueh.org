<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 629" role="img" aria-label="A map of north-western Europe with four regions, each a Postgres primary and its physical standby: London is region 1, Paris region 2, Amsterdam region 3 and Frankfurt region 4. Every pair of regions is linked by logical replication in both directions, so each region writes its own rows and receives the rows of the other three. Country borders and rivers come from the Natural Earth dataset, drawn with PostGIS.">
