<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 426" role="img" aria-label="Inside region 1, the primary sends all its WAL, including the state of its sequence, to a physical standby, which is promoted when the primary goes away. Regions 2 and 3 are subscribers: logical replication sends them the rows of region 1, never the state of its sequence. If the promoted standby hands out a number again, the subscribers already hold a row with it.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .t { font-size: 16px; } .s { font-size: 14px; } .h { font-size: 18px; font-weight: 700; }
    .box { fill: #fff; stroke: #2a78d6; stroke-width: 2; } .reg { fill: #f5f8fc; stroke: #b9c4d6; stroke-width: 1.5; }
    .sub { fill: #fff; stroke: #b9c4d6; stroke-width: 2; }
  </style>
  <rect width="900" height="426" fill="#fff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2a78d6"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#eb6834"/></marker>
  </defs>
  <rect class="reg" x="30" y="20" width="410" height="350" rx="10"/>
  <text x="50" y="48" class="h">Region 1</text>
  <rect class="box" x="55" y="66" width="360" height="92" rx="8"/>
  <text x="75" y="94" class="h">Primary</text>
  <text x="75" y="118" class="t">takes the writes of region 1</text>
  <text x="75" y="140" class="t">sequence <tspan class="mono">s</tspan>: the last number it handed out</text>
  <path d="M110 160 V250" stroke="#2a78d6" stroke-width="3" fill="none" marker-end="url(#ab)"/>
  <text x="128" y="192" class="s b" style="fill:#1f5fb0">physical replication: all the WAL,</text>
  <text x="128" y="211" class="s b" style="fill:#1f5fb0">the state of the sequence included</text>
  <text x="128" y="230" class="s muted">synchronous, or a few seconds behind</text>
  <rect class="box" x="55" y="256" width="360" height="92" rx="8"/>
  <text x="75" y="284" class="h">Standby</text>
  <text x="75" y="308" class="t">a copy, as recent as the WAL it received</text>
  <text x="75" y="330" class="t">promoted when the primary goes away</text>
  <path d="M417 104 L588 92" stroke="#eb6834" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <path d="M417 120 L588 262" stroke="#eb6834" stroke-width="3" fill="none" marker-end="url(#ao)"/>
  <text x="612" y="170" class="s b" style="fill:#b8431a">logical replication:</text>
  <text x="612" y="189" class="s b" style="fill:#b8431a">rows only, never the sequence</text>
  <rect class="sub" x="592" y="46" width="278" height="92" rx="8"/>
  <text x="612" y="74" class="h">Region 2</text>
  <text x="612" y="98" class="t">a subscriber: holds the rows</text>
  <text x="612" y="120" class="t">that region 1 made</text>
  <rect class="sub" x="592" y="216" width="278" height="92" rx="8"/>
  <text x="612" y="244" class="h">Region 3</text>
  <text x="612" y="268" class="t">a subscriber: holds the rows</text>
  <text x="612" y="290" class="t">that region 1 made</text>
  <text x="450" y="406" class="t" text-anchor="middle">If the promoted standby hands out a number again, the subscribers already hold a row with it.</text>
</svg>
