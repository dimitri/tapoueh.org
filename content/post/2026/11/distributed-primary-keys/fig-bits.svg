<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="The 63 bits of the time, region and counter key: 41 bits of milliseconds since 2026-01-01, then 4 bits of region, then an 18-bit counter. The time is id shifted right by 22, the region is id shifted right by 18 and masked with 15, the counter is id masked with 262143, and a publication filter reads the region bits only.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    
  </style>
  <rect width="900" height="290" fill="#fff"/>
  <rect x="40.0" y="80" width="533.7" height="60" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/>
  <text x="306.8" y="107" text-anchor="middle" font-size="19" class="b">time</text>
  <text x="306.8" y="128" text-anchor="middle" font-size="14" class="muted">41 bits: milliseconds since 2026-01-01</text>
  <rect x="573.7" y="80" width="52.1" height="60" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/>
  <text x="599.7" y="117" text-anchor="middle" font-size="16" class="b">4</text>
  <rect x="625.7" y="80" width="234.3" height="60" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2"/>
  <text x="742.9" y="107" text-anchor="middle" font-size="19" class="b">counter</text>
  <text x="742.9" y="128" text-anchor="middle" font-size="14" class="muted">18 bits: per region</text>
  <text x="40" y="68" font-size="14" class="muted">bit 62</text>
  <text x="860" y="68" font-size="14" class="muted" text-anchor="end">bit 0</text>
  <text x="573.7" y="68" font-size="14" class="muted" text-anchor="middle">22</text>
  <text x="625.7" y="68" font-size="14" class="muted" text-anchor="middle">18</text>
  <text x="599.7" y="159" font-size="14" text-anchor="middle" class="b" fill="#b8431a" style="fill:#b8431a">region</text>
  <path d="M180 140 V176 M599.7 164 V176 M802.9 140 V176" stroke="#b9c4d6" stroke-width="2" fill="none"/>
  <text x="180" y="204" font-size="19" class="mono" text-anchor="middle">id &gt;&gt; 22</text>
  <text x="180" y="226" font-size="14" class="muted" text-anchor="middle">the creation time</text>
  <text x="599.7" y="204" font-size="19" class="mono" text-anchor="middle">(id &gt;&gt; 18) &amp; 15</text>
  <text x="599.7" y="226" font-size="14" class="muted" text-anchor="middle">the region</text>
  <text x="802.9" y="204" font-size="19" class="mono" text-anchor="middle">id &amp; 262143</text>
  <text x="802.9" y="226" font-size="14" class="muted" text-anchor="middle">the counter</text>
  <text x="450" y="268" font-size="16" text-anchor="middle">A publication filter <tspan class="mono" font-size="15">where ((id &gt;&gt; 18) &amp; 15) = 1</tspan> reads these four bits and nothing else.</text>
</svg>
