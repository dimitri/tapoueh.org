<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" role="img" aria-label="The 64 bits of the time-based bigint: the sign bit stays 0, then 41 bits of milliseconds since 2026-01-01 UTC, 4 bits of region and an 18-bit counter. The time is id shifted right by 22, the region is id shifted right by 18 and masked with 15, the counter is id masked with 262143, and a publication filter reads the region bits only.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    
  </style>
  <rect width="900" height="336" fill="#fff"/>
  <rect x="40.0" y="80" width="12.8" height="60" fill="#eceff4" stroke="#b9c4d6" stroke-width="2"/>
  <text x="46.4" y="117" text-anchor="middle" font-size="16" class="b">0</text>
  <rect x="52.8" y="80" width="525.3" height="60" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/>
  <text x="315.5" y="107" text-anchor="middle" font-size="19" class="b">time</text>
  <text x="315.5" y="128" text-anchor="middle" font-size="14" class="muted">41 bits: milliseconds since 2026-01-01 UTC</text>
  <rect x="578.1" y="80" width="51.2" height="60" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/>
  <text x="603.8" y="117" text-anchor="middle" font-size="16" class="b">4</text>
  <rect x="629.4" y="80" width="230.6" height="60" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2"/>
  <text x="744.7" y="107" text-anchor="middle" font-size="19" class="b">counter</text>
  <text x="744.7" y="128" text-anchor="middle" font-size="14" class="muted">18 bits</text>
  <text x="40" y="68" font-size="14" class="muted">bit 63</text>
  <text x="860" y="68" font-size="14" class="muted" text-anchor="end">bit 0</text>
  <text x="578.1" y="68" font-size="14" class="muted" text-anchor="middle">22</text>
  <text x="629.4" y="68" font-size="14" class="muted" text-anchor="middle">18</text>
  <text x="46.4" y="159" font-size="14" text-anchor="middle" class="b" style="fill:#5c6b84">sign</text>
  <text x="603.8" y="159" font-size="14" text-anchor="middle" class="b" style="fill:#b8431a">region</text>
  <rect x="40" y="184" width="16" height="16" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/>
  <text x="70" y="199" font-size="19" class="mono">id &gt;&gt; 22</text>
  <text x="300" y="199" font-size="16">the creation time: 69 years of milliseconds, until 2095</text>
  <rect x="40" y="218" width="16" height="16" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/>
  <text x="70" y="233" font-size="19" class="mono">(id &gt;&gt; 18) &amp; 15</text>
  <text x="300" y="233" font-size="16">the region: 16 regions at most</text>
  <rect x="40" y="252" width="16" height="16" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2"/>
  <text x="70" y="267" font-size="19" class="mono">id &amp; 262143</text>
  <text x="300" y="267" font-size="16">the counter: 262,144 ids a millisecond in each region</text>
  <text x="40" y="304" font-size="16">A publication filter <tspan class="mono" font-size="15">where ((id &gt;&gt; 18) &amp; 15) = 1</tspan> reads the four region bits and nothing else.</text>
</svg>
