<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="The 64 bits of a regionseq id: the sign bit stays 0, then 41 bits of milliseconds since 2026-01-01 UTC, 6 bits of region, 4 bits of timeline and a 12-bit counter, with the shift and mask that read each field.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    
  </style>
  <rect width="900" height="340" fill="#fff"/>
  <rect x="40.0" y="80" width="12.8" height="60" fill="#eceff4" stroke="#b9c4d6" stroke-width="2"/>
  <text x="46.4" y="117" text-anchor="middle" font-size="16" class="b">0</text>
  <rect x="52.8" y="80" width="525.3" height="60" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/>
  <text x="315.5" y="107" text-anchor="middle" font-size="19" class="b">time</text>
  <text x="315.5" y="128" text-anchor="middle" font-size="14" class="muted">41 bits: milliseconds since 2026-01-01 UTC</text>
  <rect x="578.1" y="80" width="76.9" height="60" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/>
  <text x="616.6" y="117" text-anchor="middle" font-size="16" class="b">6</text>
  <rect x="655.0" y="80" width="51.2" height="60" fill="#efe3fb" stroke="#7a5cc2" stroke-width="2"/>
  <text x="680.6" y="117" text-anchor="middle" font-size="16" class="b">4</text>
  <rect x="706.2" y="80" width="153.8" height="60" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2"/>
  <text x="783.1" y="107" text-anchor="middle" font-size="19" class="b">counter</text>
  <text x="783.1" y="128" text-anchor="middle" font-size="14" class="muted">12 bits</text>
  <text x="40" y="68" font-size="14" class="muted">bit 63</text>
  <text x="860" y="68" font-size="14" class="muted" text-anchor="end">bit 0</text>
  <text x="578.1" y="68" font-size="14" class="muted" text-anchor="middle">22</text>
  <text x="655.0" y="68" font-size="14" class="muted" text-anchor="middle">16</text>
  <text x="706.2" y="68" font-size="14" class="muted" text-anchor="middle">12</text>
  <text x="46.4" y="159" font-size="14" text-anchor="middle" class="b" style="fill:#5c6b84">sign</text>
  <text x="616.6" y="159" font-size="14" text-anchor="middle" class="b" style="fill:#b8431a">region</text>
  <text x="680.6" y="159" font-size="14" text-anchor="middle" class="b" style="fill:#5b3fa6">timeline</text>
  <rect x="40" y="184" width="16" height="16" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/>
  <text x="70" y="199" font-size="19" class="mono">id &gt;&gt; 22</text>
  <text x="300" y="199" font-size="16">the creation time, or a little later when the clock was behind</text>
  <rect x="40" y="218" width="16" height="16" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/>
  <text x="70" y="233" font-size="19" class="mono">(id &gt;&gt; 16) &amp; 63</text>
  <text x="300" y="233" font-size="16">the region, from a server setting: 64 regions at most</text>
  <rect x="40" y="252" width="16" height="16" fill="#efe3fb" stroke="#7a5cc2" stroke-width="2"/>
  <text x="70" y="267" font-size="19" class="mono">(id &gt;&gt; 12) &amp; 15</text>
  <text x="300" y="267" font-size="16">the timeline, which changes at every promotion</text>
  <rect x="40" y="286" width="16" height="16" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2"/>
  <text x="70" y="301" font-size="19" class="mono">id &amp; 4095</text>
  <text x="300" y="301" font-size="16">the counter: 4,096 ids a millisecond</text>
</svg>
