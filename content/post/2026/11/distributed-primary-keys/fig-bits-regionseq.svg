<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-label="The 63 bits of a regionseq id: 41 bits of milliseconds since 2026-01-01, 6 bits of region, 4 bits of timeline and a 12-bit counter, with the shift and mask that read each field.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    
  </style>
  <rect width="900" height="310" fill="#fff"/>
  <rect x="40.0" y="80" width="533.7" height="60" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/>
  <text x="306.8" y="107" text-anchor="middle" font-size="19" class="b">time</text>
  <text x="306.8" y="128" text-anchor="middle" font-size="14" class="muted">41 bits: milliseconds since 2026-01-01</text>
  <rect x="573.7" y="80" width="78.1" height="60" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/>
  <text x="612.7" y="117" text-anchor="middle" font-size="16" class="b">6</text>
  <rect x="651.7" y="80" width="52.1" height="60" fill="#efe3fb" stroke="#7a5cc2" stroke-width="2"/>
  <text x="677.8" y="117" text-anchor="middle" font-size="16" class="b">4</text>
  <rect x="703.8" y="80" width="156.2" height="60" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2"/>
  <text x="781.9" y="107" text-anchor="middle" font-size="19" class="b">counter</text>
  <text x="781.9" y="128" text-anchor="middle" font-size="14" class="muted">12 bits</text>
  <text x="40" y="68" font-size="14" class="muted">bit 62</text>
  <text x="860" y="68" font-size="14" class="muted" text-anchor="end">bit 0</text>
  <text x="573.7" y="68" font-size="14" class="muted" text-anchor="middle">22</text>
  <text x="651.7" y="68" font-size="14" class="muted" text-anchor="middle">16</text>
  <text x="703.8" y="68" font-size="14" class="muted" text-anchor="middle">12</text>
  <text x="612.7" y="159" font-size="14" text-anchor="middle" class="b" style="fill:#b8431a">region</text>
  <text x="677.8" y="159" font-size="14" text-anchor="middle" class="b" style="fill:#5b3fa6">timeline</text>
  <g class="mono" font-size="19">
    <rect x="40" y="170" width="16" height="16" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/><text x="70" y="185">id &gt;&gt; 22</text>
    <rect x="40" y="204" width="16" height="16" fill="#fde3d5" stroke="#eb6834" stroke-width="2"/><text x="70" y="219">(id &gt;&gt; 16) &amp; 63</text>
    <rect x="40" y="238" width="16" height="16" fill="#efe3fb" stroke="#7a5cc2" stroke-width="2"/><text x="70" y="253">(id &gt;&gt; 12) &amp; 15</text>
    <rect x="40" y="272" width="16" height="16" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2"/><text x="70" y="287">id &amp; 4095</text>
  </g>
  <g font-size="16">
    <text x="300" y="185">the creation time, or a little later when the clock was behind</text>
    <text x="300" y="219">the region, from a server setting</text>
    <text x="300" y="253">the timeline, which changes at every promotion</text>
    <text x="300" y="287">the counter: 4,096 ids a millisecond</text>
  </g>
</svg>
