<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="Three regions, each a Postgres server that writes its own rows and subscribes to the other two with origin = none. Every pair of regions is linked in both directions. A row written in region 0 reaches region 1 and region 2 directly. Region 1 and region 2 do not send it on to each other, because a row that arrived through a subscription has an origin and origin = none skips it.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .node { fill: #fff; stroke: #2a6fdb; stroke-width: 2; }
    .node-title { font-size: 21px; font-weight: 700; fill: #1b2230; }
    .chip { fill: #eef2f9; stroke: #b9c4d6; stroke-width: 1; }
    .chip-t { font-size: 15px; fill: #1b2230; }
    .link { stroke: #8a94a6; stroke-width: 2; fill: none; marker-end: url(#a-grey); }
    .row { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#a-row); }
    .stop-bg { fill: #fff; stroke: #8a94a6; stroke-width: 1.5; }
    .stop-x { stroke: #b3261e; stroke-width: 2.2; stroke-linecap: round; }
    .note { font-size: 15px; fill: #37414f; }
    .note-row { font-size: 15px; font-weight: 700; fill: #c2570c; }
    .note-stop { font-size: 15px; font-weight: 700; fill: #b3261e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .node { fill: #1d2129; stroke: #6ea8ff; } .node-title { fill: #f0f0f0; }
      .chip { fill: #262c38; stroke: #4a5873; } .chip-t { fill: #e8e8e8; }
      .link { stroke: #99a3b8; } .row { stroke: #ff9a57; }
      .stop-bg { fill: #15181e; stroke: #99a3b8; } .stop-x { stroke: #ff7b72; }
      .note { fill: #c3cadb; } .note-row { fill: #ff9a57; } .note-stop { fill: #ff7b72; }
    }
  </style>
  <defs>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a94a6"/></marker>
    <marker id="a-row" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>

  <!-- links, drawn first so the nodes sit on top -->
  <path class="row"  d="M300 80 L598 80"/>
  <path class="link" d="M598 120 L302 120"/>
  <path class="row"  d="M262.5 160 L402.9 288"/>
  <path class="link" d="M367.5 288 L227.1 162"/>
  <path class="link" d="M672.9 160 L532.5 288"/>
  <path class="link" d="M497.1 288 L637.5 162"/>

  <!-- nodes -->
  <g>
    <rect class="node" x="60" y="40" width="240" height="120" rx="8"/>
    <text class="node-title" x="80" y="68">Region 0</text>
    <rect class="chip" x="80" y="80" width="200" height="30" rx="5"/><text class="chip-t" x="92" y="100">publishes table t</text>
    <rect class="chip" x="80" y="116" width="200" height="30" rx="5"/><text class="chip-t" x="92" y="136">subscribes to 1 and 2</text>
  </g>
  <g>
    <rect class="node" x="600" y="40" width="240" height="120" rx="8"/>
    <text class="node-title" x="620" y="68">Region 1</text>
    <rect class="chip" x="620" y="80" width="200" height="30" rx="5"/><text class="chip-t" x="632" y="100">publishes table t</text>
    <rect class="chip" x="620" y="116" width="200" height="30" rx="5"/><text class="chip-t" x="632" y="136">subscribes to 0 and 2</text>
  </g>
  <g>
    <rect class="node" x="330" y="290" width="240" height="120" rx="8"/>
    <text class="node-title" x="350" y="318">Region 2</text>
    <rect class="chip" x="350" y="330" width="200" height="30" rx="5"/><text class="chip-t" x="362" y="350">publishes table t</text>
    <rect class="chip" x="350" y="366" width="200" height="30" rx="5"/><text class="chip-t" x="362" y="386">subscribes to 0 and 1</text>
  </g>

  <!-- the row written in region 0 -->
  <text class="note-row" x="450" y="68" text-anchor="middle">a row written in region 0</text>
  <text class="note" x="450" y="144" text-anchor="middle">every link also runs the other way</text>

  <!-- the two links that do not carry it -->
  <g>
    <circle class="stop-bg" cx="602.7" cy="225" r="10"/>
    <path class="stop-x" d="M597.7 220 L607.7 230 M607.7 220 L597.7 230"/>
    <circle class="stop-bg" cx="567.3" cy="225" r="10"/>
    <path class="stop-x" d="M562.3 220 L572.3 230 M572.3 220 L562.3 230"/>
  </g>
  <text class="note-stop" x="640" y="256">not sent on:</text>
  <text class="note" x="640" y="274">it arrived through a</text>
  <text class="note" x="640" y="290">subscription, and</text>
  <text class="note" x="640" y="306"><tspan font-weight="700">origin = none</tspan> skips those</text>

  <text class="note-row" x="40" y="236">Regions 1 and 2 get it</text>
  <text class="note-row" x="40" y="254">straight from region 0,</text>
  <text class="note-row" x="40" y="272">each exactly once</text>
</svg>
