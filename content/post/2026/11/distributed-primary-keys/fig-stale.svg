<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" role="img" aria-label="A cut-off standby promoted after the primary is killed: its copy of the sequence is about 300,000 numbers behind the last number the client received, so the new primary hands out those 300,000 numbers a second time.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .bar { stroke-width: 2; }
    .t { font-size: 16px; } .s { font-size: 14px; }
  </style>
  <rect width="900" height="370" fill="#fff"/>
  <text x="60" y="38" font-size="18" class="b">Values of the sequence, from low to high</text>
  <rect x="400" y="70" width="320" height="200" fill="#fde3d5" opacity=".7"/>
  <rect class="bar" x="60" y="90" width="660" height="44" rx="4" fill="#dbe7f7" stroke="#2a78d6"/>
  <text x="76" y="118" class="t">numbers the old primary handed out</text>
  <rect class="bar" x="400" y="190" width="440" height="44" rx="4" fill="#d9f0e7" stroke="#1baf7a"/>
  <text x="416" y="218" class="t">numbers the new primary hands out</text>
  <path d="M720 66 V90 M400 160 V190" stroke="#1b2230" stroke-width="2" fill="none"/>
  <text x="720" y="62" text-anchor="end" class="s b">n: the last number the client received</text>
  <text x="408" y="176" class="s b">the standby's copy: n − 300,000</text>
  <text x="560" y="262" text-anchor="middle" class="t b" style="fill:#b3261e">about 300,000 numbers handed out twice</text>
  <path d="M840 190 L872 212 L840 234 Z" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/>
  <text x="60" y="202" class="s muted">the copy stopped following the WAL</text>
  <text x="60" y="220" class="s muted">three seconds before the kill</text>
  <text x="60" y="316" class="t">A standby that kept streaming has a copy within one log of 32 numbers of n:</text>
  <text x="60" y="340" class="t">the new primary skips 3 to 16 numbers and repeats none.</text>
</svg>
