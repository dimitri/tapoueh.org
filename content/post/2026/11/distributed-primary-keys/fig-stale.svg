<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" role="img" aria-label="Two promotions after the primary is killed. A standby that was streaming up to the kill carries on just past the last number the client received, skipping a few numbers. A standby cut off three seconds before the kill starts from its own copy, about 300,000 numbers behind, and hands those numbers out a second time.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .t { font-size: 17px; } .s { font-size: 15px; } .h { font-size: 18px; font-weight: 700; }
  </style>
  <rect width="900" height="444" fill="#fff"/>
  <text x="40" y="34" class="h">Standby streaming up to the kill</text>
  <rect x="60" y="52" width="560" height="44" rx="5" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/><text x="604" y="80" class="t" text-anchor="end">numbers the old primary handed out</text>
  <path d="M634 108 H836 L868 130 L836 152 H634 Z" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/><text x="650" y="136" class="t">the new primary carries on</text>
  <path d="M620 44 V164 M634 44 V164" stroke="#1b2230" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text x="610" y="190" class="s b" text-anchor="end" style="fill:#0d7a55">a few numbers skipped, which is harmless</text>
  <text x="40" y="248" class="h">Standby cut off three seconds before the kill</text>
  <rect x="300" y="258" width="320" height="122" fill="#fde3d5"/>
  <rect x="60" y="266" width="560" height="44" rx="5" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/><text x="604" y="294" class="t" text-anchor="end">numbers the old primary handed out</text>
  <path d="M300 326 H836 L868 348 L836 370 H300 Z" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/><text x="316" y="354" class="t">the new primary hands out</text>
  <path d="M300 258 V380 M620 258 V380" stroke="#1b2230" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <text x="460.0" y="404" text-anchor="middle" class="t b" style="fill:#b3261e">about 300,000 numbers</text>
  <text x="460.0" y="424" text-anchor="middle" class="t b" style="fill:#b3261e">handed out twice</text>
  <text x="290" y="404" text-anchor="end" class="s b">the standby's copy</text>
  <text x="630" y="404" class="s b">n: the last number</text>
  <text x="630" y="424" class="s b">the client received</text>
</svg>
