<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 296" role="img" aria-label="A cut-off standby promoted after the primary is killed: its copy of the sequence is about 300,000 numbers behind the last number the client received, so the new primary hands out those 300,000 numbers a second time.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .t { font-size: 17px; } .s { font-size: 15px; }
  </style>
  <rect width="900" height="296" fill="#fff"/>
  <rect x="300" y="24" width="320" height="212" fill="#fde3d5"/>
  <rect x="60" y="48" width="560" height="48" rx="5" fill="#dbe7f7" stroke="#2a78d6" stroke-width="2"/>
  <text x="318" y="78" class="t">numbers the old primary handed out</text>
  <path d="M300 150 H836 L868 174 L836 198 H300 Z" fill="#d9f0e7" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/>
  <text x="320" y="180" class="t">numbers the new primary hands out</text>
  <path d="M300 24 V236 M620 24 V236" stroke="#1b2230" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <text x="460.0" y="122" text-anchor="middle" class="t b" style="fill:#b3261e">about 300,000 numbers</text>
  <text x="460.0" y="142" text-anchor="middle" class="t b" style="fill:#b3261e">handed out twice</text>
  <text x="290" y="258" text-anchor="end" class="s b">the standby's copy:</text>
  <text x="290" y="278" text-anchor="end" class="s b">n − 300,000</text>
  <text x="630" y="258" class="s b">n: the last number</text>
  <text x="630" y="278" class="s b">the client received</text>
</svg>
