<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-label="WAL per row after a checkpoint, in bytes: sequence with a step 176, composite key 183, gen_random_uuid 487, uuidv7 182, time region counter 174.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .t { font-size: 16px; } .s { font-size: 14px; }
  </style>
  <rect width="900" height="310" fill="#fff"/>
<text x="40" y="34" class="t b">WAL per row after a checkpoint, in bytes</text>
  <text x="236" y="83" text-anchor="end" class="t">Sequence with a step</text>
  <rect x="250" y="60" width="176" height="32" rx="3" fill="#9db7da"/>
  <text x="436" y="83" class="t b">176</text>
  <text x="236" y="129" text-anchor="end" class="t">(region, id)</text>
  <rect x="250" y="106" width="183" height="32" rx="3" fill="#9db7da"/>
  <text x="443" y="129" class="t b">183</text>
  <text x="236" y="175" text-anchor="end" class="t b">gen_random_uuid()</text>
  <rect x="250" y="152" width="487" height="32" rx="3" fill="#eb6834"/>
  <text x="747" y="175" class="t b" style="fill:#b8431a">487</text>
  <text x="236" y="221" text-anchor="end" class="t">uuidv7()</text>
  <rect x="250" y="198" width="182" height="32" rx="3" fill="#9db7da"/>
  <text x="442" y="221" class="t b">182</text>
  <text x="236" y="267" text-anchor="end" class="t">Time, region, counter</text>
  <rect x="250" y="244" width="174" height="32" rx="3" fill="#9db7da"/>
  <text x="434" y="267" class="t b">174</text>
  <path d="M250 52 V282" stroke="#1b2230" stroke-width="1.5" fill="none"/>
  <text x="550" y="144" class="s muted">nearly three times the row with a sequence</text>
</svg>
