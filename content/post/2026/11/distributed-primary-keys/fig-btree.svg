<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="Where new rows land in a primary key index. A random uuid sends each insert to a different leaf page, and the first change to a page after a checkpoint writes the whole page to the WAL: 24,396 full-page images and 487 bytes of WAL per row over 500,000 rows. uuidv7 or a sequence sends the inserts to the rightmost page: 10 full-page images and 182 bytes of WAL per row.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .page { fill: #f1f3f7; stroke: #b9c4d6; stroke-width: 1.5; }
    .hit { fill: #fde3d5; stroke: #eb6834; stroke-width: 2; }
    .hit2 { fill: #dbe7f7; stroke: #2a78d6; stroke-width: 2; }
    .t { font-size: 16px; } .s { font-size: 14px; }
  </style>
  <rect width="900" height="330" fill="#fff"/>
  <text x="40" y="36" class="t b">random uuid</text>
  <rect class="page" x="40" y="150" width="24" height="44" rx="3"/>
  <rect class="hit" x="70" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="100" y="150" width="24" height="44" rx="3"/>
  <rect class="hit" x="130" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="160" y="150" width="24" height="44" rx="3"/>
  <rect class="hit" x="190" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="220" y="150" width="24" height="44" rx="3"/>
  <rect class="hit" x="250" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="280" y="150" width="24" height="44" rx="3"/>
  <rect class="hit" x="310" y="150" width="24" height="44" rx="3"/>
  <rect class="hit" x="340" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="370" y="150" width="24" height="44" rx="3"/>
  <rect class="hit" x="400" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="430" y="150" width="24" height="44" rx="3"/>
  <path d="M70.0 62 L82.0 144" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M77.0 137 L82.0 145 L87.0 137" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M130.0 62 L142.0 144" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M137.0 137 L142.0 145 L147.0 137" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M190.0 62 L202.0 144" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M197.0 137 L202.0 145 L207.0 137" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M250.0 62 L262.0 144" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M257.0 137 L262.0 145 L267.0 137" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M310.0 62 L322.0 144" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M317.0 137 L322.0 145 L327.0 137" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M370.0 62 L352.0 144" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M347.0 137 L352.0 145 L357.0 137" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M430.0 62 L412.0 144" stroke="#b8431a" stroke-width="2" fill="none"/>
  <path d="M407.0 137 L412.0 145 L417.0 137" stroke="#b8431a" stroke-width="2" fill="none"/>
  <text x="40" y="58" class="s muted">new rows</text>
  <text x="40" y="216" class="s muted">leaf pages of the index, left to right</text>
  <text x="40" y="250" class="t">every insert lands on another page</text>
  <text x="40" y="274" class="t b" style="fill:#b8431a">24,396 full-page images,</text>
  <text x="40" y="298" class="t b" style="fill:#b8431a">487 bytes of WAL per row</text>
  <text x="480" y="36" class="t b">uuidv7() or a sequence</text>
  <rect class="page" x="480" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="510" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="540" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="570" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="600" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="630" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="660" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="690" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="720" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="750" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="780" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="810" y="150" width="24" height="44" rx="3"/>
  <rect class="page" x="840" y="150" width="24" height="44" rx="3"/>
  <rect class="hit2" x="870" y="150" width="24" height="44" rx="3"/>
  <path d="M882.0 62 L882.0 144" stroke="#1f5fb0" stroke-width="2" fill="none"/>
  <path d="M877.0 137 L882.0 145 L887.0 137" stroke="#1f5fb0" stroke-width="2" fill="none"/>
  <text x="480" y="58" class="s muted">new rows</text>
  <text x="480" y="216" class="s muted">leaf pages of the index, left to right</text>
  <text x="480" y="250" class="t">every insert lands on the last page</text>
  <text x="480" y="274" class="t b" style="fill:#1f5fb0">10 full-page images,</text>
  <text x="480" y="298" class="t b" style="fill:#1f5fb0">182 bytes of WAL per row</text>
</svg>
