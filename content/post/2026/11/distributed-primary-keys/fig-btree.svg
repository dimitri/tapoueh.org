    .hit { fill: #fff; stroke: #eb6834; stroke-width: 2.5; } .hitf { fill: #f6b896; }
    .hit2 { fill: #fff; stroke: #2a78d6; stroke-width: 2.5; } .hit2f { fill: #a9c6ec; }
    .t { font-size: 16px; } .s { font-size: 14px; }
