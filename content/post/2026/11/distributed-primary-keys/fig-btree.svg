<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="Where new rows land in a primary key index, and how full the pages stay. A random uuid sends each insert to a different leaf page, splits leave the pages about 70% full, and the first change to a page after a checkpoint writes the whole page to the WAL: 24,396 full-page images and 487 bytes of WAL per row over 500,000 rows. uuidv7 or a sequence sends the inserts to the rightmost page, the pages behind it stay 90% full: 10 full-page images and 182 bytes of WAL per row.">
