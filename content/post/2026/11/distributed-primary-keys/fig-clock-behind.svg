<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="The time carried by ids against wall time. The old primary climbs with the clock. After a promotion, a new primary whose clock is d behind makes time-based ids, bigint or uuidv7, that are below the highest id made before, until its clock catches up. A regionseq id keeps counting from the last id and never goes below it.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .axis { stroke: #1b2230; stroke-width: 1.5; fill: none; }
    .t { font-size: 16px; } .s { font-size: 14px; }
  </style>
  <rect width="900" height="410" fill="#fff"/>
  <path class="axis" d="M70 50 V300 H840"/>
  <text x="70" y="26" class="t b">Time carried by the id, against wall time</text>
  <text x="840" y="326" text-anchor="end" class="s muted">wall time</text>
  <rect x="300" y="60" width="40" height="240" fill="#e1e6ee"/>
  <text x="320.0" y="326" text-anchor="middle" class="s muted">promotion</text>
  <path d="M340 180.5 L830 9.0" stroke="#b9c4d6" stroke-width="2" stroke-dasharray="2 5" fill="none"/>
  <text x="826" y="-1.0" text-anchor="end" class="s muted">the true time</text>
  <path d="M340 194.5 H514.3 L340 255.5 Z" fill="#fde3d5"/>
  <path d="M300 194.5 H830" stroke="#1b2230" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <text x="826" y="186.5" text-anchor="end" class="s">highest id made before the promotion</text>
  <path d="M70 275.0 L300 194.5" stroke="#2a78d6" stroke-width="3.5" fill="none"/>
  <text x="86" y="255.4" class="s b" style="fill:#1f5fb0">old primary</text>
  <path d="M340 255.5 L830 84.0" stroke="#eb6834" stroke-width="3.5" fill="none"/>
  <path d="M340 194.5 H514.3 L830 84.0" stroke="#1baf7a" stroke-width="3.5" fill="none" stroke-dasharray="14 9" stroke-dashoffset="0"/>
  <path d="M760 33.5 V108.5" stroke="#1b2230" stroke-width="2" fill="none"/>
  <path d="M754 41.5 L760 33.5 L766 41.5 M754 100.5 L760 108.5 L766 100.5" stroke="#1b2230" stroke-width="2" fill="none"/>
  <text x="774" y="76.0" class="t b">d</text>
  <path d="M514.3 290 V300" stroke="#1b2230" stroke-width="1.5"/>
  <text x="514.3" y="326" text-anchor="middle" class="s muted">the clock has caught up</text>
  <rect x="40" y="352" width="26" height="6" fill="#eb6834"/>
  <text x="78" y="360" class="s"><tspan class="b" style="fill:#b8431a">time-based bigint, uuidv7():</tspan> the new primary's clock, d behind: ids below the highest one until it catches up</text>
  <rect x="40" y="384" width="26" height="6" fill="#1baf7a"/>
  <text x="78" y="392" class="s"><tspan class="b" style="fill:#0d7a55">regionseq:</tspan> keeps counting from the last id, never below it, until its clock catches up and it follows it</text>
</svg>
