<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 602" role="img" aria-label="Byte layouts measured on Postgres 19rc1. A row with a bigint key, a smallint region and a 32-byte payload: a 24-byte header, 8 bytes of id, 2 of region, 33 of payload, padded to 72 bytes. With a (region smallint, id bigint) key: 6 bytes of padding before the id, and the row is padded to 80 bytes. With a uuid key: 16 bytes of id, padded to 80 bytes. A primary key entry: an 8-byte header and the key, 16 bytes for a bigint, 24 for (region, id) because of 6 bytes of padding, and 24 for a uuid.">
