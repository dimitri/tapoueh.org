  <text x="40.0" y="558" class="s muted" text-anchor="start">A bigint starts on a multiple of 8 bytes, a smallint on a multiple of 2; a uuid and a short text need no alignment.</text>
  <text x="40.0" y="580" class="s muted" text-anchor="start">Every row and every entry is then padded to a multiple of 8, and the page adds a 4-byte line pointer for each.</text>
