<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="Share of the ids made after a switchover that are below one made before, when the new primary clock is 5, 10 or 60 seconds behind. Time-based bigint: 11%, 55%, all. uuidv7: 20%, 53%, all. regionseq: 0 in all three.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .t { font-size: 16px; } .s { font-size: 14px; }
  </style>
  <rect width="900" height="390" fill="#fff"/>
<text x="40" y="30" class="t b">Ids made after a switchover that are below one made before</text>
  <rect x="40" y="44" width="14" height="14" rx="2" fill="#2a78d6"/><text x="62" y="57" class="s">time-based bigint</text>
  <rect x="230" y="44" width="14" height="14" rx="2" fill="#eb6834"/><text x="252" y="57" class="s">uuidv7()</text>
  <rect x="420" y="44" width="14" height="14" rx="2" fill="#1baf7a"/><text x="442" y="57" class="s">regionseq</text>
  <path d="M100 330 H850" stroke="#e1e6ee" stroke-width="1"/><text x="90" y="335" text-anchor="end" class="s muted">0%</text>
  <path d="M100 270 H850" stroke="#e1e6ee" stroke-width="1"/><text x="90" y="275" text-anchor="end" class="s muted">25%</text>
  <path d="M100 210 H850" stroke="#e1e6ee" stroke-width="1"/><text x="90" y="215" text-anchor="end" class="s muted">50%</text>
  <path d="M100 150 H850" stroke="#e1e6ee" stroke-width="1"/><text x="90" y="155" text-anchor="end" class="s muted">75%</text>
  <path d="M100 90 H850" stroke="#e1e6ee" stroke-width="1"/><text x="90" y="95" text-anchor="end" class="s muted">100%</text>
  <rect x="140" y="304" width="56" height="26" rx="3" fill="#2a78d6"/>
  <text x="168.0" y="296" text-anchor="middle" class="t b">11%</text>
  <rect x="206" y="282" width="56" height="48" rx="3" fill="#eb6834"/>
  <text x="234.0" y="274" text-anchor="middle" class="t b">20%</text>
  <rect x="272" y="327" width="56" height="3" fill="#1baf7a"/>
  <text x="300.0" y="322" text-anchor="middle" class="t b">0</text>
  <text x="234.0" y="358" text-anchor="middle" class="t">clock 5 s behind</text>
  <rect x="390" y="198" width="56" height="132" rx="3" fill="#2a78d6"/>
  <text x="418.0" y="190" text-anchor="middle" class="t b">55%</text>
  <rect x="456" y="203" width="56" height="127" rx="3" fill="#eb6834"/>
  <text x="484.0" y="195" text-anchor="middle" class="t b">53%</text>
  <rect x="522" y="327" width="56" height="3" fill="#1baf7a"/>
  <text x="550.0" y="322" text-anchor="middle" class="t b">0</text>
  <text x="484.0" y="358" text-anchor="middle" class="t">clock 10 s behind</text>
  <rect x="640" y="90" width="56" height="240" rx="3" fill="#2a78d6"/>
  <text x="668.0" y="82" text-anchor="middle" class="t b">all</text>
  <rect x="706" y="90" width="56" height="240" rx="3" fill="#eb6834"/>
  <text x="734.0" y="82" text-anchor="middle" class="t b">all</text>
  <rect x="772" y="327" width="56" height="3" fill="#1baf7a"/>
  <text x="800.0" y="322" text-anchor="middle" class="t b">0</text>
  <text x="734.0" y="358" text-anchor="middle" class="t">clock 60 s behind</text>
  <path d="M100 330 H850" stroke="#1b2230" stroke-width="1.5"/>
</svg>
