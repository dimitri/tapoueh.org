<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" role="img" aria-label="Four tables and the row filter of a publication by region. On an update or a delete, the subscriber finds the row by its replica identity, the primary key by default, and the filter may only use those columns. A uuid key with the default identity refuses a filter on region. A uuid with a unique index on id and region as identity works, with a second index. A composite region and id key works, since the key holds the region. The time-based bigint works with the default identity, since the filter reads the region bits of the key.">
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #1b2230; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .muted { fill: #5c6b84; } .b { font-weight: 700; }
    .t { font-size: 15px; } .s { font-size: 13.5px; } .h { font-size: 15px; font-weight: 700; }
    .ri { fill: #dbe7f7; stroke: #2a78d6; stroke-width: 2.5; } .col { fill: #fff; stroke: #b9c4d6; stroke-width: 1.5; }
  </style>
  <rect width="900" height="414" fill="#fff"/>
  <text x="30" y="30" class="s b muted">KEY</text>
  <text x="280" y="30" class="s b muted">COLUMNS OF THE ROW, IDENTITY IN BLUE</text>
  <text x="610" y="30" class="s b muted">ROW FILTER ON UPDATE AND DELETE</text>
  <rect x="280" y="40" width="14" height="14" class="ri"/><text x="300" y="52" class="s muted">sent to find the row on the subscriber</text>
  <text x="30" y="112" class="h">uuid, primary key as identity</text>
  <rect x="280" y="84" width="90" height="44" rx="3" class="ri"/>
  <text x="325.0" y="111" text-anchor="middle" class="t mono">id</text>
  <rect x="374" y="84" width="80" height="44" rx="3" class="col"/>
  <text x="414.0" y="111" text-anchor="middle" class="t mono">region</text>
  <rect x="458" y="84" width="110" height="44" rx="3" class="col"/>
  <text x="513.0" y="111" text-anchor="middle" class="t mono">payload</text>
  <text x="610" y="102" class="s mono">where (region = 1)</text>
  <text x="610" y="122" class="t b" style="fill:#b3261e">✗ refused: region isn't in the identity</text>
  <text x="30" y="186" class="h">uuid, unique (id, region)</text>
  <rect x="280" y="158" width="90" height="44" rx="3" class="ri"/>
  <text x="325.0" y="185" text-anchor="middle" class="t mono">id</text>
  <rect x="374" y="158" width="80" height="44" rx="3" class="ri"/>
  <text x="414.0" y="185" text-anchor="middle" class="t mono">region</text>
  <rect x="458" y="158" width="110" height="44" rx="3" class="col"/>
  <text x="513.0" y="185" text-anchor="middle" class="t mono">payload</text>
  <text x="610" y="176" class="s mono">where (region = 1)</text>
  <text x="610" y="196" class="t b" style="fill:#0d7a55">✓ works, with a second index</text>
  <text x="30" y="260" class="h">composite (region, id)</text>
  <rect x="280" y="232" width="80" height="44" rx="3" class="ri"/>
  <text x="320.0" y="259" text-anchor="middle" class="t mono">region</text>
  <rect x="364" y="232" width="90" height="44" rx="3" class="ri"/>
  <text x="409.0" y="259" text-anchor="middle" class="t mono">id</text>
  <rect x="458" y="232" width="110" height="44" rx="3" class="col"/>
  <text x="513.0" y="259" text-anchor="middle" class="t mono">payload</text>
  <text x="610" y="250" class="s mono">where (region = 1)</text>
  <text x="610" y="270" class="t b" style="fill:#0d7a55">✓ works: the key holds the region</text>
  <text x="30" y="334" class="h">time-based bigint</text>
  <rect x="280" y="306" width="90" height="44" rx="3" class="ri"/>
  <text x="310" y="333" text-anchor="middle" class="t mono">id</text>
  <rect x="336" y="312" width="12" height="32" fill="#fde3d5" stroke="#eb6834" stroke-width="1.5"/>
  <rect x="374" y="306" width="80" height="44" rx="3" class="col"/>
  <text x="414.0" y="333" text-anchor="middle" class="t mono">region</text>
  <rect x="458" y="306" width="110" height="44" rx="3" class="col"/>
  <text x="513.0" y="333" text-anchor="middle" class="t mono">payload</text>
  <text x="610" y="324" class="s mono">where ((id &gt;&gt; 18) &amp; 15) = 1</text>
  <text x="610" y="344" class="t b" style="fill:#0d7a55">✓ works: the filter reads the key</text>
  <text x="30" y="394" class="s muted">The orange mark in the bigint is its 4 region bits.</text>
</svg>
