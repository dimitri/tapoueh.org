<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Where the replication code runs. Core logical replication: a walsender with the built-in pgoutput plugin on the source, an apply worker on the target, which pulls the stream. pglogical: the same two roles, played by an extension that must be installed on both servers. pgcopydb: a separate process on its own host, between two unmodified servers, which pulls the stream from the source, keeps it in SQLite files, and pushes SQL to the target.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .col { font-size: 12px; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .node-core { stroke: #2e7d32; }
    .node-ext { stroke: #2a6fdb; }
    .node-ext2 { stroke: #7b4fc9; }
    .node-out { stroke: #c2570c; }
    .node-plain { stroke: #556; }
    .node-title { font-size: 14.5px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11.5px; fill: #5c6b84; }
    .a { stroke: #37414f; stroke-width: 2; fill: none; marker-end: url(#m1); }
    .lbl { font-size: 12px; fill: #37414f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .col { fill: #aab2c2; }
      .node { fill: #1d2129; } .node-core { stroke: #66bb6a; } .node-ext { stroke: #6ea8ff; } .node-ext2 { stroke: #b39ddb; } .node-out { stroke: #ff9a5c; } .node-plain { stroke: #99a; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .a { stroke: #c3cadb; } .lbl { fill: #c3cadb; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
  </defs>

  <text class="title" x="30" y="32">Where the replication code runs</text>
  <text class="col" x="140" y="64" text-anchor="middle">Source server</text>
  <text class="col" x="500" y="64" text-anchor="middle">Between the servers</text>
  <text class="col" x="860" y="64" text-anchor="middle">Target server</text>

  <rect class="node node-core" x="20" y="80" width="240" height="72" rx="8"/>
  <text class="node-title" x="140" y="110" text-anchor="middle">Core Postgres</text>
  <text class="node-sub" x="140" y="132" text-anchor="middle">walsender + built-in pgoutput</text>
  <text class="lbl" x="500" y="108" text-anchor="middle">built in; the target pulls</text>
  <path class="a" d="M264 118 L736 118"/>
  <rect class="node node-core" x="740" y="80" width="240" height="72" rx="8"/>
  <text class="node-title" x="860" y="110" text-anchor="middle">Core Postgres</text>
  <text class="node-sub" x="860" y="132" text-anchor="middle">subscription apply worker</text>

  <rect class="node node-ext" x="20" y="180" width="240" height="72" rx="8"/>
  <text class="node-title" x="140" y="210" text-anchor="middle">Postgres + pglogical</text>
  <text class="node-sub" x="140" y="232" text-anchor="middle">extension, its own output plugin</text>
  <text class="lbl" x="500" y="208" text-anchor="middle">extension on both sides; the target pulls</text>
  <path class="a" d="M264 218 L736 218"/>
  <rect class="node node-ext" x="740" y="180" width="240" height="72" rx="8"/>
  <text class="node-title" x="860" y="210" text-anchor="middle">Postgres + pglogical</text>
  <text class="node-sub" x="860" y="232" text-anchor="middle">extension, its own apply workers</text>

  <rect class="node node-plain" x="20" y="280" width="240" height="96" rx="8"/>
  <text class="node-title" x="140" y="322" text-anchor="middle">Unmodified Postgres</text>
  <text class="node-sub" x="140" y="344" text-anchor="middle">no extension, any hosting</text>
  <path class="a" d="M264 328 L376 328"/>
  <rect class="node node-out" x="380" y="280" width="240" height="96" rx="8"/>
  <text class="node-title" x="500" y="308" text-anchor="middle">pgcopydb process</text>
  <text class="node-sub" x="500" y="330" text-anchor="middle">pulls the stream, pushes SQL</text>
  <text class="node-sub" x="500" y="348" text-anchor="middle">SQLite spool files on its own host</text>
  <path class="a" d="M624 328 L736 328"/>
  <rect class="node node-plain" x="740" y="280" width="240" height="96" rx="8"/>
  <text class="node-title" x="860" y="322" text-anchor="middle">Unmodified Postgres</text>
  <text class="node-sub" x="860" y="344" text-anchor="middle">no extension, any hosting</text>
</svg>
