<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" role="img" aria-label="What runs at each site. Each region is a pg_auto_failover group of its own: a monitor and three nodes. In us-east the primary publishes pub_us_east, runs the subscription sub_us_east_from_us_west and holds the failover-enabled slot sub_us_west_from_us_east; the two standbys keep a synced copy of that slot and have the subscription in their catalogs without a worker. us-west is the same, mirrored: its subscription lists the three us-east nodes.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .node-primary { stroke: #2a6fdb; }
    .node-standby { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-monitor { stroke: #7a5cc2; }
    .node-remote { stroke: #556; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .chip { fill: #eef2f9; stroke: #b9c4d6; stroke-width: 1; }
    .chip-slot { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.2; }
    .chip-t { font-size: 11px; fill: #1b2230; }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; marker-end: url(#m1); }
    .st { stroke: #7a5cc2; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; marker-end: url(#m3); }
    .ls { stroke: #c2570c; stroke-width: 2.5; fill: none; marker-end: url(#m2); }
    .lf { stroke: #c2570c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#m2); }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lblbg { fill: #fff; opacity: 0.92; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .node-primary { stroke: #6ea8ff; }
      .node-standby { stroke: #5fb8d6; } .node-monitor { stroke: #b39af0; } .node-remote { stroke: #99a; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .chip { fill: #262c38; stroke: #4a5873; } .chip-slot { fill: #3a2a1d; stroke: #ff9a57; } .chip-t { fill: #e8e8e8; }
      .pr { stroke: #c3cadb; } .st { stroke: #b39af0; } .ls { stroke: #ff9a57; } .lf { stroke: #ff9a57; }
      .lbl { fill: #c3cadb; } .lblbg { fill: #15181e; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="m3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a5cc2"/></marker>
  </defs>

  <text class="title" x="30" y="32">What runs at each site</text>
  <rect class="zone" x="20" y="52" width="290" height="560" rx="12"/><text class="zone-label" x="36" y="76">REGION us-west: ONE GROUP</text>
  <rect class="zone" x="386" y="52" width="674" height="560" rx="12"/><text class="zone-label" x="402" y="76">REGION us-east: ONE GROUP</text>
  <rect class="node node-monitor" x="36" y="92" width="258" height="48" rx="8"/><text class="node-title" x="165.0" y="114" text-anchor="middle" style="font-size:13px">us-west-monitor</text><text class="node-sub" x="165.0" y="130" text-anchor="middle">Postgres + pgautofailover extension</text>
  <rect class="node node-monitor" x="716" y="92" width="260" height="48" rx="8"/><text class="node-title" x="846.0" y="114" text-anchor="middle" style="font-size:13px">us-east-monitor</text><text class="node-sub" x="846.0" y="130" text-anchor="middle">Postgres + pgautofailover extension</text>
  <rect class="node node-primary" x="36" y="190" width="258" height="292" rx="8"/><text class="node-title" x="165.0" y="216" text-anchor="middle">us-west-a: primary</text>
  <rect class="chip" x="46" y="234" width="238" height="28" rx="5"/><text class="chip-t" x="54" y="251">Postgres 17, wal_level = logical</text>
  <rect class="chip" x="46" y="270" width="238" height="28" rx="5"/><text class="chip-t" x="54" y="287">pg_autoctl keeper</text>
  <rect class="chip" x="46" y="306" width="238" height="28" rx="5"/><text class="chip-t" x="54" y="323">pub_us_west: WHERE region = 'us-west'</text>
  <rect class="chip-slot" x="46" y="342" width="238" height="44" rx="5"/><text class="chip-t" x="54" y="359">slot sub_us_east_from_us_west</text><text class="chip-t" x="54" y="375">(failover = true)</text>
  <rect class="chip" x="46" y="394" width="238" height="60" rx="5"/><text class="chip-t" x="54" y="411">sub_us_west_from_us_east (worker)</text><text class="chip-t" x="54" y="427">host = us-east-a, -b, -c</text><text class="chip-t" x="54" y="443">target_session_attrs = read-write</text>
  <rect class="node node-standby" x="36" y="498" width="258" height="70" rx="8"/><text class="node-title" x="165.0" y="524" text-anchor="middle">us-west-b, us-west-c: standbys</text>
  <text class="node-sub" x="165" y="546" text-anchor="middle">same as the us-east standbys</text>
  <rect class="node node-primary" x="396" y="190" width="220" height="352" rx="8"/><text class="node-title" x="506.0" y="216" text-anchor="middle">us-east-a: primary</text>
  <rect class="chip" x="406" y="234" width="200" height="28" rx="5"/><text class="chip-t" x="414" y="251">Postgres 17, wal_level = logical</text>
  <rect class="chip" x="406" y="270" width="200" height="28" rx="5"/><text class="chip-t" x="414" y="287">pg_autoctl keeper</text>
  <rect class="chip" x="406" y="306" width="200" height="44" rx="5"/><text class="chip-t" x="414" y="323">pub_us_east: WHERE region =</text><text class="chip-t" x="414" y="339">'us-east'</text>
  <rect class="chip" x="406" y="358" width="200" height="44" rx="5"/><text class="chip-t" x="414" y="375">sub_us_east_from_us_west</text><text class="chip-t" x="414" y="391">(worker)</text>
  <rect class="chip-slot" x="406" y="410" width="200" height="44" rx="5"/><text class="chip-t" x="414" y="427">slot sub_us_west_from_us_east</text><text class="chip-t" x="414" y="443">(failover = true)</text>
  <rect class="chip" x="406" y="462" width="200" height="28" rx="5"/><text class="chip-t" x="414" y="479">physical slots for b and c</text>
  <rect class="chip" x="406" y="498" width="200" height="60" rx="5"/><text class="chip-t" x="414" y="515">synchronized_standby_slots =</text><text class="chip-t" x="414" y="531">the slots of b and c: logical</text><text class="chip-t" x="414" y="547">walsenders wait for their flush</text>
  <rect class="node node-standby" x="636" y="190" width="200" height="352" rx="8"/><text class="node-title" x="736.0" y="216" text-anchor="middle">us-east-b: standby</text>
  <rect class="chip" x="646" y="234" width="180" height="28" rx="5"/><text class="chip-t" x="654" y="251">Postgres 17, hot standby</text>
  <rect class="chip" x="646" y="270" width="180" height="28" rx="5"/><text class="chip-t" x="654" y="287">pg_autoctl keeper</text>
  <rect class="chip" x="646" y="306" width="180" height="44" rx="5"/><text class="chip-t" x="654" y="323">sync_replication_slots = on</text><text class="chip-t" x="654" y="339">dbname in primary_conninfo</text>
  <rect class="chip-slot" x="646" y="358" width="180" height="44" rx="5"/><text class="chip-t" x="654" y="375">synced copy of</text><text class="chip-t" x="654" y="391">sub_us_west_from_us_east</text>
  <rect class="chip" x="646" y="410" width="180" height="60" rx="5"/><text class="chip-t" x="654" y="427">sub_us_east_from_us_west:</text><text class="chip-t" x="654" y="443">catalogs only, no worker</text><text class="chip-t" x="654" y="459">until promoted</text>
  <rect class="node node-standby" x="846" y="190" width="200" height="352" rx="8"/><text class="node-title" x="946.0" y="216" text-anchor="middle">us-east-c: standby</text>
  <rect class="chip" x="856" y="234" width="180" height="28" rx="5"/><text class="chip-t" x="864" y="251">Postgres 17, hot standby</text>
  <rect class="chip" x="856" y="270" width="180" height="28" rx="5"/><text class="chip-t" x="864" y="287">pg_autoctl keeper</text>
  <rect class="chip" x="856" y="306" width="180" height="44" rx="5"/><text class="chip-t" x="864" y="323">sync_replication_slots = on</text><text class="chip-t" x="864" y="339">dbname in primary_conninfo</text>
  <rect class="chip-slot" x="856" y="358" width="180" height="44" rx="5"/><text class="chip-t" x="864" y="375">synced copy of</text><text class="chip-t" x="864" y="391">sub_us_west_from_us_east</text>
  <rect class="chip" x="856" y="410" width="180" height="60" rx="5"/><text class="chip-t" x="864" y="427">sub_us_east_from_us_west:</text><text class="chip-t" x="864" y="443">catalogs only, no worker</text><text class="chip-t" x="864" y="459">until promoted</text>
  <path class="pr" d="M616 300 L636 300"/>
  <path class="st" d="M736 190 L736 146"/>
  <path class="st" d="M946 190 L946 146"/>
  <path class="ls" d="M284 364 L406 380"/><text class="lbl" x="318" y="358">west rows</text>
  <path class="ls" d="M406 432 L284 424"/><text class="lbl" x="318" y="454">east rows</text>
  <path class="lf" d="M165 568 L165 636 L736 636 L736 546"/><rect class="lblbg" x="190" y="622" width="420" height="18" rx="3"/><text class="lbl" x="200" y="635">after a promotion, the subscription reaches the new primary (b or c)</text>
</svg>
