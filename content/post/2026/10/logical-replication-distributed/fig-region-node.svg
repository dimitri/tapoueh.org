<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="What runs at each site. The us-east site is a pg_auto_failover group: a monitor, a primary and a standby. The primary runs Postgres, the pg_autoctl keeper, the pub_x publication, the sub_x_from_y subscription and the failover-enabled slot sub_y_from_x. The standby runs a hot standby Postgres, its keeper, and a synced copy of that slot. The other region, plain Postgres, runs the pub_y publication, the slot sub_x_from_y and the sub_y_from_x subscription, whose connection string lists both us-east nodes.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .node-primary { stroke: #2a6fdb; }
    .node-standby { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-monitor { stroke: #7a5cc2; }
    .node-remote { stroke: #556; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .chip { fill: #eef2f9; stroke: #b9c4d6; stroke-width: 1; }
    .chip-slot { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.2; }
    .chip-t { font-size: 11px; fill: #1b2230; }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; marker-end: url(#m1); }
    .st { stroke: #7a5cc2; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; marker-end: url(#m3); }
    .ls { stroke: #c2570c; stroke-width: 2.5; fill: none; marker-end: url(#m2); }
    .lf { stroke: #c2570c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#m2); }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lblbg { fill: #fff; opacity: 0.92; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .node-primary { stroke: #6ea8ff; }
      .node-standby { stroke: #5fb8d6; } .node-monitor { stroke: #b39af0; } .node-remote { stroke: #99a; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .chip { fill: #262c38; stroke: #4a5873; } .chip-slot { fill: #3a2a1d; stroke: #ff9a57; } .chip-t { fill: #e8e8e8; }
      .pr { stroke: #c3cadb; } .st { stroke: #b39af0; } .ls { stroke: #ff9a57; } .lf { stroke: #ff9a57; }
      .lbl { fill: #c3cadb; } .lblbg { fill: #15181e; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
    <marker id="m3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7a5cc2"/></marker>
  </defs>

  <text class="title" x="30" y="32">What runs at each site</text>
  <rect class="zone" x="30" y="52" width="240" height="524" rx="12"/><text class="zone-label" x="46" y="76">REGION Y: PLAIN POSTGRES</text>
  <rect class="zone" x="300" y="52" width="670" height="524" rx="12"/><text class="zone-label" x="316" y="76">REGION us-east: ONE PG_AUTO_FAILOVER GROUP</text>
  <rect class="node node-monitor" x="520" y="90" width="260" height="76" rx="8"/><text class="node-title" x="650" y="118" text-anchor="middle">Monitor</text><text class="node-sub" x="650" y="138" text-anchor="middle">Postgres + pgautofailover extension</text><text class="node-sub" x="650" y="154" text-anchor="middle">state machine, events, region labels</text>
  <rect class="node node-primary" x="330" y="224" width="270" height="338" rx="8"/><text class="node-title" x="465" y="250" text-anchor="middle">us-east-a: primary</text>
  <rect class="node node-standby" x="650" y="224" width="300" height="338" rx="8"/><text class="node-title" x="800" y="250" text-anchor="middle">us-east-b: standby</text>
  <rect class="node node-remote" x="42" y="224" width="216" height="338" rx="8"/><text class="node-title" x="150" y="250" text-anchor="middle">y</text>
  <rect class="chip" x="344" y="264" width="242" height="26" rx="5"/><text class="chip-t" x="354" y="281">Postgres 17, wal_level = logical</text>
  
  <rect class="chip" x="344" y="298" width="242" height="26" rx="5"/><text class="chip-t" x="354" y="315">pg_autoctl keeper</text>
  
  <rect class="chip" x="344" y="332" width="242" height="26" rx="5"/><text class="chip-t" x="354" y="349">pub_x: events WHERE region = 'x'</text>
  
  <rect class="chip" x="344" y="366" width="242" height="26" rx="5"/><text class="chip-t" x="354" y="383">sub_x_from_y (apply worker)</text>
  
  <rect class="chip-slot" x="344" y="400" width="242" height="26" rx="5"/><text class="chip-t" x="354" y="417">slot sub_y_from_x, failover = true</text>
  
  <rect class="chip" x="344" y="434" width="242" height="26" rx="5"/><text class="chip-t" x="354" y="451">physical slot for the standby</text>
  
  <rect class="chip" x="344" y="468" width="242" height="62" rx="5"/><text class="chip-t" x="354" y="485">synchronized_standby_slots =</text><text class="chip-t" x="354" y="501">the standby's physical slot: logical</text><text class="chip-t" x="354" y="517">walsenders wait for its flush</text>
  
  <rect class="chip" x="664" y="264" width="272" height="26" rx="5"/><text class="chip-t" x="674" y="281">Postgres 17, hot standby</text>
  
  <rect class="chip" x="664" y="298" width="272" height="26" rx="5"/><text class="chip-t" x="674" y="315">pg_autoctl keeper</text>
  
  <rect class="chip" x="664" y="332" width="272" height="46" rx="5"/><text class="chip-t" x="674" y="349">sync_replication_slots = on</text><text class="chip-t" x="674" y="365">hot_standby_feedback = on, dbname in conninfo</text>
  
  <rect class="chip-slot" x="664" y="386" width="272" height="26" rx="5"/><text class="chip-t" x="674" y="403">synced copy of sub_y_from_x</text>
  
  <rect class="chip" x="664" y="420" width="272" height="46" rx="5"/><text class="chip-t" x="674" y="437">sub_x_from_y: in the catalogs, but no</text><text class="chip-t" x="674" y="453">worker until the node is promoted</text>
  
  <rect class="chip" x="54" y="264" width="192" height="26" rx="5"/><text class="chip-t" x="64" y="281">Postgres 17</text>
  
  <rect class="chip" x="54" y="298" width="192" height="46" rx="5"/><text class="chip-t" x="64" y="315">pub_y:</text><text class="chip-t" x="64" y="331">events WHERE region = 'y'</text>
  
  <rect class="chip-slot" x="54" y="352" width="192" height="26" rx="5"/><text class="chip-t" x="64" y="369">slot sub_x_from_y</text>
  
  <rect class="chip" x="54" y="386" width="192" height="106" rx="5"/><text class="chip-t" x="64" y="403">sub_y_from_x (apply worker)</text><text class="chip-t" x="64" y="419">host = us-east-a, us-east-b</text><text class="chip-t" x="64" y="435">target_session_attrs =</text><text class="chip-t" x="64" y="451">read-write</text><text class="chip-t" x="64" y="467">failover = true</text>
  
  <path class="pr" d="M600 290 L650 290"/><text class="lbl" x="612" y="282">WAL</text>
  <path class="st" d="M520 224 L580 166"/><path class="st" d="M820 224 L720 166"/><text class="lbl" x="528" y="204">state</text>
  <path class="ls" d="M246 365 L344 379"/><text class="lbl" x="276" y="356">y rows</text>
  <path class="ls" d="M344 413 L246 428"/><text class="lbl" x="276" y="448">x rows</text>
  <path class="lf" d="M150 562 L150 596 L800 596 L800 566"/><rect class="lblbg" x="236" y="582" width="480" height="18" rx="3"/><text class="lbl" x="246" y="595">after a promotion, the same subscription reaches the new primary, which holds the slot</text>
</svg>
