<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Timeline of the failure of the us-east primary, the hub of the cascade, in a five-region system. The us-east writer is blocked for 51 seconds until its new primary accepts writes. The writers of the other three regions never wait more than 0.2 seconds. The rows of us-west on their way to the warehouse stand still for 54 seconds, and the rows of ap-southeast on their way to us-west for 54 to 56 seconds, until the subscriptions reconnect to the new primary, and then they catch up.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .n-own { stroke: #2a6fdb; }
    .n-wh { stroke: #7a5cc2; }
    .n-new { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lbl-b { font-size: 11.5px; fill: #37414f; font-weight: 700; }
    .lg { stroke: #c2570c; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    .lgb { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#m2); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; }
    .ok { fill: #8fd0a8; stroke: #1f7a46; stroke-width: 1.2; }
    .bad { fill: #f2b3ab; stroke: #c0392b; stroke-width: 1.2; }
    .warn { fill: #f6d8b8; stroke: #c2570c; stroke-width: 1.2; }
    .idle { fill: #dfe4ee; stroke: #8a96ab; stroke-width: 1.2; }
    .tick { stroke: #b9c4d6; stroke-width: 1; }
    .axis { stroke: #8a96ab; stroke-width: 1.5; }
    .ev { stroke: #37414f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .chip { fill: #fff; stroke-width: 1.4; }
    .c-core { stroke: #2a6fdb; } .c-paf { stroke: #7a5cc2; } .c-you { stroke: #c2570c; stroke-dasharray: 5 3; }
    .band-core { fill: #eaf1fd; stroke: #2a6fdb; stroke-width: 1.5; }
    .band-paf { fill: #f1ecfb; stroke: #7a5cc2; stroke-width: 1.5; }
    .band-you { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .badt { font-size: 11.5px; font-weight: 700; fill: #c0392b; }
    .okt { font-size: 11.5px; font-weight: 700; fill: #1f7a46; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .numc { fill: #c2570c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .n-own { stroke: #6ea8ff; } .n-wh { stroke: #b39af0; } .n-new { stroke: #5fb8d6; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .lbl, .lbl-b { fill: #c3cadb; }
      .lg, .lgb { stroke: #ff9a57; } .pr { stroke: #c3cadb; }
      .ok { fill: #1f4a33; stroke: #6fd69b; } .bad { fill: #5a2822; stroke: #ff7b6b; }
      .warn { fill: #4a3320; stroke: #ff9a57; } .idle { fill: #2a303c; stroke: #6b7790; }
      .tick { stroke: #3b465b; } .axis { stroke: #6b7790; } .ev { stroke: #c3cadb; }
      .chip { fill: #1d2129; } .c-core { stroke: #6ea8ff; } .c-paf { stroke: #b39af0; } .c-you { stroke: #ff9a57; }
      .band-core { fill: #1b2638; stroke: #6ea8ff; } .band-paf { fill: #251f36; stroke: #b39af0; } .band-you { fill: #33241a; stroke: #ff9a57; }
      .badt { fill: #ff7b6b; } .okt { fill: #6fd69b; } .numc { fill: #ff9a57; } .num { fill: #1d2129; }
    }
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <text class="title" x="30" y="32" text-anchor="start">Killing the hub: its own writer waits, the rows downstream of it stand still</text>
  <text class="lbl" x="30" y="130" text-anchor="start">us-east writer</text>
  <rect class="bad" x="300.0" y="110" width="540.75" height="30" rx="3"/>
  <text class="lbl-b" x="308.0" y="130" text-anchor="start">blocked 51 s</text>
  <rect class="ok" x="840.75" y="110" width="89.25" height="30" rx="3"/>
  <text class="lbl" x="30" y="180" text-anchor="start">us-west, ap-south, ap-southeast writers</text>
  <rect class="ok" x="300.0" y="160" width="630.0" height="30" rx="3"/>
  <text class="lbl-b" x="308.0" y="180" text-anchor="start">never wait more than 0.2 s</text>
  <text class="lbl" x="30" y="230" text-anchor="start">us-west rows arriving on eu-west</text>
  <rect class="bad" x="300.0" y="210" width="567.0" height="30" rx="3"/>
  <text class="lbl-b" x="308.0" y="230" text-anchor="start">stand still 54 s</text>
  <rect class="ok" x="867.0" y="210" width="63.0" height="30" rx="3"/>
  <text class="lbl" x="30" y="280" text-anchor="start">ap-southeast rows arriving on us-west</text>
  <rect class="bad" x="300.0" y="260" width="577.5" height="30" rx="3"/>
  <text class="lbl-b" x="308.0" y="280" text-anchor="start">stand still 54 to 56 s</text>
  <rect class="ok" x="877.5" y="260" width="52.5" height="30" rx="3"/>
  <path class="axis" d="M300 310 L930.0 310"/>
  <path class="axis" d="M300.0 306 L300.0 314"/>
  <text class="lbl" x="300.0" y="330" text-anchor="middle">0 s</text>
  <path class="axis" d="M405.0 306 L405.0 314"/>
  <text class="lbl" x="405.0" y="330" text-anchor="middle">10 s</text>
  <path class="axis" d="M510.0 306 L510.0 314"/>
  <text class="lbl" x="510.0" y="330" text-anchor="middle">20 s</text>
  <path class="axis" d="M615.0 306 L615.0 314"/>
  <text class="lbl" x="615.0" y="330" text-anchor="middle">30 s</text>
  <path class="axis" d="M720.0 306 L720.0 314"/>
  <text class="lbl" x="720.0" y="330" text-anchor="middle">40 s</text>
  <path class="axis" d="M825.0 306 L825.0 314"/>
  <text class="lbl" x="825.0" y="330" text-anchor="middle">50 s</text>
  <path class="axis" d="M930.0 306 L930.0 314"/>
  <text class="lbl" x="930.0" y="330" text-anchor="middle">60 s</text>
  <path class="ev" d="M300.0 72 L300.0 310"/>
  <text class="lbl-b" x="306.0" y="66" text-anchor="start">kill -9 on the us-east primary</text>
  <path class="ev" d="M405.0 90 L405.0 310"/>
  <text class="lbl-b" x="411.0" y="84" text-anchor="start">monitor: node unhealthy</text>
  <path class="ev" d="M840.75 72 L840.75 310"/>
  <text class="lbl-b" x="834.75" y="66" text-anchor="end">new primary accepts writes</text>
  <path class="ev" d="M877.5 90 L877.5 310"/>
  <text class="lbl-b" x="871.5" y="84" text-anchor="end">subscriptions reconnect</text>
  <text class="lbl" x="30" y="372" text-anchor="start">Three runs, a writer in each of four regions. Two seconds after the writers stop, all five primaries hold every acknowledged row.</text>

</svg>
