<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Three ways to add a column on two regions that replicate to each other. First, altering one region and then the other: the second region fails to apply rows with the new column until it is altered too, then catches up. Second, pausing the writers, altering every primary, and resuming: a pause of about a second and no error. Third, carrying the statement in the replication stream, as pgcopydb and pglogical can: no pause and no lag.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .n-own { stroke: #2a6fdb; }
    .n-wh { stroke: #7a5cc2; }
    .n-new { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lbl-b { font-size: 11.5px; fill: #37414f; font-weight: 700; }
    .lg { stroke: #c2570c; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    .lgb { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#m2); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; }
    .ok { fill: #8fd0a8; stroke: #1f7a46; stroke-width: 1.2; }
    .bad { fill: #f2b3ab; stroke: #c0392b; stroke-width: 1.2; }
    .warn { fill: #f6d8b8; stroke: #c2570c; stroke-width: 1.2; }
    .idle { fill: #dfe4ee; stroke: #8a96ab; stroke-width: 1.2; }
    .tick { stroke: #b9c4d6; stroke-width: 1; }
    .axis { stroke: #8a96ab; stroke-width: 1.5; }
    .ev { stroke: #37414f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .chip { fill: #fff; stroke-width: 1.4; }
    .c-core { stroke: #2a6fdb; } .c-paf { stroke: #7a5cc2; } .c-you { stroke: #c2570c; stroke-dasharray: 5 3; }
    .band-core { fill: #eaf1fd; stroke: #2a6fdb; stroke-width: 1.5; }
    .band-paf { fill: #f1ecfb; stroke: #7a5cc2; stroke-width: 1.5; }
    .band-you { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .badt { font-size: 11.5px; font-weight: 700; fill: #c0392b; }
    .okt { font-size: 11.5px; font-weight: 700; fill: #1f7a46; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .numc { fill: #c2570c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .n-own { stroke: #6ea8ff; } .n-wh { stroke: #b39af0; } .n-new { stroke: #5fb8d6; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .lbl, .lbl-b { fill: #c3cadb; }
      .lg, .lgb { stroke: #ff9a57; } .pr { stroke: #c3cadb; }
      .ok { fill: #1f4a33; stroke: #6fd69b; } .bad { fill: #5a2822; stroke: #ff7b6b; }
      .warn { fill: #4a3320; stroke: #ff9a57; } .idle { fill: #2a303c; stroke: #6b7790; }
      .tick { stroke: #3b465b; } .axis { stroke: #6b7790; } .ev { stroke: #c3cadb; }
      .chip { fill: #1d2129; } .c-core { stroke: #6ea8ff; } .c-paf { stroke: #b39af0; } .c-you { stroke: #ff9a57; }
      .band-core { fill: #1b2638; stroke: #6ea8ff; } .band-paf { fill: #251f36; stroke: #b39af0; } .band-you { fill: #33241a; stroke: #ff9a57; }
      .badt { fill: #ff7b6b; } .okt { fill: #6fd69b; } .numc { fill: #ff9a57; } .num { fill: #1d2129; }
    }
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <text class="title" x="30" y="32" text-anchor="start">Adding a column on two regions that write to each other</text>
  <rect class="zone" x="30" y="60" width="940" height="120" rx="10"/>
  <text class="zone-label" x="46" y="82" text-anchor="start">ONE REGION, THEN THE OTHER</text>
  <text class="lbl" x="46" y="174" text-anchor="start">4 apply errors on us-west, 90 to 178 rows behind after 10 s, caught up 15 to 16 s after the first alter. Nothing lost.</text>
  <text class="node-sub" x="60" y="100" text-anchor="start">us-east</text>
  <rect class="ok" x="130" y="86" width="820" height="18" rx="3"/>
  <text class="node-sub" x="60" y="130" text-anchor="start">us-west</text>
  <rect class="ok" x="130" y="116" width="120" height="18" rx="3"/>
  <rect class="bad" x="250" y="116" width="260" height="18" rx="3"/>
  <rect class="warn" x="510" y="116" width="160" height="18" rx="3"/>
  <rect class="ok" x="670" y="116" width="280" height="18" rx="3"/>
  <text class="lbl-b" x="256" y="129" text-anchor="start">apply fails, retries</text>
  <text class="lbl-b" x="516" y="129" text-anchor="start">catching up</text>
  <path class="ev" d="M250 94 L250 146"/>
  <text class="lbl" x="254" y="152" text-anchor="start">alter on us-east</text>
  <path class="ev" d="M510 94 L510 146"/>
  <text class="lbl" x="514" y="152" text-anchor="start">alter on us-west</text>
  <rect class="zone" x="30" y="200" width="940" height="120" rx="10"/>
  <text class="zone-label" x="46" y="222" text-anchor="start">PAUSE, ALTER EVERYWHERE, RESUME</text>
  <text class="lbl" x="46" y="314" text-anchor="start">Writers blocked 0.9 to 1.5 s, no error, at five regions as well as two.</text>
  <text class="node-sub" x="60" y="240" text-anchor="start">us-east</text>
  <rect class="ok" x="130" y="226" width="330" height="18" rx="3"/>
  <rect class="idle" x="460" y="226" width="70" height="18" rx="3"/>
  <rect class="ok" x="530" y="226" width="420" height="18" rx="3"/>
  <text class="node-sub" x="60" y="270" text-anchor="start">us-west</text>
  <rect class="ok" x="130" y="256" width="330" height="18" rx="3"/>
  <rect class="idle" x="460" y="256" width="70" height="18" rx="3"/>
  <rect class="ok" x="530" y="256" width="420" height="18" rx="3"/>
  <path class="ev" d="M480 234 L480 286"/>
  <text class="lbl" x="484" y="292" text-anchor="start">alter on each primary, one after the other</text>
  <rect class="zone" x="30" y="340" width="940" height="120" rx="10"/>
  <text class="zone-label" x="46" y="362" text-anchor="start">IN THE STREAM (PGCOPYDB, PGLOGICAL)</text>
  <text class="lbl" x="46" y="454" text-anchor="start">Each change reaches us-west within a second, no lag, no pause. Needs the tool in the path of the DDL.</text>
  <text class="node-sub" x="60" y="380" text-anchor="start">us-east</text>
  <rect class="ok" x="130" y="366" width="820" height="18" rx="3"/>
  <text class="node-sub" x="60" y="410" text-anchor="start">us-west</text>
  <rect class="ok" x="130" y="396" width="820" height="18" rx="3"/>
  <path class="ev" d="M400 374 L400 426"/>
  <text class="lbl" x="404" y="432" text-anchor="start">alter travels in the stream, between two rows</text>
  <text class="lbl" x="30" y="486" text-anchor="start">Green: writing or applying. Red: apply fails and retries. Grey: writers paused.</text>

</svg>
