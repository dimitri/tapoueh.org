<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 436" role="img" aria-label="Architecture of a schema-change pause. Several application nodes each run an application and a local PgBouncer reached through a unix domain socket. All the local PgBouncers connect over TCP to one central PgBouncer on the database node, which connects to Postgres. PAUSE and RESUME are issued on the central PgBouncer. The subscriptions of the other regions connect to Postgres directly and are not paused.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .n-own { stroke: #2a6fdb; }
    .n-wh { stroke: #7a5cc2; }
    .n-new { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .n-gate { stroke: #c2570c; stroke-width: 3.5; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lbl-b { font-size: 11.5px; fill: #37414f; font-weight: 700; }
    .lg { stroke: #c2570c; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    .lgb { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#m2); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; }
    .ok { fill: #8fd0a8; stroke: #1f7a46; stroke-width: 1.2; }
    .bad { fill: #f2b3ab; stroke: #c0392b; stroke-width: 1.2; }
    .warn { fill: #f6d8b8; stroke: #c2570c; stroke-width: 1.2; }
    .idle { fill: #dfe4ee; stroke: #8a96ab; stroke-width: 1.2; }
    .tick { stroke: #b9c4d6; stroke-width: 1; }
    .axis { stroke: #8a96ab; stroke-width: 1.5; }
    .ev { stroke: #37414f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .chip { fill: #fff; stroke-width: 1.4; }
    .c-core { stroke: #2a6fdb; } .c-paf { stroke: #7a5cc2; } .c-you { stroke: #c2570c; stroke-dasharray: 5 3; }
    .band-core { fill: #eaf1fd; stroke: #2a6fdb; stroke-width: 1.5; }
    .band-paf { fill: #f1ecfb; stroke: #7a5cc2; stroke-width: 1.5; }
    .band-you { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .badt { font-size: 11.5px; font-weight: 700; fill: #c0392b; }
    .okt { font-size: 11.5px; font-weight: 700; fill: #1f7a46; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .numc { fill: #c2570c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .n-own { stroke: #6ea8ff; } .n-wh { stroke: #b39af0; } .n-new { stroke: #5fb8d6; } .n-gate { stroke: #ff9a57; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .lbl, .lbl-b { fill: #c3cadb; }
      .lg, .lgb { stroke: #ff9a57; } .pr { stroke: #c3cadb; }
      .ok { fill: #1f4a33; stroke: #6fd69b; } .bad { fill: #5a2822; stroke: #ff7b6b; }
      .warn { fill: #4a3320; stroke: #ff9a57; } .idle { fill: #2a303c; stroke: #6b7790; }
      .tick { stroke: #3b465b; } .axis { stroke: #6b7790; } .ev { stroke: #c3cadb; }
      .chip { fill: #1d2129; } .c-core { stroke: #6ea8ff; } .c-paf { stroke: #b39af0; } .c-you { stroke: #ff9a57; }
      .band-core { fill: #1b2638; stroke: #6ea8ff; } .band-paf { fill: #251f36; stroke: #b39af0; } .band-you { fill: #33241a; stroke: #ff9a57; }
      .badt { fill: #ff7b6b; } .okt { fill: #6fd69b; } .numc { fill: #ff9a57; } .num { fill: #1d2129; }
    }
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <text class="title" x="30" y="32" text-anchor="start">The pause is applied where every application connection converges</text>
  <rect class="zone" x="20" y="56" width="390" height="310" rx="10"/>
  <text class="zone-label" x="36" y="78" text-anchor="start">APPLICATION NODES</text>
  <rect class="zone" x="590" y="56" width="390" height="310" rx="10"/>
  <text class="zone-label" x="606" y="78" text-anchor="start">DATABASE NODE</text>
  <rect class="node n-own" x="40" y="96" width="350" height="72" rx="8"/>
  <rect class="node n-own" x="54" y="110" width="104" height="44" rx="6"/>
  <text class="node-title" x="106" y="137" text-anchor="middle">app 1</text>
  <path class="pr" d="M158 132 L250 132"/>
  <text class="lbl" x="204" y="124" text-anchor="middle">unix socket</text>
  <rect class="node n-wh" x="250" y="110" width="126" height="44" rx="6"/>
  <text class="node-title" x="313" y="129" text-anchor="middle">pgbouncer</text>
  <text class="node-sub" x="313" y="145" text-anchor="middle">one per app node</text>
  <rect class="node n-own" x="40" y="184" width="350" height="72" rx="8"/>
  <rect class="node n-own" x="54" y="198" width="104" height="44" rx="6"/>
  <text class="node-title" x="106" y="225" text-anchor="middle">app 2</text>
  <path class="pr" d="M158 220 L250 220"/>
  <text class="lbl" x="204" y="212" text-anchor="middle">unix socket</text>
  <rect class="node n-wh" x="250" y="198" width="126" height="44" rx="6"/>
  <text class="node-title" x="313" y="217" text-anchor="middle">pgbouncer</text>
  <text class="node-sub" x="313" y="233" text-anchor="middle">one per app node</text>
  <rect class="node n-own" x="40" y="272" width="350" height="72" rx="8"/>
  <rect class="node n-own" x="54" y="286" width="104" height="44" rx="6"/>
  <text class="node-title" x="106" y="313" text-anchor="middle">app 3</text>
  <path class="pr" d="M158 308 L250 308"/>
  <text class="lbl" x="204" y="300" text-anchor="middle">unix socket</text>
  <rect class="node n-wh" x="250" y="286" width="126" height="44" rx="6"/>
  <text class="node-title" x="313" y="305" text-anchor="middle">pgbouncer</text>
  <text class="node-sub" x="313" y="321" text-anchor="middle">one per app node</text>
  <path class="pr" d="M390 132 L610 160"/>
  <path class="pr" d="M390 220 L610 188"/>
  <path class="pr" d="M390 308 L610 216"/>
  <text class="lbl" x="500" y="232" text-anchor="middle">TCP</text>
  <rect class="node n-gate" x="610" y="134" width="150" height="100" rx="8"/>
  <text class="node-title" x="685" y="176" text-anchor="middle">pgbouncer</text>
  <text class="node-sub" x="685" y="196" text-anchor="middle">the central one</text>
  <rect class="node n-wh" x="820" y="134" width="140" height="100" rx="8"/>
  <text class="node-title" x="890" y="176" text-anchor="middle">Postgres</text>
  <text class="node-sub" x="890" y="196" text-anchor="middle">the primary</text>
  <path class="pr" d="M760 184 L820 184"/>
  <rect class="chip c-core" x="610" y="278" width="150" height="64" rx="6"/>
  <text class="lbl-b" x="685" y="302" text-anchor="middle">PAUSE app;</text>
  <text class="lbl-b" x="685" y="324" text-anchor="middle">RESUME app;</text>
  <path class="pr" d="M685 278 L685 238"/>
  <rect class="chip c-you" x="800" y="278" width="160" height="64" rx="6"/>
  <text class="lbl" x="880" y="302" text-anchor="middle">subscriptions of</text>
  <text class="lbl" x="880" y="320" text-anchor="middle">the other regions</text>
  <path class="lg" d="M880 278 L880 238"/>
  <text class="lbl" x="30" y="396" text-anchor="start">Every application connection ends at the central PgBouncer, however many application nodes there are. PAUSE holds the new transactions there,</text>
  <text class="lbl" x="30" y="416" text-anchor="start">lets the running ones finish, and returns once no server connection is left; RESUME releases the held ones. Replication links connect to Postgres directly.</text>

</svg>
