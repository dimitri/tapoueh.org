<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="A pg_auto_failover-managed primary and standby, with a failover-enabled logical slot on the primary feeding a consumer. Physical replication keeps the standby current, including the slot's own state, since synchronized_standby_slots is set. On promotion the consumer reconnects to the same slot, now on the new primary, and resumes at its last confirmed LSN: duplicates are possible, a hole is not, as long as the slot was synced and not temporary at promotion time.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .node-primary { stroke: #2a6fdb; }
    .node-standby { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-consumer { stroke: #556; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; marker-end: url(#m1); }
    .ls { stroke: #c2570c; stroke-width: 2.5; fill: none; marker-end: url(#m2); }
    .lf { stroke: #c2570c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#m2); }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lblbg { fill: #fff; opacity: 0.9; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .node-primary { stroke: #6ea8ff; }
      .node-standby { stroke: #5fb8d6; } .node-consumer { stroke: #99a; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .pr { stroke: #c3cadb; } .ls { stroke: #ff9a57; } .lf { stroke: #ff9a57; }
      .lbl { fill: #c3cadb; } .lblbg { fill: #15181e; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>

  <text class="title" x="30" y="32">A failover-safe logical slot, driven by pg_auto_failover</text>

  <rect class="zone" x="40" y="60" width="430" height="300" rx="12"/>
  <text class="zone-label" x="56" y="84">PG_AUTO_FAILOVER GROUP</text>

  <rect class="node node-primary" x="80" y="120" width="180" height="80" rx="8"/>
  <text class="node-title" x="170" y="155" text-anchor="middle">Primary</text>
  <text class="node-sub" x="170" y="175" text-anchor="middle">slot: failover = true</text>

  <rect class="node node-standby" x="80" y="260" width="180" height="80" rx="8"/>
  <text class="node-title" x="170" y="295" text-anchor="middle">Standby</text>
  <text class="node-sub" x="170" y="315" text-anchor="middle">synced_standby_slots</text>

  <path class="pr" d="M170 200 L170 256"/>
  <text class="lbl" x="178" y="232">physical</text>
  <text class="lbl" x="178" y="246">replication</text>

  <rect class="node node-consumer" x="650" y="150" width="210" height="80" rx="8"/>
  <text class="node-title" x="755" y="185" text-anchor="middle">Consumer</text>
  <text class="node-sub" x="755" y="205" text-anchor="middle">persists last confirmed LSN</text>

  <path class="ls" d="M260 150 L645 180"/>
  <rect class="lblbg" x="340" y="140" width="190" height="18"/>
  <text class="lbl" x="350" y="153" text-anchor="middle">logical slot, normal operation</text>

  <path class="lf" d="M260 310 Q 500 380 645 210"/>
  <rect class="lblbg" x="330" y="345" width="340" height="34"/>
  <text class="lbl" x="336" y="358">after promotion: same slot, same consumer,</text>
  <text class="lbl" x="336" y="372">resumes at its last confirmed LSN</text>
</svg>
