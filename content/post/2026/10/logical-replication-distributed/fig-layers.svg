<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="Three layers of the five-region system. Core Postgres does the replication: row filters on region, publications and subscriptions, origin to avoid loops, failover slots, conflict counters and sequence synchronisation. pg_auto_failover runs one group per region: it promotes a standby and keeps synchronized_standby_slots right. Still yours: the region key in the application, schema changes, the consumer check after a promotion, joining a region, conflict resolution and global sequences.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .n-own { stroke: #2a6fdb; }
    .n-wh { stroke: #7a5cc2; }
    .n-new { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lbl-b { font-size: 11.5px; fill: #37414f; font-weight: 700; }
    .lg { stroke: #c2570c; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    .lgb { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#m2); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; }
    .ok { fill: #8fd0a8; stroke: #1f7a46; stroke-width: 1.2; }
    .bad { fill: #f2b3ab; stroke: #c0392b; stroke-width: 1.2; }
    .warn { fill: #f6d8b8; stroke: #c2570c; stroke-width: 1.2; }
    .idle { fill: #dfe4ee; stroke: #8a96ab; stroke-width: 1.2; }
    .tick { stroke: #b9c4d6; stroke-width: 1; }
    .axis { stroke: #8a96ab; stroke-width: 1.5; }
    .ev { stroke: #37414f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .chip { fill: #fff; stroke-width: 1.4; }
    .c-core { stroke: #2a6fdb; } .c-paf { stroke: #7a5cc2; } .c-you { stroke: #c2570c; stroke-dasharray: 5 3; }
    .band-core { fill: #eaf1fd; stroke: #2a6fdb; stroke-width: 1.5; }
    .band-paf { fill: #f1ecfb; stroke: #7a5cc2; stroke-width: 1.5; }
    .band-you { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .badt { font-size: 11.5px; font-weight: 700; fill: #c0392b; }
    .okt { font-size: 11.5px; font-weight: 700; fill: #1f7a46; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .numc { fill: #c2570c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .n-own { stroke: #6ea8ff; } .n-wh { stroke: #b39af0; } .n-new { stroke: #5fb8d6; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .lbl, .lbl-b { fill: #c3cadb; }
      .lg, .lgb { stroke: #ff9a57; } .pr { stroke: #c3cadb; }
      .ok { fill: #1f4a33; stroke: #6fd69b; } .bad { fill: #5a2822; stroke: #ff7b6b; }
      .warn { fill: #4a3320; stroke: #ff9a57; } .idle { fill: #2a303c; stroke: #6b7790; }
      .tick { stroke: #3b465b; } .axis { stroke: #6b7790; } .ev { stroke: #c3cadb; }
      .chip { fill: #1d2129; } .c-core { stroke: #6ea8ff; } .c-paf { stroke: #b39af0; } .c-you { stroke: #ff9a57; }
      .band-core { fill: #1b2638; stroke: #6ea8ff; } .band-paf { fill: #251f36; stroke: #b39af0; } .band-you { fill: #33241a; stroke: #ff9a57; }
      .badt { fill: #ff7b6b; } .okt { fill: #6fd69b; } .numc { fill: #ff9a57; } .num { fill: #1d2129; }
    }
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <text class="title" x="30" y="32" text-anchor="start">What does the work, and what is left</text>
  <rect class="band-core" x="30" y="56" width="940" height="136" rx="12"/>
  <text class="zone-label" x="46" y="80" text-anchor="start">CORE POSTGRES, 15 TO 19</text>
  <rect class="chip c-core" x="46" y="94" width="177" height="34" rx="6"/>
  <text class="lbl" x="134.5" y="116" text-anchor="middle">row filters on region</text>
  <rect class="chip c-core" x="235" y="94" width="240" height="34" rx="6"/>
  <text class="lbl" x="355.0" y="116" text-anchor="middle">publications and subscriptions</text>
  <rect class="chip c-core" x="487" y="94" width="142" height="34" rx="6"/>
  <text class="lbl" x="558.0" y="116" text-anchor="middle">origin, no loops</text>
  <rect class="chip c-core" x="46" y="138" width="128" height="34" rx="6"/>
  <text class="lbl" x="110.0" y="160" text-anchor="middle">failover slots</text>
  <rect class="chip c-core" x="186" y="138" width="149" height="34" rx="6"/>
  <text class="lbl" x="260.5" y="160" text-anchor="middle">conflict counters</text>
  <rect class="chip c-core" x="347" y="138" width="156" height="34" rx="6"/>
  <text class="lbl" x="425.0" y="160" text-anchor="middle">sequence sync (19)</text>
  <rect class="band-paf" x="30" y="212" width="940" height="92" rx="12"/>
  <text class="zone-label" x="46" y="236" text-anchor="start">PG_AUTO_FAILOVER, ONE GROUP PER REGION</text>
  <rect class="chip c-paf" x="46" y="250" width="156" height="34" rx="6"/>
  <text class="lbl" x="124.0" y="272" text-anchor="middle">promotes a standby</text>
  <rect class="chip c-paf" x="214" y="250" width="296" height="34" rx="6"/>
  <text class="lbl" x="362.0" y="272" text-anchor="middle">keeps synchronized_standby_slots right</text>
  <rect class="chip c-paf" x="522" y="250" width="219" height="34" rx="6"/>
  <text class="lbl" x="631.5" y="272" text-anchor="middle">monitor, 3 nodes per region</text>
  <rect class="band-you" x="30" y="324" width="940" height="136" rx="12"/>
  <text class="zone-label" x="46" y="348" text-anchor="start">STILL YOURS</text>
  <rect class="chip c-you" x="46" y="362" width="268" height="34" rx="6"/>
  <text class="lbl" x="180.0" y="384" text-anchor="middle">the region key, in the application</text>
  <rect class="chip c-you" x="326" y="362" width="359" height="34" rx="6"/>
  <text class="lbl" x="505.5" y="384" text-anchor="middle">schema changes: a pause, or pgcopydb, pglogical</text>
  <rect class="chip c-you" x="46" y="406" width="254" height="34" rx="6"/>
  <text class="lbl" x="173.0" y="428" text-anchor="middle">consumer check after a promotion</text>
  <rect class="chip c-you" x="312" y="406" width="261" height="34" rx="6"/>
  <text class="lbl" x="442.5" y="428" text-anchor="middle">joining a region: five statements</text>
  <rect class="chip c-you" x="585" y="406" width="163" height="34" rx="6"/>
  <text class="lbl" x="666.5" y="428" text-anchor="middle">conflict resolution</text>
  <rect class="chip c-you" x="760" y="406" width="142" height="34" rx="6"/>
  <text class="lbl" x="831.0" y="428" text-anchor="middle">global sequences</text>

</svg>
