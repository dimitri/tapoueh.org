<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 528" role="img" aria-label="Three ways to do the first copy and the steady link of a new region. Core only: core copies, and the source keeps its WAL for the whole copy, then core streams; one tool, but a long copy holds WAL. pgcopydb only: pgcopydb copies in parallel and keeps streaming, the source recycles its WAL because pgcopydb spools it on its own host, but the link is one way, table-level and writes every change twice. pgcopydb then core: pgcopydb copies in parallel and spools the changes, then hands its slot to a core subscription at a marker; no WAL held on the source and a core steady link, but the handover has to be exact and there is no DDL in the stream.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .n-own { stroke: #2a6fdb; }
    .n-wh { stroke: #7a5cc2; }
    .n-new { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .n-gate { stroke: #c2570c; stroke-width: 3.5; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lbl-b { font-size: 11.5px; fill: #37414f; font-weight: 700; }
    .lg { stroke: #c2570c; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    .lgb { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#m2); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; }
    .ok { fill: #8fd0a8; stroke: #1f7a46; stroke-width: 1.2; }
    .bad { fill: #f2b3ab; stroke: #c0392b; stroke-width: 1.2; }
    .warn { fill: #f6d8b8; stroke: #c2570c; stroke-width: 1.2; }
    .idle { fill: #dfe4ee; stroke: #8a96ab; stroke-width: 1.2; }
    .tick { stroke: #b9c4d6; stroke-width: 1; }
    .axis { stroke: #8a96ab; stroke-width: 1.5; }
    .ev { stroke: #37414f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .chip { fill: #fff; stroke-width: 1.4; }
    .c-core { stroke: #2a6fdb; } .c-paf { stroke: #7a5cc2; } .c-you { stroke: #c2570c; stroke-dasharray: 5 3; }
    .band-core { fill: #eaf1fd; stroke: #2a6fdb; stroke-width: 1.5; }
    .band-paf { fill: #f1ecfb; stroke: #7a5cc2; stroke-width: 1.5; }
    .band-you { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .badt { font-size: 11.5px; font-weight: 700; fill: #c0392b; }
    .okt { font-size: 11.5px; font-weight: 700; fill: #1f7a46; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .numc { fill: #c2570c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .n-own { stroke: #6ea8ff; } .n-wh { stroke: #b39af0; } .n-new { stroke: #5fb8d6; } .n-gate { stroke: #ff9a57; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .lbl, .lbl-b { fill: #c3cadb; }
      .lg, .lgb { stroke: #ff9a57; } .pr { stroke: #c3cadb; }
      .ok { fill: #1f4a33; stroke: #6fd69b; } .bad { fill: #5a2822; stroke: #ff7b6b; }
      .warn { fill: #4a3320; stroke: #ff9a57; } .idle { fill: #2a303c; stroke: #6b7790; }
      .tick { stroke: #3b465b; } .axis { stroke: #6b7790; } .ev { stroke: #c3cadb; }
      .chip { fill: #1d2129; } .c-core { stroke: #6ea8ff; } .c-paf { stroke: #b39af0; } .c-you { stroke: #ff9a57; }
      .band-core { fill: #1b2638; stroke: #6ea8ff; } .band-paf { fill: #251f36; stroke: #b39af0; } .band-you { fill: #33241a; stroke: #ff9a57; }
      .badt { fill: #ff7b6b; } .okt { fill: #6fd69b; } .numc { fill: #ff9a57; } .num { fill: #1d2129; }
    }
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <text class="title" x="30" y="32" text-anchor="start">A first copy and a steady link: core alone, pgcopydb alone, or the two in turn</text>
  <text class="zone-label" x="190" y="64" text-anchor="start">INITIAL COPY</text>
  <text class="zone-label" x="570" y="64" text-anchor="start">STEADY STREAMING</text>
  <path class="tick" d="M20 68 L980 68"/>
  <text class="node-title" x="20" y="110" text-anchor="start">Core only</text>
  <text class="node-sub" x="20" y="128" text-anchor="start">one subscription</text>
  <rect class="node n-own" x="190" y="84" width="380" height="36" rx="6"/>
  <text class="node-title" x="380" y="107" text-anchor="middle">copy by core</text>
  <rect class="node n-own" x="570" y="84" width="410" height="36" rx="6"/>
  <text class="node-title" x="775" y="107" text-anchor="middle">steady link by core</text>
  <rect class="warn" x="190" y="128" width="380" height="22" rx="4"/>
  <text class="lbl" x="380" y="143" text-anchor="middle">the source keeps its WAL for the whole copy</text>
  <text class="okt" x="190" y="174" text-anchor="start">+ one tool, no handover, nothing to get exactly right</text>
  <text class="badt" x="190" y="194" text-anchor="start">− a long copy holds WAL on the source; a table restarts when the connection drops</text>
  <path class="tick" d="M20 218 L980 218"/>
  <text class="node-title" x="20" y="260" text-anchor="start">pgcopydb only</text>
  <text class="node-sub" x="20" y="278" text-anchor="start">clone --follow</text>
  <rect class="node n-wh" x="190" y="234" width="380" height="36" rx="6"/>
  <text class="node-title" x="380" y="257" text-anchor="middle">copy by pgcopydb</text>
  <rect class="node n-wh" x="570" y="234" width="410" height="36" rx="6"/>
  <text class="node-title" x="775" y="257" text-anchor="middle">steady link by pgcopydb</text>
  <rect class="ok" x="190" y="278" width="380" height="22" rx="4"/>
  <text class="lbl" x="380" y="293" text-anchor="middle">the source recycles its WAL: pgcopydb spools it on its own host</text>
  <text class="okt" x="190" y="324" text-anchor="start">+ parallel streams, a table split over several, resumable; DDL travels as a message</text>
  <text class="badt" x="190" y="344" text-anchor="start">− one way and table-level, every change written twice: not the steady link of a multi-writer system</text>
  <path class="tick" d="M20 368 L980 368"/>
  <text class="node-title" x="20" y="410" text-anchor="start">pgcopydb, then core</text>
  <text class="node-sub" x="20" y="428" text-anchor="start">handover at a marker</text>
  <rect class="node n-wh" x="190" y="384" width="380" height="36" rx="6"/>
  <text class="node-title" x="380" y="407" text-anchor="middle">copy by pgcopydb</text>
  <rect class="node n-own" x="570" y="384" width="410" height="36" rx="6"/>
  <text class="node-title" x="775" y="407" text-anchor="middle">steady link by core</text>
  <rect class="ok" x="190" y="428" width="380" height="22" rx="4"/>
  <text class="lbl" x="380" y="443" text-anchor="middle">the source recycles its WAL: pgcopydb spools it on its own host</text>
  <text class="okt" x="190" y="474" text-anchor="start">+ the parallel, resumable copy of pgcopydb, no WAL held on the source, and the steady link is core</text>
  <text class="badt" x="190" y="494" text-anchor="start">− the handover has to be exact (spool applied, pgcopydb’s publication), and no DDL in the stream</text>
  <path class="ev" d="M570 378 L570 456"/>

</svg>
