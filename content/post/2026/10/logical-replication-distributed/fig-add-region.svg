<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="A fifth region, ap-southeast, a new pg_auto_failover group, is joined to the running system of four regions, which are in a chain. Only its neighbour ap-south changes: it gets a publication of everything but ap-southeast, which ap-southeast subscribes to with a first copy of the 600,000 rows, and a subscription to the publication of ap-southeast own rows, without a copy. The five statements are listed under the figure. The other regions need no change.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .n-own { stroke: #2a6fdb; }
    .n-wh { stroke: #7a5cc2; }
    .n-new { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lbl-b { font-size: 11.5px; fill: #37414f; font-weight: 700; }
    .lg { stroke: #c2570c; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    .lgb { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#m2); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; }
    .ok { fill: #8fd0a8; stroke: #1f7a46; stroke-width: 1.2; }
    .bad { fill: #f2b3ab; stroke: #c0392b; stroke-width: 1.2; }
    .warn { fill: #f6d8b8; stroke: #c2570c; stroke-width: 1.2; }
    .idle { fill: #dfe4ee; stroke: #8a96ab; stroke-width: 1.2; }
    .tick { stroke: #b9c4d6; stroke-width: 1; }
    .axis { stroke: #8a96ab; stroke-width: 1.5; }
    .ev { stroke: #37414f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .chip { fill: #fff; stroke-width: 1.4; }
    .c-core { stroke: #2a6fdb; } .c-paf { stroke: #7a5cc2; } .c-you { stroke: #c2570c; stroke-dasharray: 5 3; }
    .band-core { fill: #eaf1fd; stroke: #2a6fdb; stroke-width: 1.5; }
    .band-paf { fill: #f1ecfb; stroke: #7a5cc2; stroke-width: 1.5; }
    .band-you { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .badt { font-size: 11.5px; font-weight: 700; fill: #c0392b; }
    .okt { font-size: 11.5px; font-weight: 700; fill: #1f7a46; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .numc { fill: #c2570c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .n-own { stroke: #6ea8ff; } .n-wh { stroke: #b39af0; } .n-new { stroke: #5fb8d6; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .lbl, .lbl-b { fill: #c3cadb; }
      .lg, .lgb { stroke: #ff9a57; } .pr { stroke: #c3cadb; }
      .ok { fill: #1f4a33; stroke: #6fd69b; } .bad { fill: #5a2822; stroke: #ff7b6b; }
      .warn { fill: #4a3320; stroke: #ff9a57; } .idle { fill: #2a303c; stroke: #6b7790; }
      .tick { stroke: #3b465b; } .axis { stroke: #6b7790; } .ev { stroke: #c3cadb; }
      .chip { fill: #1d2129; } .c-core { stroke: #6ea8ff; } .c-paf { stroke: #b39af0; } .c-you { stroke: #ff9a57; }
      .band-core { fill: #1b2638; stroke: #6ea8ff; } .band-paf { fill: #251f36; stroke: #b39af0; } .band-you { fill: #33241a; stroke: #ff9a57; }
      .badt { fill: #ff7b6b; } .okt { fill: #6fd69b; } .numc { fill: #ff9a57; } .num { fill: #1d2129; }
    }
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <text class="title" x="30" y="32" text-anchor="start">A fifth region joins the running system with five statements</text>
  <rect class="zone" x="30" y="60" width="640" height="230" rx="12"/>
  <text class="zone-label" x="46" y="82" text-anchor="start">THE RUNNING SYSTEM, WRITERS STILL WRITING</text>
  <rect class="node n-own" x="50" y="130" width="110" height="100" rx="8"/>
  <text class="node-title" x="105" y="185" text-anchor="middle">us-west</text>
  <rect class="node n-own" x="190" y="130" width="110" height="100" rx="8"/>
  <text class="node-title" x="245" y="185" text-anchor="middle">us-east</text>
  <rect class="node n-wh" x="330" y="130" width="110" height="100" rx="8"/>
  <text class="node-title" x="385" y="185" text-anchor="middle">eu-west</text>
  <rect class="node n-own" x="470" y="130" width="110" height="100" rx="8"/>
  <text class="node-title" x="525" y="185" text-anchor="middle">ap-south</text>
  <path class="pr" d="M164 166 L186 166"/>
  <path class="pr" d="M186 194 L164 194"/>
  <path class="pr" d="M304 166 L326 166"/>
  <path class="pr" d="M326 194 L304 194"/>
  <path class="pr" d="M444 166 L466 166"/>
  <path class="pr" d="M466 194 L444 194"/>
  <rect class="node n-new" x="770" y="130" width="200" height="100" rx="8"/>
  <text class="node-title" x="870" y="175" text-anchor="middle">ap-southeast</text>
  <text class="node-sub" x="870" y="195" text-anchor="middle">new group: monitor + 3 nodes</text>
  <path class="lgb" d="M584 160 L766 160"/>
  <text class="lbl-b" x="675" y="142" text-anchor="middle">first copy, 600,000 rows in 2 s</text>
  <path class="lg" d="M766 205 L584 205"/>
  <text class="lbl" x="675" y="226" text-anchor="middle">its own rows, from now on</text>
  <text class="lbl" x="40" y="330" text-anchor="start">1  on ap-southeast: create the table</text>
  <text class="lbl" x="40" y="352" text-anchor="start">2  on ap-south: publication for ap-southeast, filter: everything but its own rows</text>
  <text class="lbl" x="40" y="374" text-anchor="start">3  on ap-southeast: subscription to it, copy_data = true</text>
  <text class="lbl" x="40" y="396" text-anchor="start">4  on ap-southeast: publication of its own rows</text>
  <text class="lbl" x="40" y="418" text-anchor="start">5  on ap-south: subscription to it, copy_data = false</text>
  <text class="lbl" x="40" y="455" text-anchor="start">Nothing changes on the other four regions: pub_to_eu_west on ap-south has listed ap-southeast since the beginning, so its rows flow on.</text>

</svg>
