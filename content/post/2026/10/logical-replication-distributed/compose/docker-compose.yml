name: lrdist

x-pg-common: &pg-common
  environment:
    POSTGRES_PASSWORD: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
    interval: 1s
    timeout: 3s
    retries: 60

x-pgaf: &pgaf
  image: lrdist-pgaf:17
  environment:
    PGDATA: /data/pgdata
  tmpfs: ["/data:uid=999,gid=999,mode=0755"]

services:
  # ---------------- regions: one pg_auto_failover group each (profiles a, c, f, g) ----------------
  us-east-monitor:
    <<: *pgaf
    profiles: [a, c, f, g]
    build:
      context: .
      dockerfile: Dockerfile.pgautofailover
      args: { PGVERSION: "17" }
    hostname: us-east-monitor
    command: ["create", "monitor", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--hostname", "us-east-monitor", "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 90

  us-east-a:
    <<: *pgaf
    profiles: [a, c, f, g]
    hostname: us-east-a
    depends_on:
      us-east-monitor: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "us-east-a", "--name", "us-east-a",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@us-east-monitor/pg_auto_failover?sslmode=require",
              "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 1s
      timeout: 3s
      retries: 120

  us-east-b:
    <<: *pgaf
    profiles: [a, c, f, g]
    hostname: us-east-b
    depends_on:
      us-east-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "us-east-b", "--name", "us-east-b",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@us-east-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  us-east-c:
    <<: *pgaf
    profiles: [a, c, f, g]
    hostname: us-east-c
    depends_on:
      us-east-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "us-east-c", "--name", "us-east-c",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@us-east-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  us-west-monitor:
    <<: *pgaf
    profiles: [c, f, g]
    hostname: us-west-monitor
    command: ["create", "monitor", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--hostname", "us-west-monitor", "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 90

  us-west-a:
    <<: *pgaf
    profiles: [c, f, g]
    hostname: us-west-a
    depends_on:
      us-west-monitor: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "us-west-a", "--name", "us-west-a",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@us-west-monitor/pg_auto_failover?sslmode=require",
              "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 1s
      timeout: 3s
      retries: 120

  us-west-b:
    <<: *pgaf
    profiles: [c, f, g]
    hostname: us-west-b
    depends_on:
      us-west-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "us-west-b", "--name", "us-west-b",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@us-west-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  us-west-c:
    <<: *pgaf
    profiles: [c, f, g]
    hostname: us-west-c
    depends_on:
      us-west-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "us-west-c", "--name", "us-west-c",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@us-west-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  ap-south-monitor:
    <<: *pgaf
    profiles: [c]
    hostname: ap-south-monitor
    command: ["create", "monitor", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--hostname", "ap-south-monitor", "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 90

  ap-south-a:
    <<: *pgaf
    profiles: [c]
    hostname: ap-south-a
    depends_on:
      ap-south-monitor: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "ap-south-a", "--name", "ap-south-a",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@ap-south-monitor/pg_auto_failover?sslmode=require",
              "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 1s
      timeout: 3s
      retries: 120

  ap-south-b:
    <<: *pgaf
    profiles: [c]
    hostname: ap-south-b
    depends_on:
      ap-south-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "ap-south-b", "--name", "ap-south-b",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@ap-south-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  ap-south-c:
    <<: *pgaf
    profiles: [c]
    hostname: ap-south-c
    depends_on:
      ap-south-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "ap-south-c", "--name", "ap-south-c",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@ap-south-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  ap-southeast-monitor:
    <<: *pgaf
    profiles: [c]
    hostname: ap-southeast-monitor
    command: ["create", "monitor", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--hostname", "ap-southeast-monitor", "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 90

  ap-southeast-a:
    <<: *pgaf
    profiles: [c]
    hostname: ap-southeast-a
    depends_on:
      ap-southeast-monitor: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "ap-southeast-a", "--name", "ap-southeast-a",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@ap-southeast-monitor/pg_auto_failover?sslmode=require",
              "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 1s
      timeout: 3s
      retries: 120

  ap-southeast-b:
    <<: *pgaf
    profiles: [c]
    hostname: ap-southeast-b
    depends_on:
      ap-southeast-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "ap-southeast-b", "--name", "ap-southeast-b",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@ap-southeast-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  ap-southeast-c:
    <<: *pgaf
    profiles: [c]
    hostname: ap-southeast-c
    depends_on:
      ap-southeast-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "ap-southeast-c", "--name", "ap-southeast-c",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@ap-southeast-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  eu-west-monitor:
    <<: *pgaf
    profiles: [c]
    hostname: eu-west-monitor
    command: ["create", "monitor", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--hostname", "eu-west-monitor", "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 90

  eu-west-a:
    <<: *pgaf
    profiles: [c]
    hostname: eu-west-a
    depends_on:
      eu-west-monitor: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "eu-west-a", "--name", "eu-west-a",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@eu-west-monitor/pg_auto_failover?sslmode=require",
              "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 1s
      timeout: 3s
      retries: 120

  eu-west-b:
    <<: *pgaf
    profiles: [c]
    hostname: eu-west-b
    depends_on:
      eu-west-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "eu-west-b", "--name", "eu-west-b",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@eu-west-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  eu-west-c:
    <<: *pgaf
    profiles: [c]
    hostname: eu-west-c
    depends_on:
      eu-west-a: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "eu-west-c", "--name", "eu-west-c",
              "--dbname", "app",
              "--monitor", "postgres://autoctl_node@eu-west-monitor/pg_auto_failover?sslmode=require",
              "--run"]

  # the application and the CDC consumer: psql, pg_recvlogical, perl
  client:
    profiles: [a, f, g]
    image: lrdist-pgaf:17
    entrypoint: ["sleep", "infinity"]
    user: root
    volumes:
      - ./traffic:/traffic:ro
      - ./results:/results

  # profile g: pgcopydb carrying a one-way link between two regions, DDL included
  pgcopydb-g:
    profiles: [g]
    build:
      context: .
      dockerfile: Dockerfile.pgcopydb
      args: { PGVERSION: "17" }
    image: lrdist-pgcopydb:17
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./results:/results

  # ---------------- profile d: pgcopydb DDL-as-a-message, against PR #1064 ----------------
  d-source:
    <<: *pg-common
    profiles: [d]
    image: postgres:18
    command: >
      postgres -c wal_level=logical -c max_wal_senders=10
      -c max_replication_slots=10
    ports: ["127.0.0.1:5760:5432"]
    volumes: ["d-source-data:/var/lib/postgresql"]

  d-target:
    <<: *pg-common
    profiles: [d]
    image: postgres:18
    ports: ["127.0.0.1:5761:5432"]
    volumes: ["d-target-data:/var/lib/postgresql"]

  pgcopydb:
    profiles: [d]
    build:
      context: .
      dockerfile: Dockerfile.pgcopydb
      args: { PGVERSION: "18" }
    entrypoint: ["sleep", "infinity"]
    depends_on: [d-source, d-target]
    volumes:
      - ./sql:/sql:ro
      - ./results:/results

  # ---------------- profile e: pglogical on PostgreSQL 18 ----------------
  e-hub:
    <<: *pg-common
    profiles: [e]
    build:
      context: .
      dockerfile: Dockerfile.pglogical
      args: { PGVERSION: "18" }
    image: lrdist-pglogical:18
    command: &pgl-cmd >
      postgres -c shared_preload_libraries=pglogical
      -c output_plugin_libraries=pglogical_output
      -c wal_level=logical -c track_commit_timestamp=on
      -c max_worker_processes=24 -c max_replication_slots=16
      -c max_wal_senders=16 -c max_logical_replication_workers=12
      -c wal_retrieve_retry_interval=1s
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5770:5432"]
    tmpfs: ["/var/lib/postgresql"]

  e-w1:
    <<: *pg-common
    profiles: [e]
    image: lrdist-pglogical:18
    command: *pgl-cmd
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5771:5432"]
    tmpfs: ["/var/lib/postgresql"]
    depends_on: [e-hub]

  e-w2:
    <<: *pg-common
    profiles: [e]
    image: lrdist-pglogical:18
    command: *pgl-cmd
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5772:5432"]
    tmpfs: ["/var/lib/postgresql"]
    depends_on: [e-hub]

volumes:
  d-source-data:
  d-target-data:
