name: lrdist

x-pg-common: &pg-common
  environment:
    POSTGRES_PASSWORD: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
    interval: 1s
    timeout: 3s
    retries: 60

services:
  # ---------------- profile c: four primaries, conflict-free by key ----------------
  us-east:
    <<: *pg-common
    profiles: [c]
    image: postgres:17
    command: >
      postgres -c wal_level=logical -c max_wal_senders=20
      -c max_replication_slots=20 -c max_worker_processes=24
      -c max_logical_replication_workers=16
      -c log_line_prefix='[us-east %p] ' -c log_min_messages=warning
    ports: ["127.0.0.1:5750:5432"]
    volumes: ["us-east-data:/var/lib/postgresql/data"]

  us-west:
    <<: *pg-common
    profiles: [c]
    image: postgres:17
    command: >
      postgres -c wal_level=logical -c max_wal_senders=20
      -c max_replication_slots=20 -c max_worker_processes=24
      -c max_logical_replication_workers=16
      -c log_line_prefix='[us-west %p] ' -c log_min_messages=warning
    ports: ["127.0.0.1:5751:5432"]
    volumes: ["us-west-data:/var/lib/postgresql/data"]

  in-region:
    <<: *pg-common
    profiles: [c]
    image: postgres:17
    command: >
      postgres -c wal_level=logical -c max_wal_senders=20
      -c max_replication_slots=20 -c max_worker_processes=24
      -c max_logical_replication_workers=16
      -c log_line_prefix='[in %p] ' -c log_min_messages=warning
    ports: ["127.0.0.1:5752:5432"]
    volumes: ["in-data:/var/lib/postgresql/data"]

  au:
    <<: *pg-common
    profiles: [c]
    image: postgres:17
    command: >
      postgres -c wal_level=logical -c max_wal_senders=20
      -c max_replication_slots=20 -c max_worker_processes=24
      -c max_logical_replication_workers=16
      -c log_line_prefix='[au %p] ' -c log_min_messages=warning
    ports: ["127.0.0.1:5753:5432"]
    volumes: ["au-data:/var/lib/postgresql/data"]

  warehouse:
    <<: *pg-common
    profiles: [c]
    image: postgres:17
    command: >
      postgres -c wal_level=logical -c max_wal_senders=20
      -c max_replication_slots=20 -c max_worker_processes=24
      -c max_logical_replication_workers=16
      -c log_line_prefix='[warehouse %p] ' -c log_min_messages=warning
    ports: ["127.0.0.1:5754:5432"]
    volumes: ["warehouse-data:/var/lib/postgresql/data"]

  # the "application": psql + a shell traffic generator against all four
  traffic:
    profiles: [c]
    image: postgres:17
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./sql:/sql:ro
      - ./traffic:/traffic:ro
      - ./results:/results

  # ---------------- profile a: pg_auto_failover failover-slot continuity ----------------
  monitor:
    profiles: [a, f]
    build:
      context: .
      dockerfile: Dockerfile.pgautofailover
      args: { PGVERSION: "17" }
    image: lrdist-pgaf:17
    hostname: monitor
    environment:
      PGDATA: /data/pgdata
    volumes: ["monitor-data:/data"]
    command: ["create", "monitor", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--hostname", "monitor", "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  pg-a-primary:
    profiles: [a, f]
    image: lrdist-pgaf:17
    hostname: pg-a-primary
    environment:
      PGDATA: /data/pgdata
    volumes: ["pg-a-primary-data:/data"]
    depends_on:
      monitor: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "pg-a-primary", "--dbname", "app",
              "--monitor", "postgres://autoctl_node@monitor/pg_auto_failover?sslmode=require",
              "--run"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d app"]
      interval: 1s
      timeout: 3s
      retries: 90

  pg-a-standby:
    profiles: [a, f]
    image: lrdist-pgaf:17
    hostname: pg-a-standby
    environment:
      PGDATA: /data/pgdata
    volumes: ["pg-a-standby-data:/data"]
    depends_on:
      pg-a-primary: { condition: service_healthy }
    command: ["create", "postgres", "--pgdata", "/data/pgdata", "--auth", "trust",
              "--ssl-self-signed", "--pg-hba-lan", "--hostname", "pg-a-standby", "--dbname", "app",
              "--monitor", "postgres://autoctl_node@monitor/pg_auto_failover?sslmode=require",
              "--run"]

  # the application and the CDC consumer: psql, pg_recvlogical, perl
  a-client:
    profiles: [a, f]
    image: lrdist-pgaf:17
    entrypoint: ["sleep", "infinity"]
    depends_on: [monitor]
    volumes:
      - ./traffic:/traffic:ro
      - ./results:/results
    user: root

  # profile f: a second region, a plain Postgres, linked to the pg_auto_failover
  # group above by logical replication in both directions
  y:
    <<: *pg-common
    profiles: [f]
    image: postgres:17
    hostname: y
    command: >
      postgres -c wal_level=logical -c max_wal_senders=20
      -c max_replication_slots=20 -c max_logical_replication_workers=8
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: ["/var/lib/postgresql/data"]

  # ---------------- profile d: pgcopydb DDL-as-a-message, against PR #1064 ----------------
  d-source:
    <<: *pg-common
    profiles: [d]
    image: postgres:18
    command: >
      postgres -c wal_level=logical -c max_wal_senders=10
      -c max_replication_slots=10
    ports: ["127.0.0.1:5760:5432"]
    volumes: ["d-source-data:/var/lib/postgresql"]

  d-target:
    <<: *pg-common
    profiles: [d]
    image: postgres:18
    ports: ["127.0.0.1:5761:5432"]
    volumes: ["d-target-data:/var/lib/postgresql"]

  pgcopydb:
    profiles: [d]
    build:
      context: .
      dockerfile: Dockerfile.pgcopydb
      args: { PGVERSION: "18" }
    entrypoint: ["sleep", "infinity"]
    depends_on: [d-source, d-target]
    volumes:
      - ./sql:/sql:ro
      - ./results:/results

  # ---------------- profile e: pglogical on PostgreSQL 18 ----------------
  e-hub:
    <<: *pg-common
    profiles: [e]
    build:
      context: .
      dockerfile: Dockerfile.pglogical
      args: { PGVERSION: "18" }
    image: lrdist-pglogical:18
    command: &pgl-cmd >
      postgres -c shared_preload_libraries=pglogical
      -c output_plugin_libraries=pglogical_output
      -c wal_level=logical -c track_commit_timestamp=on
      -c max_worker_processes=24 -c max_replication_slots=16
      -c max_wal_senders=16 -c max_logical_replication_workers=12
      -c wal_retrieve_retry_interval=1s
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5770:5432"]
    tmpfs: ["/var/lib/postgresql"]

  e-w1:
    <<: *pg-common
    profiles: [e]
    image: lrdist-pglogical:18
    command: *pgl-cmd
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5771:5432"]
    tmpfs: ["/var/lib/postgresql"]
    depends_on: [e-hub]

  e-w2:
    <<: *pg-common
    profiles: [e]
    image: lrdist-pglogical:18
    command: *pgl-cmd
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["127.0.0.1:5772:5432"]
    tmpfs: ["/var/lib/postgresql"]
    depends_on: [e-hub]

volumes:
  us-east-data:
  us-west-data:
  in-data:
  au-data:
  warehouse-data:
  monitor-data:
  pg-a-primary-data:
  pg-a-standby-data:
  d-source-data:
  d-target-data:
