<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="A stylised world map with one Postgres primary per region: Americas, Europe, and Asia-Pacific, each a shaded landmass with its own write-local primary inside it. Each region's row never leaves it: the primary key includes the region, so no two regions ever mint the same row. Each primary streams read-only, asynchronously, into one global warehouse for reporting, the same consolidation pattern as part 2 of this series, not a write path.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .land { fill: #eef3fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .land-label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .node-primary { stroke: #2a6fdb; }
    .node-title { font-size: 14px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 10.5px; fill: #5c6b84; }
    .disk-warehouse { fill: #fbeee1; stroke: #c2570c; stroke-width: 2; }
    .disk-line { fill: none; stroke: #c2570c; stroke-width: 1.2; opacity: 0.6; }
    .icon-label { font-size: 13px; font-weight: 700; fill: #1b2230; }
    .icon-sub { font-size: 10.5px; fill: #5c6b84; }
    .rep { stroke: #c2570c; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#m1); }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lblbg { fill: #fff; opacity: 0.9; }
    .key { font-size: 11px; fill: #5c6b84; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .land { fill: #1b2130; stroke: #4a5873; } .land-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .node-primary { stroke: #6ea8ff; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .disk-warehouse { fill: #3a2a1d; stroke: #ff9a57; } .disk-line { stroke: #ff9a57; }
      .icon-label { fill: #f0f0f0; } .icon-sub { fill: #aab2c2; }
      .rep { stroke: #ff9a57; } .lbl { fill: #c3cadb; } .lblbg { fill: #15181e; }
      .key { fill: #8b94a6; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>

  <text class="title" x="30" y="32">One writer per region: conflicts avoided by construction</text>

  <!-- Americas -->
  <path class="land" d="M60 70 L220 60 L260 130 L230 230 L170 280 L110 260 L70 180 Z"/>
  <text class="land-label" x="150" y="100" text-anchor="middle">AMERICAS</text>
  <rect class="node node-primary" x="105" y="150" width="140" height="70" rx="8"/>
  <text class="node-title" x="175" y="180" text-anchor="middle">Primary</text>
  <text class="node-sub" x="175" y="198" text-anchor="middle">region = 'americas'</text>

  <!-- Europe / Africa -->
  <path class="land" d="M400 55 L520 50 L560 110 L540 220 L480 310 L420 300 L390 190 L380 110 Z"/>
  <text class="land-label" x="470" y="85" text-anchor="middle">EUROPE</text>
  <rect class="node node-primary" x="400" y="150" width="140" height="70" rx="8"/>
  <text class="node-title" x="470" y="180" text-anchor="middle">Primary</text>
  <text class="node-sub" x="470" y="198" text-anchor="middle">region = 'europe'</text>

  <!-- Asia-Pacific -->
  <path class="land" d="M670 60 L900 50 L940 130 L900 220 L800 260 L720 230 L680 150 Z"/>
  <text class="land-label" x="800" y="90" text-anchor="middle">ASIA-PACIFIC</text>
  <rect class="node node-primary" x="730" y="150" width="140" height="70" rx="8"/>
  <text class="node-title" x="800" y="180" text-anchor="middle">Primary</text>
  <text class="node-sub" x="800" y="198" text-anchor="middle">region = 'apac'</text>

  <!-- global warehouse -->
  <path class="disk-warehouse" d="M420 420 L420 460 A80 16 0 0 0 580 460 L580 420 Z"/>
  <ellipse class="disk-warehouse" cx="500" cy="420" rx="80" ry="16"/>
  <text class="icon-label" x="500" y="500" text-anchor="middle">Global warehouse</text>
  <text class="icon-sub" x="500" y="515" text-anchor="middle">read-only roll-up, every region</text>

  <!-- replication arrows, read-only, async -->
  <path class="rep" d="M190 220 Q 280 330 430 435"/>
  <path class="rep" d="M470 220 L495 418"/>
  <path class="rep" d="M790 220 Q 650 340 570 435"/>

  <rect class="lblbg" x="340" y="350" width="330" height="18"/>
  <text class="lbl" x="350" y="363" text-anchor="middle">asynchronous, read-only — never a write path back</text>

  <text class="key" x="30" y="490">No row is ever owned by two regions: the primary key includes the region.</text>
  <text class="key" x="30" y="505">Nothing here resolves a conflict, because nothing here can produce one.</text>
</svg>
