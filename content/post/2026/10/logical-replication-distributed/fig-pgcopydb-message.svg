<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="An Event Trigger on the source emits a JSON message, type ddl, body the command text, with prefix pgcopydb, transactional true. pgcopydb follow decodes the new Message frame, filters on the prefix, parses the JSON, and dispatches on type. The ddl handler executes the body on the target through the same connection the rest of the apply worker already uses, inside the same commit-ordered stream as every other change.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .node { fill: #fff; stroke-width: 2; }
    .node-a { stroke: #556; }
    .node-b { stroke: #2a6fdb; }
    .node-c { stroke: #2e7d32; }
    .node-title { font-size: 14.5px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 10.5px; fill: #5c6b84; }
    .a { stroke: #37414f; stroke-width: 2; fill: none; marker-end: url(#m1); }
    .lbl { font-size: 11px; fill: #37414f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .node { fill: #1d2129; } .node-a { stroke: #99a; } .node-b { stroke: #6ea8ff; } .node-c { stroke: #66bb6a; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .a { stroke: #c3cadb; } .lbl { fill: #c3cadb; }
    }
  </style>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#37414f"/></marker>
  </defs>

  <text class="title" x="30" y="32">DDL as a message, not a queue table</text>

  <rect class="node node-a" x="20" y="90" width="210" height="90" rx="8"/>
  <text class="node-title" x="125" y="122" text-anchor="middle">Source: Event Trigger</text>
  <text class="node-sub" x="125" y="142" text-anchor="middle">pg_logical_emit_message(true,</text>
  <text class="node-sub" x="125" y="156" text-anchor="middle">'pgcopydb', json)</text>

  <path class="a" d="M230 135 L280 135"/>

  <rect class="node node-b" x="280" y="90" width="230" height="90" rx="8"/>
  <text class="node-title" x="395" y="118" text-anchor="middle">pgcopydb follow</text>
  <text class="node-sub" x="395" y="138" text-anchor="middle">decode 'M', filter on prefix,</text>
  <text class="node-sub" x="395" y="152" text-anchor="middle">parse JSON, dispatch on type</text>

  <path class="a" d="M510 135 L560 135"/>

  <rect class="node node-c" x="560" y="90" width="230" height="90" rx="8"/>
  <text class="node-title" x="675" y="118" text-anchor="middle">Target database</text>
  <text class="node-sub" x="675" y="138" text-anchor="middle">type "ddl": body executed</text>
  <text class="node-sub" x="675" y="152" text-anchor="middle">on the apply connection</text>

  <text class="lbl" x="30" y="220">Same commit-ordered stream as every INSERT/UPDATE/DELETE on the slot — no second pipeline, no barrier to coordinate.</text>
</svg>
