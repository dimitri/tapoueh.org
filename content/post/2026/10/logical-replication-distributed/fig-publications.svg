<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Five regions in a chain, us-west, us-east, eu-west, ap-south and ap-southeast, each pair of neighbours linked in both directions by row-filtered publications. Each arrow is labelled with the regions whose rows it carries. us-west sends its own rows to us-east and receives everything but its own; us-east sends the rows of us-east and us-west to the warehouse eu-west, which sends the rows of us-east and us-west on to ap-south, which sends everything but the rows of ap-southeast to ap-southeast. A row never travels back towards its owner.">
  <style>
    text { font-family: system-ui, sans-serif; fill: #222; }
    .title { font-size: 19px; font-weight: 700; }
    .zone { fill: #f4f6fb; stroke: #b9c4d6; stroke-width: 1.5; }
    .zone-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; fill: #5c6b84; }
    .node { fill: #fff; stroke-width: 2; }
    .n-own { stroke: #2a6fdb; }
    .n-wh { stroke: #7a5cc2; }
    .n-new { stroke: #2f8fae; stroke-dasharray: 5 3; }
    .node-title { font-size: 15px; font-weight: 700; fill: #1b2230; }
    .node-sub { font-size: 11px; fill: #5c6b84; }
    .lbl { font-size: 11.5px; fill: #37414f; }
    .lbl-b { font-size: 11.5px; fill: #37414f; font-weight: 700; }
    .lg { stroke: #c2570c; stroke-width: 2.2; fill: none; marker-end: url(#m2); }
    .lgb { stroke: #c2570c; stroke-width: 3; fill: none; marker-end: url(#m2); }
    .pr { stroke: #37414f; stroke-width: 2; fill: none; }
    .ok { fill: #8fd0a8; stroke: #1f7a46; stroke-width: 1.2; }
    .bad { fill: #f2b3ab; stroke: #c0392b; stroke-width: 1.2; }
    .warn { fill: #f6d8b8; stroke: #c2570c; stroke-width: 1.2; }
    .idle { fill: #dfe4ee; stroke: #8a96ab; stroke-width: 1.2; }
    .tick { stroke: #b9c4d6; stroke-width: 1; }
    .axis { stroke: #8a96ab; stroke-width: 1.5; }
    .ev { stroke: #37414f; stroke-width: 1.3; stroke-dasharray: 4 3; }
    .chip { fill: #fff; stroke-width: 1.4; }
    .c-core { stroke: #2a6fdb; } .c-paf { stroke: #7a5cc2; } .c-you { stroke: #c2570c; stroke-dasharray: 5 3; }
    .band-core { fill: #eaf1fd; stroke: #2a6fdb; stroke-width: 1.5; }
    .band-paf { fill: #f1ecfb; stroke: #7a5cc2; stroke-width: 1.5; }
    .band-you { fill: #fdf0e6; stroke: #c2570c; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .badt { font-size: 11.5px; font-weight: 700; fill: #c0392b; }
    .okt { font-size: 11.5px; font-weight: 700; fill: #1f7a46; }
    .num { font-size: 12px; font-weight: 700; fill: #fff; }
    .numc { fill: #c2570c; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e8e8e8; }
      .zone { fill: #1b2130; stroke: #4a5873; } .zone-label { fill: #9aa8c2; }
      .node { fill: #1d2129; } .n-own { stroke: #6ea8ff; } .n-wh { stroke: #b39af0; } .n-new { stroke: #5fb8d6; }
      .node-title { fill: #f0f0f0; } .node-sub { fill: #aab2c2; }
      .lbl, .lbl-b { fill: #c3cadb; }
      .lg, .lgb { stroke: #ff9a57; } .pr { stroke: #c3cadb; }
      .ok { fill: #1f4a33; stroke: #6fd69b; } .bad { fill: #5a2822; stroke: #ff7b6b; }
      .warn { fill: #4a3320; stroke: #ff9a57; } .idle { fill: #2a303c; stroke: #6b7790; }
      .tick { stroke: #3b465b; } .axis { stroke: #6b7790; } .ev { stroke: #c3cadb; }
      .chip { fill: #1d2129; } .c-core { stroke: #6ea8ff; } .c-paf { stroke: #b39af0; } .c-you { stroke: #ff9a57; }
      .band-core { fill: #1b2638; stroke: #6ea8ff; } .band-paf { fill: #251f36; stroke: #b39af0; } .band-you { fill: #33241a; stroke: #ff9a57; }
      .badt { fill: #ff7b6b; } .okt { fill: #6fd69b; } .numc { fill: #ff9a57; } .num { fill: #1d2129; }
    }
  </style>
  <defs>
    <marker id="m2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2570c"/></marker>
  </defs>
  <text class="title" x="30" y="32" text-anchor="start">Eight publications, one rule: a link carries only what the other side lacks</text>
  <rect class="node n-own" x="14" y="70" width="100" height="130" rx="8"/>
  <text class="node-title" x="64.0" y="130" text-anchor="middle">us-west</text>
  <text class="node-sub" x="64.0" y="150" text-anchor="middle">owns rows</text>
  <rect class="node n-own" x="232" y="70" width="100" height="130" rx="8"/>
  <text class="node-title" x="282.0" y="130" text-anchor="middle">us-east</text>
  <text class="node-sub" x="282.0" y="150" text-anchor="middle">owns rows, hub</text>
  <rect class="node n-wh" x="450" y="70" width="100" height="130" rx="8"/>
  <text class="node-title" x="500.0" y="130" text-anchor="middle">eu-west</text>
  <text class="node-sub" x="500.0" y="150" text-anchor="middle">warehouse, hub</text>
  <rect class="node n-own" x="668" y="70" width="100" height="130" rx="8"/>
  <text class="node-title" x="718.0" y="130" text-anchor="middle">ap-south</text>
  <text class="node-sub" x="718.0" y="150" text-anchor="middle">owns rows, hub</text>
  <rect class="node n-own" x="886" y="70" width="100" height="130" rx="8"/>
  <text class="node-title" x="936.0" y="130" text-anchor="middle">ap-southeast</text>
  <text class="node-sub" x="936.0" y="150" text-anchor="middle">owns rows</text>
  <path class="lg" d="M120 126 L226 126"/>
  <path class="lg" d="M226 168 L120 168"/>
  <text class="lbl" x="173.0" y="102" text-anchor="middle">us-west</text>
  <text class="lbl" x="173.0" y="186" text-anchor="middle">everything</text>
  <text class="lbl" x="173.0" y="199" text-anchor="middle">but us-west</text>
  <path class="lg" d="M338 126 L444 126"/>
  <path class="lg" d="M444 168 L338 168"/>
  <text class="lbl" x="391.0" y="102" text-anchor="middle">us-east,</text>
  <text class="lbl" x="391.0" y="115" text-anchor="middle">us-west</text>
  <text class="lbl" x="391.0" y="186" text-anchor="middle">ap-south,</text>
  <text class="lbl" x="391.0" y="199" text-anchor="middle">ap-southeast</text>
  <path class="lg" d="M556 126 L662 126"/>
  <path class="lg" d="M662 168 L556 168"/>
  <text class="lbl" x="609.0" y="102" text-anchor="middle">us-east,</text>
  <text class="lbl" x="609.0" y="115" text-anchor="middle">us-west</text>
  <text class="lbl" x="609.0" y="186" text-anchor="middle">ap-south,</text>
  <text class="lbl" x="609.0" y="199" text-anchor="middle">ap-southeast</text>
  <path class="lg" d="M774 126 L880 126"/>
  <path class="lg" d="M880 168 L774 168"/>
  <text class="lbl" x="827.0" y="102" text-anchor="middle">everything</text>
  <text class="lbl" x="827.0" y="115" text-anchor="middle">but ap-southeast</text>
  <text class="lbl" x="827.0" y="186" text-anchor="middle">ap-southeast</text>
  <text class="lbl" x="30" y="250" text-anchor="start">Each arrow is a publication with a row filter on region, labelled with the regions whose rows it carries.</text>
  <text class="lbl" x="30" y="272" text-anchor="start">A row crosses a link only in the direction that leads away from its owner, so it never returns where it came from.</text>
  <text class="lbl" x="30" y="294" text-anchor="start">The rows of us-west reach ap-southeast in four hops, through us-east, eu-west and ap-south, and nobody opened a long-haul link for them.</text>

</svg>
