<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
{{ partial "head.html" . }}
  {{ block "head-extra" . }}{{ end }}
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ with resources.Get "js/zoom.js" | minify | fingerprint }}
  <script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}"></script>
  {{ end }}
</body>
</html>
